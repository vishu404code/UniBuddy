<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniBuddy — Campus AI Assistant & Query Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./runtime-config.js"></script>
<style>
:root{--bg:#FFFFFF;--ice:#EAF1FC;--lav:#F0EDFF;--bg2:#F4F6FA;--ind:#7187C9;--indd:#5a70b4;--navy:#263653;--deep:#263653;--ink:#263653;--slate:#687386;--bd:#E3E8F0;--sh:0 1px 2px rgba(38,54,83,.05),0 8px 22px -10px rgba(38,54,83,.14);--sh2:0 2px 4px rgba(38,54,83,.05),0 18px 38px -14px rgba(38,54,83,.24);--grad:linear-gradient(180deg,#6b81c3,#4f66a8);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14.5px/1.55 Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}h2{font-size:22px}h3{font-size:15.5px}
.ed{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.02em;line-height:1.15}h1.ed{font-size:clamp(32px,4.5vw,50px)}h2.ed{font-size:clamp(24px,3.2vw,32px)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{height:40px;padding:0 18px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);box-shadow:0 1px 2px rgba(38,54,83,.06);cursor:pointer;font-weight:500;transition:transform .2s,box-shadow .2s,border-color .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:var(--ind)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--grad);color:#fff;border-color:#4a60a0;box-shadow:0 8px 16px -8px rgba(79,102,168,.8),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.sm{height:32px;padding:0 13px;font-size:13px;border-radius:10px}.btn.w{width:100%}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--slate);transition:background .2s,color .2s,transform .2s;position:relative}.ib:hover{background:var(--lav);color:var(--navy)}.ib:active{transform:scale(.93)}
:focus-visible{outline:2px solid var(--ind);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
input,select,textarea{width:100%;height:42px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:0 14px;transition:border-color .2s,box-shadow .2s}textarea{height:auto;padding:11px 14px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ind);box-shadow:0 0 0 4px rgba(113,135,201,.18)}
label{display:block;font-size:13px;font-weight:500;margin:14px 0 6px}
.mut{color:var(--slate)}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#8ea2db,#5f76bb);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;box-shadow:0 5px 10px -4px rgba(113,135,201,.8),inset 0 1px 0 rgba(255,255,255,.4)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;cursor:pointer;letter-spacing:-.02em;color:var(--navy)}
.ico{width:42px;height:42px;border-radius:13px;background:linear-gradient(180deg,#fff,var(--ice));border:1px solid var(--bd);display:grid;place-items:center;color:var(--indd);box-shadow:0 5px 10px -5px rgba(38,54,83,.25),inset 0 1px 0 #fff;flex:none}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:20px}
.tint{background:linear-gradient(180deg,var(--ice),#fff)}
.lift{transition:transform .22s,box-shadow .22s,border-color .22s;cursor:pointer}.lift:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:#cdd8ee}
.fx{animation:fx .25s ease both}@keyframes fx{from{opacity:0;transform:translateY(6px)}}.in{animation:fx .25s ease both}
.lnk{background:none;border:0;cursor:pointer;color:var(--slate);padding:6px 10px;font-weight:500;transition:color .2s}.lnk:hover{color:var(--navy)}
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:99px;background:var(--lav);border:1px solid #e1dbfa;color:var(--indd);font-size:12.5px;font-weight:500;padding:4px 12px}
/* landing */
.land{position:relative;overflow:hidden;min-height:100vh}.land:before,.land:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.land:before{width:560px;height:560px;right:-160px;top:-180px;background:radial-gradient(circle,var(--lav),transparent 68%)}.land:after{width:520px;height:520px;left:-200px;top:260px;background:radial-gradient(circle,var(--ice),transparent 68%)}
.land>*{position:relative;z-index:1}
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px max(20px,5vw);gap:10px}.wrap{max-width:1060px;margin:auto;padding:0 max(20px,4vw)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:56px 0 72px}.hero p{color:var(--slate);font-size:17px;max-width:470px;margin:18px 0 28px}
.stage{position:relative;padding:28px 0 28px 18px}.prev{transform:perspective(1100px) rotateY(-6deg) rotateX(2deg);box-shadow:var(--sh2),0 40px 60px -34px rgba(38,54,83,.3);padding:18px;max-width:430px;margin-left:auto}
.chipf{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:500;box-shadow:var(--sh2);display:flex;gap:6px;align-items:center;color:var(--navy)}.c1{left:-6px;bottom:6px}.c2{right:6px;top:0;background:var(--lav)}
.bento{display:grid;grid-template-columns:1.1fr 1fr 1fr;grid-template-rows:auto auto;gap:14px;padding-bottom:72px}.bt{border-radius:20px;padding:24px;border:1px solid var(--bd);transition:transform .22s,box-shadow .22s;cursor:default}.bt:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.bt p{margin:6px 0 0;color:var(--slate);font-size:14px}.bt .ico{margin-bottom:16px}.bt.tall{grid-row:span 2;background:linear-gradient(160deg,var(--lav),#fff 75%)}.bt.tall h3{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:26px;line-height:1.15;margin-top:6px}.bt.tall p{font-size:15px}
.bt.b{background:var(--ice);grid-column:span 2}.bt.m{background:var(--bg2)}.bt.w{background:#fff}
.how{padding:0 0 72px}.hsteps{display:grid;grid-template-columns:repeat(3,1fr);margin-top:26px;position:relative}.hsteps:before{content:"";position:absolute;left:18px;right:18px;top:18px;height:2px;background:linear-gradient(90deg,var(--ind),#d5dcf1)}
.hs{position:relative;padding-right:24px}.num{width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--ind);color:var(--indd);display:grid;place-items:center;font-weight:600;margin-bottom:14px;position:relative}.hs p{margin:0;max-width:240px}
footer{padding:24px;text-align:center;color:var(--slate);font-size:13px;border-top:1px solid var(--bd)}

/* Redesigned Centered Login Page — matching screenshot visual aesthetic */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px 20px 48px;background:radial-gradient(1100px 520px at 50% -10%,var(--lav),transparent 72%),#ffffff}
.login-header{text-align:center;max-width:540px;margin-bottom:26px}
.login-card{width:100%;max-width:440px;background:#ffffff;border:1px solid var(--bd);border-radius:22px;padding:32px 28px;box-shadow:var(--sh);position:relative}
.g-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:44px;background:#ffffff;border:1px solid var(--bd);border-radius:12px;color:var(--navy);font-weight:500;font-size:14.5px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;box-shadow:0 1px 2px rgba(38,54,83,.05)}
.g-btn:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:#b4c5e7;background:#fafbff}
.g-btn:active{transform:scale(.98)}
.divider{display:flex;align-items:center;margin:18px 0 16px;color:var(--slate);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--bd)}
.divider:before{margin-right:12px}.divider:after{margin-left:12px}

/* Demo Accounts Section */
.demo-section{width:100%;max-width:960px;margin-top:44px}
.demo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}
.demo-card{background:#ffffff;border:1px solid var(--bd);border-radius:20px;padding:22px 18px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
.demo-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--ind)}
.demo-card.t-lav{background:var(--lav);border-color:#d5cef7}
.demo-card.t-ice{background:var(--ice);border-color:#cddaf5}
.demo-card h3{font-size:16px;font-weight:600;color:var(--navy);margin-top:6px}
.demo-card p{font-size:13px;color:var(--slate);line-height:1.45;margin:0;flex:1}
.demo-card .demo-badge{font-size:11.5px;color:var(--slate);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(38,54,83,.05);padding:3px 8px;border-radius:6px;width:fit-content;margin:4px 0}
.demo-card .btn{background:#ffffff;border:1px solid var(--bd);color:var(--navy);font-weight:500;margin-top:8px}
.demo-card:hover .btn{border-color:var(--ind);background:linear-gradient(180deg,#ffffff,var(--ice))}
.demo-card.t-lav .btn{background:#ffffff}
@media(max-width:860px){.demo-grid{grid-template-columns:repeat(2,1fr)}.login-wrap{padding:32px 16px}}
@media(max-width:520px){.demo-grid{grid-template-columns:1fr}}

/* App Shell */
.app{display:flex;height:100vh;height:100dvh}
.side{width:262px;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px;flex:none;transition:transform .22s}.side .logo{padding:2px 8px 18px}
.si{display:flex;align-items:center;gap:11px;width:100%;height:40px;padding:0 12px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--slate);text-align:left;transition:background .2s,color .2s,transform .2s;position:relative}
.si:hover{background:var(--bg2);color:var(--navy)}.si:active{transform:scale(.98)}.si.on{background:var(--lav);color:var(--indd);font-weight:600}.si.on:before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ind)}
.si.nc{background:var(--grad);color:#fff;font-weight:500;margin-bottom:14px;box-shadow:0 8px 16px -8px rgba(79,102,168,.9),inset 0 1px 0 rgba(255,255,255,.3);justify-content:center}.si.nc:hover{filter:brightness(1.06);color:#fff}
.sh{font-size:12px;color:var(--slate);padding:16px 12px 6px;font-weight:500}.hist{overflow:auto;flex:1;min-height:60px}.hist .si{height:34px;font-size:13.5px}.hist .si span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof{border-top:1px solid var(--bd);padding-top:12px;margin-top:10px}.prof .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#8ea2db,#5f76bb);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:radial-gradient(800px 280px at 75% -80px,var(--lav),transparent 70%),#fff}
.hd{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none;position:relative;border-bottom:1px solid var(--bd);background:rgba(255,255,255,.7);backdrop-filter:blur(8px)}
.menu{display:none}.on-ind{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--slate)}.pu{width:8px;height:8px;border-radius:50%;background:#58b394;animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(88,179,148,.45)}50%{box-shadow:0 0 0 5px rgba(88,179,148,0)}}
.page{flex:1;overflow:auto;padding:30px max(16px,3vw)}.pg{max-width:880px;margin:auto}.pg.wide{max-width:980px}

/* Chat */
.chatw{flex:1;display:flex;flex-direction:column;min-height:0}.msgs{flex:1;overflow:auto;padding:24px 16px}.col{max-width:740px;margin:auto}
.empty{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-bottom:30px}
.welcome{position:relative;padding:34px 30px 30px;border-radius:28px;background:radial-gradient(closest-side at 50% 30%,var(--lav),transparent),radial-gradient(closest-side at 80% 90%,var(--ice),transparent);width:100%}.welcome .mark{width:54px;height:54px;border-radius:17px;font-size:23px;margin:0 auto 16px}.welcome p{color:var(--slate);margin:8px 0 22px;font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px;margin:auto}.chip{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:99px;padding:9px 16px 9px 12px;font-weight:500;font-size:13.5px;cursor:pointer;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}.chip svg{color:var(--indd)}.chip:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--ind);background:var(--lav)}.chip:active{transform:scale(.97)}
.u{display:flex;justify-content:flex-end;margin:20px 0 4px}.ub{background:var(--lav);border:1px solid #e1dbfa;color:var(--navy);padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:80%}
.ts{font-size:11.5px;color:var(--slate);margin-top:4px;opacity:.85}.tsr{text-align:right}
.a{display:flex;gap:12px;margin:18px 0}.a .body{flex:1;min-width:0}.a .who{font-weight:600;font-size:13.5px;margin-bottom:2px}
.vb{display:inline-flex;align-items:center;gap:5px;background:var(--ice);color:var(--indd);border:1px solid #d3e0f6;border-radius:99px;padding:2px 10px 2px 8px;font-size:12px;font-weight:600}
.src{margin-top:10px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;background:var(--bg2);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--slate);border-left:3px solid var(--ind)}.src button{color:var(--indd);font-weight:600;background:none;border:0;cursor:pointer;padding:0;text-decoration:underline}
.nf{margin-top:12px;background:var(--lav);border:1px solid #e1dbfa;border-radius:14px;padding:14px}
.ld{display:inline-flex;gap:5px;padding:10px 0}.ld span{width:7px;height:7px;border-radius:50%;background:var(--ind);animation:bl 1.2s infinite}.ld span:nth-child(2){animation-delay:.18s}.ld span:nth-child(3){animation-delay:.36s}@keyframes bl{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.comp{padding:0 16px 14px}.cbox{max-width:740px;margin:auto;border:1px solid var(--bd);border-radius:20px;display:flex;align-items:center;gap:4px;padding:8px 8px 8px 6px;background:#fff;box-shadow:var(--sh2);transition:border-color .2s,box-shadow .2s}.cbox:focus-within{border-color:var(--ind);box-shadow:0 0 0 4px rgba(113,135,201,.16),var(--sh2)}
.cbox input{border:0;height:42px;flex:1;box-shadow:none!important;background:none}.send{width:40px;height:40px;border-radius:13px;border:0;background:var(--grad);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 12px -5px rgba(79,102,168,.8),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .2s}.send:hover{transform:translateY(-1px)}.send:active{transform:scale(.92)}
.note{text-align:center;font-size:12px;color:var(--slate);margin-top:8px;opacity:.85}

/* Dashboard Editorial */
.sub{color:var(--slate);margin:8px 0 0;font-size:15.5px}
.askp{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:center;margin:26px 0 8px;padding:22px 24px;border-radius:22px;background:linear-gradient(120deg,var(--lav),var(--ice));border:1px solid #e1e6f7;box-shadow:var(--sh)}.askp p{margin:4px 0 0;color:var(--slate);font-size:13.5px}
.strip{display:flex;margin:22px 0 10px;border-bottom:1px solid var(--bd);padding-bottom:20px}.sti{flex:1;display:flex;gap:12px;align-items:center;padding:0 20px;border-left:1px solid var(--bd);cursor:pointer;transition:transform .2s}.sti:first-child{border:0;padding-left:0}.sti:hover{transform:translateY(-2px)}.sti b{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:32px;line-height:1;display:block}.sti span{font-size:12.5px;color:var(--slate)}.sti .ic{width:34px;height:34px;border-radius:10px;background:var(--ice);display:grid;place-items:center;color:var(--indd)}
.dgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:36px;margin:22px 0}.sh2{font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.feat1{border-radius:16px;padding:18px;background:linear-gradient(150deg,var(--lav),#fff);border:1px solid #e1dbfa;margin-bottom:6px;transition:transform .2s,box-shadow .2s;cursor:pointer}.feat1:hover{transform:translateY(-2px);box-shadow:var(--sh)}.feat1 h3{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:19px;margin:8px 0 2px}
.cat{font-size:12px;font-weight:600;color:var(--indd)}.dt{font-size:12px;color:var(--slate)}
.hrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}.hrow:last-child{border:0}.hrow span:first-child{display:flex;flex-direction:column}
.dl{position:relative;padding-left:20px}.dl:before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--ind),#dfe5f5)}.dli{position:relative;padding:0 0 16px}.dli:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ind)}.dli b{font-weight:600;display:block}.dli small{color:var(--slate);font-size:12.5px}
.qp{background:var(--bg2);border-radius:18px;padding:6px 18px}.qr{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer;transition:padding .2s}.qr:last-child{border:0}.qr:hover{padding-left:6px}.qr small{color:var(--slate);font-weight:500}

/* Announcements Magazine */
.mag{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:24px}.am{border-radius:20px;padding:22px;border:1px solid var(--bd);grid-column:span 2;transition:transform .22s,box-shadow .22s;display:flex;flex-direction:column;gap:6px}.am:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.am.big{grid-column:span 4;grid-row:span 2;padding:30px;justify-content:flex-end;min-height:260px}.am.big h3{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:30px;line-height:1.12}.am:nth-child(4),.am:nth-child(5){grid-column:span 3}
.am.lav{background:linear-gradient(150deg,var(--lav),#fff 85%)}.am.blue{background:linear-gradient(150deg,var(--ice),#fff 85%)}.am.mist{background:var(--bg2)}.am p{margin:0;color:var(--slate);font-size:13.5px}
.imp{align-self:flex-start;background:var(--indd);color:#fff;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 10px}

/* Tables & Tickets */
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-weight:500;font-size:12.5px;color:var(--slate);padding:10px 12px;background:var(--bg2);white-space:nowrap}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}td{padding:12px;border-bottom:1px solid var(--bd)}
table{min-width:620px}.card .tw{padding-bottom:6px}tr.rw{cursor:pointer;transition:background .2s}tr.rw:hover,tr.rw.on{background:var(--lav)}.tw{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--bg2);color:var(--slate)}.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.s1{background:var(--ice);color:#4a68a8}.pill.s2{background:var(--lav);color:#6a58b8}.pill.s3{background:#e3f3ec;color:#2f7d62}
.pri{font-size:12.5px;font-weight:500}.pri.High{color:var(--indd);font-weight:700}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:18px}.two>div{display:grid;gap:16px;align-content:start}.lab{font-size:12.5px;color:var(--slate)}
.prog{height:6px;border-radius:9px;background:var(--bg2);overflow:hidden;margin:0 0 6px}.prog i{display:block;height:100%;width:var(--p);border-radius:9px;background:linear-gradient(90deg,#8ea2db,var(--indd));animation:gr .7s ease-out both}@keyframes gr{from{width:0}}

// Backend API client. No local/demo data is used as a fallback.
async function apiCall(endpoint,options={}){
  if(!UB_API_BASE)return {ok:false,status:0,error:'Backend URL is not configured for this website.'};
  const token=localStorage.getItem('ub-token');
  const headers={...(options.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(options.headers||{})};
  if(token)headers['Authorization']=`Bearer ${token}`;
  try{
    const res=await fetch(UB_API_BASE+endpoint,{...options,headers});
    if(!res.ok){
      let errData={};
      try{errData=await res.json()}catch(e){}
      return {ok:false,status:res.status,error:errData.detail||'Request failed'};
    }
    let data=null;try{data=await res.json()}catch(e){}
    return {ok:true,status:res.status,data};
  }catch(err){
    return {ok:false,status:0,error:err.message};
  }
}

function ticketView(t){return {...t,id:t.ticket_number||t.id,uuid:t.id,subj:t.subject,q:t.question,desc:t.description||'',pri:t.priority||'medium',status:t.status||'submitted',date:new Date(t.created_at).toLocaleDateString(),dept:t.department_name||'Department',fac:t.assigned_faculty_id?'Assigned':'Unassigned',reply:'',events:[]}}
async function loadViewData(view=S.view){
  if(!S.user)return;

  if(view==='ann'||view==='dash'||view==='x')tasks.push(apiCall('/announcements?limit=20').then(r=>{if(r.ok)S.announcements=pageItems(r).map(a=>({...a,c:a.category||'Notice',t:a.title,b:a.body,d:new Date(a.created_at).toLocaleDateString(),tone:'blue',big:a.is_important,imp:a.is_important}))}));
  if(['student','faculty','authority'].includes(S.role))tasks.push(apiCall('/departments').then(r=>{if(r.ok)S.departments=Array.isArray(r.data)?r.data:[]}));

  if(S.bell)tasks.push(apiCall('/notifications?limit=20').then(r=>{if(r.ok)S.notifs=pageItems(r).map(n=>({id:n.id,t:n.text||'Update',u:!n.is_read,tk:n.ticket_id}))}));
  await Promise.all(tasks);S.tickets.forEach(t=>{t.dept=S.departments.find(d=>d.id===t.department_id)?.name||'Department'});S.loading=false;R();
}

// Google Sign-In Credential Handler
async function handleGoogleCredential(id_token){
  if(!id_token)return;
  const er=$('#err');
  if(er)er.textContent='Verifying with UniBuddy Google Auth...';
  
  const res=await apiCall('/auth/google',{
    method:'POST',
    body:JSON.stringify({id_token})
  });
  
  if(res.ok&&res.data?.access_token){
    localStorage.setItem('ub-token',res.data.access_token);
    const meRes=await apiCall('/auth/me');
    if(meRes.ok&&meRes.data){
      const me=meRes.data;
      S.user={id:me.id,email:me.email,name:me.full_name||me.email.split('@')[0],full_name:me.full_name,role:me.role,campus_id:me.campus_id,department_id:me.department_id};
      S.role=me.role;
      S.scr='app';S.view=me.role=='student'?'chat':me.role=='faculty'?'tix':'x';R();await loadViewData(S.view);
      toast('Signed in as '+(me.full_name||me.email));
      return;
    }
    localStorage.removeItem('ub-token');
  }
  
  const messages={0:'Cannot reach UniBuddy right now. Check the backend address and try again.',401:'Google could not verify this sign-in. Try again.',409:'This Google account is linked differently. Contact the UniBuddy administrator.',503:'UniBuddy sign-in is not configured yet.'};
  if(er)er.textContent=messages[res.status]||'Sign-in failed. Please try again or contact the UniBuddy administrator.';
}

function msg(x,i){
  const c=x.n?' in':'';if(x.r=='u')return `<div class="u${c}"><div class="ub">${esc(x.t)}</div></div><div class="ts tsr">${x.time}</div>`;const L='<span class="mark">U</span>';
  if(x.k=='err')return `<div class="a${c}">${L}<div class="body"><div class="who">UniBuddy</div><p style="margin:8px 0 0">${x.t}</p></div></div>`;
  if(x.k=='ty')return `<div class="a${c}">${L}<div class="body"><div class="ld"><span></span><span></span><span></span></div></div></div>`;
  if(x.k=='ok')return `<div class="a${c}">${L}<div class="body"><div class="who">UniBuddy</div>${x.citations?.length?'<span class="vb">'+I('check')+' Verified Answer</span>':''}<p style="margin:8px 0 0">${esc(x.t)}</p>${x.citations?.length?`<div class="src">${x.citations.map(c=>`<span>Source: ${esc(c.title)}${c.page?` · page ${c.page}`:''}</span>`).join('')}</div>`:''}<div class="ts">${x.time}</div></div></div>`;
  return `<div class="a${c}">${L}<div class="body"><div class="who">UniBuddy</div>${esc(x.t||'I couldn’t find a verified answer in the published documents.')}<div class="nf">${x.fw?`<span class="vb">${I('check')} Forwarded as ${esc(x.fw)}</span>`:x.mid?`<button class="btn p sm" data-a="fwd" data-v="${i}">Forward to Faculty</button>`:''}</div><div class="ts">${x.time}</div></div></div>`}

// Ask AI Assistant — calls the real backend RAG endpoint.
async function ask(q){
  if(!q||!q.trim())return;
  const cleanQ=q.trim();
  S.chat.push({r:'u',t:cleanQ,time:now(),n:1});
  S.chat.push({r:'a',k:'ty',n:1});
  S.view='chat';
  R();
  
  // Ask the real backend RAG service; never fabricate a local answer.
  const backendRes=await apiCall('/chat/ask',{
    method:'POST',
    body:JSON.stringify({question:cleanQ,conversation_id:S.conversationId||null})
  });
  
  S.chat.pop(); // Remove typing indicator
  
  if(backendRes.ok&&backendRes.data){
    const d=backendRes.data;
    const userMessage=S.chat.at(-1);if(userMessage)userMessage.mid=d.user_message_id;
    if(d.conversation_id)S.conversationId=d.conversation_id;
    if(!d.abstained){
      S.chat.push({r:'a',k:'ok',t:d.answer,citations:d.citations||[],time:now(),n:1,mid:d.assistant_message_id});
    }else{
      S.chat.push({r:'a',k:'nf',t:d.answer,time:now(),n:1,mid:d.assistant_message_id});
    }
  }else{
    S.chat.push({r:'a',k:'err',t:'The UniBuddy assistant is unavailable right now. Please try again later.',time:now(),n:1});
  }
  R();
}

// Render Engine
function R(){
  const a=$('#app'),ae=document.activeElement?.id,v=ae?document.activeElement.value:'';let h;
  if(S.scr=='landing')h=landing();else if(S.scr=='login')h=login();else h=S.role=='student'?student():S.role=='faculty'?faculty():placeholder();
  a.innerHTML=h+(S.modal?modal():'')+(S.toast?`<div class="toast">${S.toast}</div>`:'');
  const t=S.fx=='screen'?a.firstElementChild:S.fx=='view'?$('.main > :last-child'):null;if(t)t.classList.add('fx');S.fx=0;S.chat.forEach(x=>x.n=0);
  if(ae&&$('#'+ae)&&ae!=='ci'&&ae!=='dq'){$('#'+ae).value=v;$('#'+ae).focus()}
  const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
  initGoogleAuth();
}

function initGoogleAuth(){
  if(S.scr=='login'&&!UB_GOOGLE_CLIENT_ID){const er=$('#err');if(er)er.textContent='Google sign-in is not configured for this site yet.';return}
  if(S.scr==='login'&&!UB_API_BASE){const er=$('#err');if(er)er.textContent='The backend address is not configured for this site yet.';return}
  if(S.scr=='login'&&window.google?.accounts?.id){
    try{
      window.google.accounts.id.initialize({
        client_id:UB_GOOGLE_CLIENT_ID,
        callback:(resp)=>{if(resp?.credential)handleGoogleCredential(resp.credential)}
      });
      const gbtn=$('#google-signin-btn');
      if(gbtn&&!gbtn.hasChildNodes()){
        window.google.accounts.id.renderButton(gbtn,{theme:'outline',size:'large',width:380,text:'continue_with',shape:'rectangular'});
      }
    }catch(e){}
  }else if(S.scr==='login'&&UB_GOOGLE_CLIENT_ID&&!window.__ubGoogleRetry){window.__ubGoogleRetry=setTimeout(()=>{window.__ubGoogleRetry=null;if(S.scr==='login')initGoogleAuth()},500)}
}

// Global Actions Dispatcher
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');
  if(!el){if(S.bell&&!e.target.closest('.drop')){S.bell=false;R()}return}
  const a=el.dataset.a,v=el.dataset.v;
  
  if(a=='home')go(S.user?'app':'landing');
  else if(a=='login-screen')go('login');
  else if(a=='scroll')$('#'+v)?.scrollIntoView({behavior:'smooth'});
  else if(a=='google-login'){
    if(window.google?.accounts?.id){
      try{window.google.accounts.id.prompt()}catch(x){toast('Google Identity prompt initiated')}
    }else{
      toast('Google Identity Services loaded. Connect Google client credentials to authenticate.');
    }
  }
  else if(a=='forgot'){toast('Password sign-in is not available. Use Google sign-in.')}
  else if(a=='pw'){const p=$('#pw');p.type=p.type=='password'?'text':'password'}
  else if(a=='login')doLogin()
  else if(a=='upload-doc-modal'){S.modal={type:'upload-doc'};R()}
  else if(a=='submit-doc-upload'){
    const title=$('#doc-title')?.value.trim(),file=$('#doc-file')?.files?.[0],vis=$('#doc-vis')?.value||'public_students',scope=$('#doc-scope')?.value||'campus';
    if(!title||!file){toast('Enter a title and choose a PDF.');return}
    if(file.type!=='application/pdf'&& !file.name.toLowerCase().endsWith('.pdf')){toast('Choose a PDF file.');return}
    const body=new FormData();body.append('title',title);body.append('file',file);body.append('visibility',vis);body.append('scope',scope);
    const res=await apiCall('/documents',{method:'POST',body});
    if(!res.ok){toast(typeof res.error==='string'?res.error:'Upload failed. Check your access and try again.');return}
    S.modal=null;await loadViewData('docs');toast('PDF uploaded. It will appear as a draft when processing finishes.');
  }
  else if(a=='publish-doc'||a=='archive-doc'){
    const action=a==='publish-doc'?'publish':'archive',res=await apiCall(`/documents/${v}/${action}`,{method:'POST'});
    if(!res.ok){toast(typeof res.error==='string'?res.error:'Document update failed.');return}
    await loadViewData('docs');toast(action==='publish'?'Document published.':'Document archived.');
  }
  else if(a=='logout'){
    try{localStorage.removeItem('ub-current-user');localStorage.removeItem('ub-token')}catch(x){}
    S.user=null;S.role=null;go('landing');
  }
  else if(a=='view'){if(S.view!=v)S.fx='view';S.view=v;S.bell=false;S.nav=false;R();loadViewData(v)}
  else if(a=='navo'){S.nav=true;R()}else if(a=='navx'){S.nav=false;R()}
  else if(a=='new')newChat();
  else if(a=='hist'){const h=S.hist.splice(+v,1)[0];if(S.chat.length)S.hist.unshift({title:ttl(),msgs:S.chat});S.chat=h.msgs;S.view='chat';S.nav=false;S.fx='view';R()}
  else if(a=='bell'){S.bell=!S.bell;R();if(S.bell)loadViewData(S.view)}
  else if(a=='readall'){await Promise.all(S.notifs.filter(n=>n.u).map(n=>apiCall(`/notifications/${n.id}/read`,{method:'PATCH'})));await loadViewData(S.view)}
  else if(a=='nt'){const n=S.notifs[v];if(n?.id)await apiCall(`/notifications/${n.id}/read`,{method:'PATCH'});S.bell=false;if(S.role==='student')S.view='queries';if(n?.tk){const ticket=await apiCall(`/tickets/${n.tk}`);if(ticket.ok)S.detail={ticket:{...ticketView(ticket.data.ticket),events:ticket.data.events||[]}}}R();loadViewData(S.view)}
  else if(a=='open'){S.sel=v;const uuid=S.tickets.find(t=>t.uuid===v||t.id===v)?.uuid||v;const res=await apiCall(`/tickets/${uuid}`);if(res.ok)S.detail={ticket:{...ticketView(res.data.ticket),events:res.data.events||[]},events:res.data.events||[]};if(S.role=='student'&&S.view!='queries'){S.view='queries';S.fx='view'}R()}
  else if(a=='dask')sendDash();
  else if(a=='sq')ask(v);
  else if(a=='send')sendChat();
  else if(a=='attach')toast('File attachments are not supported yet. You can describe the issue in the forwarded ticket.')
  else if(a=='fwd'){S.modal={i:+v,q:S.chat[+v-1]?.t||'Question'};R()}
  else if(a=='mc'){S.modal.out=1;R();setTimeout(()=>{S.modal=null;R()},160)}
  else if(a=='ms'){
    const m=S.modal,msg=S.chat[m.i-1],assistantMessage=S.chat[m.i],departmentId=$('#md')?.value;
    if(!departmentId){toast('No department is configured for your campus yet.');return}
    if(!msg?.mid){toast('The question is missing its server reference. Ask it again, then forward it.');return}
    const res=await apiCall(`/chat/messages/${msg.mid}/forward`,{method:'POST',body:JSON.stringify({department_id:departmentId,priority:$('#mp').value,description:$('#mx').value||null})});
    if(!res.ok){toast(typeof res.error==='string'?res.error:'Could not forward this question.');return}
    if(assistantMessage)assistantMessage.fw=res.data.ticket_number;S.modal={done:res.data.ticket_number};await loadViewData('queries');R();
  }
  else if(a=='vt'){S.modal=null;S.view='queries';S.fx='view';R();loadViewData('queries')}
  else if(a=='take-ticket'){
    const t=S.detail?.ticket;if(!t)return;
    const res=await apiCall(`/tickets/${t.uuid}`,{method:'PATCH',body:JSON.stringify({take_ticket:true})});
    if(!res.ok){toast(typeof res.error==='string'?res.error:'Could not take this ticket.');return}
    S.detail={ticket:{...ticketView(res.data.ticket),events:res.data.events||[]}};await loadViewData(S.view);
  }
  else if(a=='respond'||a=='resolve'){
    const t=S.detail?.ticket,r=$('#rp')?.value.trim();
    if(!t){toast('Open a ticket first.');return}
    if(a=='respond'&&!r){toast('Write a response first.');return}
    const res=await apiCall(`/tickets/${t.uuid}`,{method:'PATCH',body:JSON.stringify(a==='resolve'?{status:'resolved'}:{reply:r})});
    if(!res.ok){toast(typeof res.error==='string'?res.error:'Ticket update failed.');return}
    S.detail={ticket:{...ticketView(res.data.ticket),events:res.data.events||[]},events:res.data.events||[]};await loadViewData(S.view);toast(a=='resolve'?'Ticket resolved.':'Response sent.');
  }
});

document.addEventListener('keydown',e=>{
  if(e.key=='Enter'&&e.target.id=='ci'){e.preventDefault();sendChat()}
  if(e.key=='Enter'&&e.target.id=='dq'){e.preventDefault();sendDash()}
  if(e.key=='Enter'&&(e.target.id=='em'||e.target.id=='pw')){e.preventDefault();doLogin()}
  if(e.key=='Enter'&&['on','oa','oc'].includes(e.target.id)){e.preventDefault();document.querySelector('[data-a=onsave]')?.click()}
});
document.addEventListener('input',e=>{if(e.target.id=='gs'){S.fq=e.target.value;R()}});
document.addEventListener('change',e=>{if(e.target.id=='fs'){S.fs=e.target.value;R()}});

// Restore the signed-in session from the backend (the server checks the token)
async function restoreSession(){
  const r=await apiCall('/auth/me');
  if(r.ok&&r.data){
    const me=r.data;
    S.user={id:me.id,email:me.email,name:me.full_name||me.email.split('@')[0],full_name:me.full_name,role:me.role,campus_id:me.campus_id,department_id:me.department_id};
    S.role=me.role;S.scr='app';
    S.view=me.role=='student'?'chat':me.role=='faculty'?'tix':'x';
    R();await loadViewData(S.view);return;
  }else if(r.status===401||r.status===403){
    try{localStorage.removeItem('ub-token')}catch(e){}
  }
  R();
}
if(localStorage.getItem('ub-token'))restoreSession();

R();
</script></body></html>
