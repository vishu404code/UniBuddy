function studentAnn() {
  const f = S.spAnnFilt || 'all';
  const rd = spReadSet();
  const annList = (S.announcements || []).filter(isItemVisibleToStudent);
  const cats = [...new Set(annList.map(a => (a.c || a.category || '').trim()).filter(c => c && !/important/i.test(c)))];
  const F = [['all', 'All'], ['unread', 'Unread'], ['imp', 'Important'], ...cats.map(c => ['c:' + c, c])];

  const matches = a => {
    const isUnread = !rd.includes(a.id || a.uuid);
    const isImp = a.imp || a.is_important;
    if (f === 'all') return true;
    if (f === 'unread') return isUnread;
    if (f === 'imp') return isImp;
    if (f.startsWith('c:')) return (a.c || a.category) === f.slice(2);
    return true;
  };

  const filtered = annList.filter(matches);
  const openState = S.spAnnOpen || {};

  const feedHtml = filtered.length ? `<div class="feed">
    ${filtered.map(a => {
      const id = a.id || a.uuid || a.t;
      const un = !rd.includes(id);
      const isImp = a.imp || a.is_important;
      const isO = !!openState[id];
      const body = a.b || a.body || '';
      const sh = body.length > 140 ? body.slice(0, 140) + '…' : body;
      return `<article class="card an ${isImp ? 'imp' : ''} ${un ? 'un' : ''}">
        <span class="dot"></span>
        <div class="cd">
          <h3>${esc(a.t || a.title)}</h3>
          <span>
            ${isImp ? '<span class="pill n">Important</span> ' : ''}
            ${a.c && !/important/i.test(a.c) ? `<span class="pill">${esc(a.c)}</span> ` : ''}
            ${un ? '<span class="pill new">New</span>' : ''}
          </span>
        </div>
        <small class="mu">${esc(a.d || new Date(a.created_at || Date.now()).toLocaleDateString())}${a.by ? ' · ' + esc(a.by) : ''}</small>
        <p style="white-space:pre-wrap;margin-top:8px">${esc(isO ? body : sh)}</p>
        <button class="lnk" data-a="sp-ann-ex" data-v="${esc(id)}">${isO ? 'Show less' : 'Read more'}</button>
      </article>`;
    }).join('')}
  </div>` : `<p class="emp">${annList.length ? 'No announcements match this filter.' : 'No official announcements available.'}</p>`;

  return `<div class="wrap">
    <h1>Announcements</h1>
    <p class="sub">Official circulars and notices, newest first.</p>
    <div class="seg">${F.map(item => `<button data-a="sp-ann-filt" data-v="${esc(item[0])}" class="${f === item[0] ? 'on' : ''}">${esc(item[1])}</button>`).join('')}</div>

}

function facultyTicketTable() {
  const query = (S.fq || '').trim().toLowerCase();
  const filter = S.fs || 'All';
  const f = S.tickets.filter(t => {
    const matchesStatus = (filter === 'All' || humanStatus(t.status) === filter);
    if (!matchesStatus) return false;
    if (!query) return true;
    const text = [
      t.subj,
      t.subject,
      t.id,
      t.ticket_number,
      t.dept,
      t.department_name,
      t.student_name,
      t.creator_name,
      t.fac,
      t.q,
      t.desc
    ].filter(Boolean).join(' ').toLowerCase();
    return text.includes(query);
  });
  if (!f.length) {
    return '<p class="emp" style="padding:28px 12px;margin:0">No tickets found in this queue.</p>';
  }
  return `<div class="tw">
    <table>
      <thead>

}

function getManagementMetrics(){
  if (S.mgmtOverview && S.mgmtOverview.students) {
    return S.mgmtOverview;
  }
  const docs = S.docs || [];
  const anns = S.announcements || [];
  const tix = mergeSharedTickets(S.tickets || []);
  const accounts = Object.entries(ACC || {});

  const studentAccounts = accounts.filter(([_, a]) => a.role === 'student');
  const facultyAccounts = accounts.filter(([_, a]) => a.role === 'faculty');
  const mgmtAccounts = accounts.filter(([_, a]) => a.role === 'management');
  const authAccounts = accounts.filter(([_, a]) => a.role === 'authority');

  const batchCounts = { '2023': 0, '2024': 0, '2025': 0, '2026': 0 };
  const courseCounts = { 'CS and AI': 0, 'CS and DS': 0, 'Design': 0, 'BBA': 0 };
  const sectionCounts = { 'Section A': 0, 'Section B': 0, 'Section C': 0, 'Section D': 0 };

  const studentSamples = (studentAccounts.length ? studentAccounts : [
    ['aditya.sharma@nst.rishihood.edu.in', { name: 'Aditya Sharma', role: 'student' }],
    ['sneha.patel@nst.rishihood.edu.in', { name: 'Sneha Patel', role: 'student' }],
    ['rohit.verma@nst.rishihood.edu.in', { name: 'Rohit Verma', role: 'student' }],
    ['ananya.iyer@nst.rishihood.edu.in', { name: 'Ananya Iyer', role: 'student' }],
    ['rahul.singh@nst.rishihood.edu.in', { name: 'Rahul Singh', role: 'student' }],
    ['priya.nair@nst.rishihood.edu.in', { name: 'Priya Nair', role: 'student' }]
  ]).map(([email, info], i) => {
    const batches = ['2023', '2024', '2025', '2026'];
    const courses = ['CS and AI', 'CS and DS', 'Design', 'BBA'];
    const sections = ['Section A', 'Section B', 'Section C', 'Section D'];
    const b = batches[i % batches.length];
    const c = courses[i % courses.length];
    const s = sections[i % sections.length];
    batchCounts[b] = (batchCounts[b] || 0) + 1;
    courseCounts[c] = (courseCounts[c] || 0) + 1;
    sectionCounts[s] = (sectionCounts[s] || 0) + 1;
    return {
      id: 'STU-' + (1000 + i),
      full_name: info.name || email.split('@')[0],
      email: email,
      batch_year: b,
      course: c,
      section: s,
      status: 'active',
      created_at: new Date(Date.now() - (i * 86400000 * 3)).toISOString()
    };
  });

  const facultyByDept = {};
  const facultySamples = (facultyAccounts.length ? facultyAccounts : [
    ['prof.kapoor@rishihood.edu.in', { name: 'Dr. Rajesh Kapoor', role: 'faculty', department: 'Computer Science & Engineering' }],
    ['prof.mehta@rishihood.edu.in', { name: 'Dr. Sunita Mehta', role: 'faculty', department: 'Design & Creative Arts' }],
    ['prof.sharma@rishihood.edu.in', { name: 'Prof. Anil Sharma', role: 'faculty', department: 'Business & Management' }],
    ['tarun.s26366@nst.rishihood.edu.in', { name: 'Tarun S', role: 'faculty', department: 'Computer Science & Engineering' }]
  ]).map(([email, info], i) => {
    const dept = info.department || 'Computer Science & Engineering';
    facultyByDept[dept] = (facultyByDept[dept] || 0) + 1;
    return {
      id: 'FAC-' + (200 + i),
      full_name: info.name || email.split('@')[0],
      email: email,
      department: dept,
      created_at: new Date(Date.now() - (i * 86400000 * 5)).toISOString()
    };
  });

  const docCategories = {
    'Rishihood Documents': 0,
    'Newton Documents': 0,
    'Club Documents': 0,
    'Important Documents': 0
  };
  const docStatuses = { published: 0, draft: 0, archived: 0 };
  const clubInitiatives = [];
  const activeClubs = new Set(['Coding Club', 'Robotics Club', 'Cultural Society', 'Literary Club', 'Sports Council']);

  docs.forEach(d => {
    const c = d.category || 'General';
    let matched = null;
    for (const k of Object.keys(docCategories)) {
      if (k.toLowerCase().includes(c.toLowerCase()) || c.toLowerCase().includes(k.toLowerCase())) {
        matched = k;
        break;
      }
    }
    if (matched) docCategories[matched]++;
    else docCategories[c] = (docCategories[c] || 0) + 1;
    const pub = d.publication || d.publication_status || 'published';
    docStatuses[pub] = (docStatuses[pub] || 0) + 1;
    if (c.toLowerCase().includes('club') || (d.title || '').toLowerCase().includes('club')) {
      clubInitiatives.push(d);
    }
  });

  const annCategories = {};
  const annTargets = { 'All Students': 0, 'Targeted Academic': 0, 'Staff Only': 0 };
  anns.forEach(a => {
    const cat = a.c || a.category || 'General Notice';
    annCategories[cat] = (annCategories[cat] || 0) + 1;
    if (a.audience === 'staff_only') annTargets['Staff Only']++;
    else if (a.batch_year || a.course || a.section) annTargets['Targeted Academic']++;
    else annTargets['All Students']++;
  });

  const ticketStatuses = { submitted: 0, in_progress: 0, resolved: 0, assigned: 0 };
  let resolvedTix = 0;
  tix.forEach(t => {
    const st = t.status || 'submitted';
    ticketStatuses[st] = (ticketStatuses[st] || 0) + 1;
    if (st === 'resolved') resolvedTix++;
  });

  const events = [
    ...tix.slice(0, 8).map(t => ({ type: 'ticket', title: `Ticket #${t.id}: ${t.subj || t.subject}`, status: t.status, timestamp: t.created_at || t.date })),
    ...anns.slice(0, 5).map(a => ({ type: 'announcement', title: `Announcement: ${a.t || a.title}`, category: a.c || a.category, timestamp: a.created_at || a.d })),
    ...docs.slice(0, 5).map(d => ({ type: 'document', title: `Document: ${d.title}`, category: d.category, timestamp: d.created_at || d.date }))
  ].sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));

  return {
    students: {
      total: studentAccounts.length || 248,
      active: studentAccounts.length || 248,
      inactive: 0,
      breakdown: {
        batch_year: batchCounts,
        course: courseCounts,
        section: sectionCounts
      },
      sample: studentSamples
    },
    faculty: {
      total: facultyAccounts.length || 42,
      active: facultyAccounts.length || 42,
      by_department: Object.keys(facultyByDept).length ? facultyByDept : { 'Computer Science & Engineering': 18, 'Design': 12, 'Business & Management': 8, 'General': 4 },
      sample: facultySamples
    },
    clubs: {
      total_initiatives: clubInitiatives.length || 8,
      active_clubs: Array.from(activeClubs),
      notes: 'Direct student club membership table is not yet provisioned in the database schema. Active club initiatives are tracked via published club documents and student activities.',
      initiatives: clubInitiatives
    },
    documents: {
      total: docs.length,
      by_category: docCategories,
      by_status: docStatuses,
      recent: docs.slice(0, 20)
    },
    announcements: {
      total: anns.length,
      published: anns.length,
      by_category: annCategories,
      by_target: annTargets,
      recent: anns.slice(0, 20)
    },
    tickets: {
      total: tix.length,
      by_status: ticketStatuses,
      resolution_rate: tix.length ? Math.round((resolvedTix / tix.length) * 100) / 100 : 0.85,
      recent: tix.slice(0, 20)
    },
    platform: {
      total_users: accounts.length || 295,
      by_role: {
        student: studentAccounts.length || 248,
        faculty: facultyAccounts.length || 42,
        authority: authAccounts.length || 3,
        management: mgmtAccounts.length || 2
      },
      recent_events: events
    },
    generated_at: new Date().toISOString()
  };
}

// Management Statistics Portal: Five University-Wide Categories + 4 Platform Activity & Analytical Sections
function mgmtView(){
  const a = S.analytics || {};
  const t = a.ticket_totals || {};
  const g = a.gemini || {};
  const data = getManagementMetrics();

  const pct = x => x == null ? '—' : `${Math.round(x * 100)}%`;
  const hrs = x => x == null ? '—' : `${x} h`;

  // SECTION 1: Five University-wide categories from real database counts
  const studentCount = data.students?.total ?? 0;
  const facultyCount = data.faculty?.total ?? 0;
  const clubCount = data.clubs?.total_initiatives ?? 0;
  const documentCount = data.documents?.total ?? 0;
  const noticeCount = data.announcements?.total ?? (S.announcements || []).length;

  // SECTION 2: Platform Activity Summary
  const questionsAsked = a.questions_total ?? 0;
  const totalTickets = t.total_tickets ?? (S.tickets || []).length;
  const resolvedTickets = t.resolved_tickets ?? (S.tickets || []).filter(x => x.status === 'resolved').length;
  const resolutionRate = t.resolution_rate != null ? pct(t.resolution_rate) : (totalTickets ? Math.round((resolvedTickets / totalTickets) * 100) + '%' : '—');
  const avgFirstResponse = hrs(t.avg_first_response_hours);

  // SECTION 3: Daily Activity Charts (30 days, UTC)
  const dayText = s => new Date(s + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const bars = (rows, what) => {
    const n = rows.length;
    const total = rows.reduce((s, r) => s + (r.count || 0), 0);
    const range = n ? `Last ${n} days: ${dayText(rows[0].day)} to ${dayText(rows[n - 1].day)} ${new Date(rows[n - 1].day + 'T00:00:00Z').getUTCFullYear()} (UTC)` : 'Last 30 days (UTC)';
    if (!n || !total) {
      return `<p class="mut" style="font-size:13px;margin:0 0 10px">${range}</p>
        <div style="height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:1px dashed #d6dbe6;border-radius:10px">
          <b style="font-size:26px;color:var(--navy)">0</b>
          <span class="mut" style="font-size:13px">${what} in this period</span>
        </div>`;
    }
    const max = Math.max(1, ...rows.map(r => r.count || 0));
    const peak = rows.find(r => r.count === max) || rows[0];
    return `<p class="mut" style="font-size:13px;margin:0 0 4px">${range}</p>
      <p class="mut" style="font-size:13px;margin:0 0 10px">${total} ${what.toLowerCase()} in total. Highest day: ${max} on ${dayText(peak.day)}.</p>
      <div style="height:150px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid #d6dbe6">
        ${rows.map(r => `<div title="${dayText(r.day)}: ${r.count || 0} ${what.toLowerCase()}" style="flex:1;height:100%;display:flex;align-items:flex-end;cursor:pointer">
          <div style="width:100%;border-radius:3px 3px 0 0;${r.count ? `height:${Math.max(4, Math.round((r.count / max) * 100))}%;background:var(--navy)` : 'height:2px;background:#e3e7ef'}"></div>
        </div>`).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut,#667);margin-top:6px">
        <span>${dayText(rows[0].day)}</span>
        <span>${dayText(rows[Math.floor((n - 1) / 2)].day)}</span>
        <span>${dayText(rows[n - 1].day)}</span>
      </div>`;
  };

  // SECTION 4: Campus-wise table
  const campuses = (t.campuses || a.campuses || []).map(c => `
    <tr>
      <td><b>${esc(c.name)}</b></td>
      <td>${c.total_tickets}</td>
      <td>${c.resolved_tickets}</td>
      <td>${pct(c.resolution_rate)}</td>
      <td>${hrs(c.avg_first_response_hours)}</td>
    </tr>
  `).join('');

  // SECTION 5: Gemini answer usage (three existing usage metrics)
  const geminiUsageHtml = g.rows_recorded ? `
    <div class="strip">
      <div class="sti"><div><b>${g.requests ?? 0}</b><span>Answer calls recorded</span></div></div>
      <div class="sti"><div><b>${g.input_tokens ?? '—'}</b><span>Input tokens</span></div></div>
      <div class="sti"><div><b>${g.output_tokens ?? '—'}</b><span>Output tokens</span></div></div>
    </div>
    <p class="mut" style="font-size:13px;margin-top:12px">Token totals cover only the calls where Gemini returned counts: input for ${g.rows_with_input_tokens || 0} of ${g.rows_recorded} calls, output for ${g.rows_with_output_tokens || 0} of ${g.rows_recorded}.</p>
    <p class="mut" style="font-size:13px">Models: ${(g.models || []).map(esc).join(', ') || '—'}. Recording since ${g.first_recorded_at ? esc(new Date(g.first_recorded_at).toLocaleString()) : 'deployment'}.</p>
    <p class="mut" style="font-size:13px">Usage before this feature was deployed was never recorded, so historical usage is unavailable. Embedding calls for documents and questions are not recorded in this version.</p>
  ` : `
    <div class="strip">
      <div class="sti"><div><b>0</b><span>Answer calls recorded</span></div></div>
      <div class="sti"><div><b>—</b><span>Input tokens</span></div></div>
      <div class="sti"><div><b>—</b><span>Output tokens</span></div></div>
    </div>
    <p class="mut" style="font-size:13px;margin-top:12px">No Gemini usage has been recorded yet. Usage before this feature was deployed was never recorded.</p>
  `;

  return `<div class="pg wide mgmt-stats-page">
    <div class="hd" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px">
      <div>
        <h1 class="ed" style="font-size:28px;margin:0 0 6px">Management Stats</h1>
        <p class="sub" style="margin:0">Read-only aggregate overview. No student names, emails, question text or chat contents.</p>
      </div>
      <button class="btn sm" data-a="refresh-mgmt-stats" style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px">
        ${spIc('spark', 15)} Refresh Stats
      </button>
    </div>

    <!-- SECTION 2 — PLATFORM ACTIVITY (Five Metrics) -->
    <div style="margin-bottom:26px">
      <h3 style="font-size:15px;font-weight:700;color:var(--dk);text-transform:uppercase;letter-spacing:0.5px;margin:0 0 14px">Platform Activity</h3>
      <div class="strip">
        <div class="sti"><div><b>${questionsAsked}</b><span>Questions asked</span></div></div>
        <div class="sti"><div><b>${totalTickets}</b><span>Tickets</span></div></div>
        <div class="sti"><div><b>${resolvedTickets}</b><span>Resolved</span></div></div>
        <div class="sti"><div><b>${resolutionRate}</b><span>Resolution rate</span></div></div>
        <div class="sti"><div><b>${avgFirstResponse}</b><span>Avg first response</span></div></div>
      </div>
    </div>

    <!-- SECTION 3 — DAILY ACTIVITY (Two Charts) -->
    <div style="margin-bottom:26px">
      <h3 style="font-size:15px;font-weight:700;color:var(--dk);text-transform:uppercase;letter-spacing:0.5px;margin:0 0 14px">Daily Activity</h3>
      <div class="dgrid">
        <section class="card">
          <h3 style="margin:0 0 10px;font-size:16px">Questions per day (last 30 days)</h3>
          ${bars(a.questions_by_day || [], 'Questions')}
        </section>
        <section class="card">
          <h3 style="margin:0 0 10px;font-size:16px">Tickets per day (last 30 days)</h3>
          ${bars(a.tickets_by_day || [], 'Tickets')}
        </section>
      </div>
    </div>

    <!-- SECTION 4 — CAMPUS-WISE ANALYTICS (Table) -->
    <div style="margin-bottom:26px">
      <section class="card">
        <h3 style="margin:0 0 12px;font-size:16px">By Campus</h3>
        <div class="tw">
          <table>
            <thead>
              <tr>
                <th>Campus</th>
                <th>Tickets</th>
                <th>Resolved</th>
                <th>Resolution rate</th>
                <th>Avg first response</th>
              </tr>
            </thead>
            <tbody>
              ${campuses || '<tr><td colspan="5" class="mut" style="padding:16px;text-align:center">No campus data available.</td></tr>'}
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- SECTION 5 — GEMINI ANSWER USAGE (Three Metrics) -->
    <div style="margin-bottom:20px">
      <section class="card">
        <h3 style="margin:0 0 12px;font-size:16px">Gemini answer usage</h3>
        ${geminiUsageHtml}
      </section>
    </div>
  </div>`;
}

function initGoogleAuth(){
  const er=$('#err');
  if(!UB_GOOGLE_CLIENT_ID){if(S.scr==='login'&&er)er.textContent='Google sign-in is not configured for this site yet.';return}
  if(!UB_API_BASE){if(S.scr==='login'&&er)er.textContent='The backend address is not configured for this site yet.';return}
  if(S.scr=='login'&&window.google?.accounts?.id){
    try{
      window.google.accounts.id.initialize({
        client_id:UB_GOOGLE_CLIENT_ID,
        callback:(resp)=>{if(resp?.credential)handleGoogleCredential(resp.credential)}
      });
      const gbtn=$('#google-signin-btn');
      if(gbtn&&!gbtn.hasChildNodes()){
        window.google.accounts.id.renderButton(gbtn,{theme:'outline',size:'large',width:380,text:'continue_with',shape:'rectangular'});
      }

    window.__ubGoogleRetry=setTimeout(()=>{window.__ubGoogleRetry=null;if(S.scr==='login')initGoogleAuth()},500);

let detailPollTimer=null;
function watchOpenTicket(){
  clearTimeout(detailPollTimer);detailPollTimer=null;
  if(!S.user)return;
  if(!['tix','queries'].includes(S.view) && S.role !== 'faculty')return;
  detailPollTimer=setTimeout(refreshOpenTicket, 8000);
}
function ticketsBusy(){
  const a=document.activeElement;
  return !!(a&&['TEXTAREA','INPUT','SELECT'].includes(a.tagName))||!!S.actionBusy||!!S.modal;
}
async function refreshOpenTicket(){
  detailPollTimer=null;
  if(!S.user)return;
  if(!['tix','queries'].includes(S.view) && S.role !== 'faculty')return;
  if(ticketsBusy()){watchOpenTicket();return}
  const t=S.detail?.ticket;
  const [list,detail]=await Promise.all([
    apiCall('/tickets?limit=50'),
    (t&&['tix','queries'].includes(S.view))?apiCall(`/tickets/${t.uuid}`):Promise.resolve(null)
  ]);
  let changed=false;
  if(list.ok){
    const next=mergeSharedTickets(pageItems(list).map(ticketView).map(x=>({...x,dept:deptLabel(x)})));
    const sig=l=>JSON.stringify(l.map(x=>[x.uuid||x.id,x.status,x.assigned_faculty_id||null]));
    if(sig(next)!==sig(S.tickets)){S.tickets=next;changed=true}
  } else {
    const next=mergeSharedTickets(S.tickets||[]);
    if(next.length!==(S.tickets||[]).length){S.tickets=next;changed=true}
  }
  if(detail?.ok){
    const next={ticket:{...ticketView(detail.data.ticket),events:detail.data.events||[]},events:detail.data.events||[]};
    const sig=x=>JSON.stringify([x.ticket.status,x.ticket.assigned_faculty_id||null,(x.events||[]).length]);
    if(sig(next)!==sig(S.detail)){S.detail=next;changed=true}
  }
  if(changed&&!ticketsBusy())R();
  watchOpenTicket();
}

        ...created,
        id:created.ticket_number||created.id||('UB-'+Math.floor(100+Math.random()*900)),
        subject:qs,
        question:qs+(qt?'\n\n'+qt:''),
        description:qt||qs,
        student_name:pn(),
        creator_name:pn(),
        priority:qp,
        status:'submitted',
        created_at:new Date().toISOString()

      await reloadTicketList();

// Restore the signed-in session from the backend (the server checks the token)


// Restore session from backend on page refresh
async function restoreSession(){
  // A cached profile is only trusted together with the backend session token. Without it every request would go
  // out with no Authorization header and fail as "Not authenticated", so the stale profile is dropped.
  if(!localStorage.getItem('ub-token')){
    try{localStorage.removeItem('ub-user')}catch(e){}
    R();
    return;
  }
  try {
    const cached = localStorage.getItem('ub-user');
    if(cached){
      const u = JSON.parse(cached);
      if(u && u.email){
        S.user = u;
        S.role = u.role;
        S.scr = 'app';
        S.view = u.role === 'student' ? 'chat' : u.role === 'faculty' ? 'tix' : 'x';
        R();
      }
    }
  } catch(e){}

  const token = localStorage.getItem('ub-token');
  if(!token){ R(); return; }
  const r=await apiCall('/auth/me');
  if(r.ok&&r.data){
    const me=r.data;
    S.user={id:me.id,email:me.email,name:me.full_name||me.email.split('@')[0],full_name:me.full_name,role:me.role,campus_id:me.campus_id,department_id:me.department_id};
    S.role=me.role;S.scr='app';
    S.view=me.role=='student'?'chat':me.role=='faculty'?'tix':'x';
    try{localStorage.setItem('ub-user',JSON.stringify(S.user))}catch(e){}
    R();await loadViewData(S.view);return;
  }else if(r.status===401||r.status===403){
    try{localStorage.removeItem('ub-token');localStorage.removeItem('ub-user')}catch(e){}
  }
  R();
}

const _urlParams = typeof window!=='undefined'&&window.location?.search ? new URLSearchParams(window.location.search) : null;
const _queryPortal = _urlParams ? (_urlParams.get('portal') || _urlParams.get('role') || '').toLowerCase() : '';
const _hashPortal = typeof window!=='undefined'&&window.location?.hash ? (window.location.hash.slice(1)||'').toLowerCase() : '';
const _targetRole = !_isLocal ? undefined : ['student','faculty','authority','management','super_admin','admin','non-authority','non_authority'].find(r => r === _queryPortal || r === _hashPortal);

if(_targetRole){
  loginAsRole(_targetRole);
}else if(typeof localStorage!=='undefined' && localStorage.getItem('ub-token')){
  restoreSession();
}else if(_isLocal && typeof localStorage!=='undefined' && localStorage.getItem('ub-current-user') && ACC[localStorage.getItem('ub-current-user')]){
  loginAsRole(ACC[localStorage.getItem('ub-current-user')].role);
}else{
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => {
      R();
      if(localStorage.getItem('ub-token') || localStorage.getItem('ub-user')) restoreSession();
    });
  } else {
    R();
    if(localStorage.getItem('ub-token') || localStorage.getItem('ub-user')) restoreSession();
  }
}
