async function submitPublish(button){
  if(S.actionBusy)return;
  const val=id=>($('#'+id)?.value||'').trim();
  const batch=val('pf-batch');
  if(batch&&!(Number(batch)>=2000&&Number(batch)<=2100)){toast('Batch year must be between 2000 and 2100.');return}
  if(button.dataset.v==='pdf'){
    const title=val('pd-title'),file=$('#pd-file')?.files?.[0];
    if(!title||!file){toast('Enter a title and choose a PDF.');return}
    if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){toast('Choose a PDF file.');return}
    // One click = one POST. The button stays disabled until the answer arrives.
    const body=new FormData();body.append('title',title);body.append('file',file);
    body.append('visibility',$('#pd-vis')?.value||'public_students');body.append('scope',$('#pd-scope')?.value||'university_wide');
    [['academic_year',val('pf-acad')],['batch_year',batch],['section',val('pf-section')],['course_id',$('#pf-course')?.value||''],['source_person',val('pd-source')]].forEach(([k,v])=>{if(v)body.append(k,v)});
    S.actionBusy=true;button.disabled=true;button.textContent='Uploading…';
    const res=await apiCall('/documents',{method:'POST',body});
    S.actionBusy=false;
    if(!res.ok){button.disabled=false;button.textContent='Upload PDF';toast(typeof res.error==='string'?res.error:'Upload failed. Check your access and try again.');return}
    if(res.data&&res.data.id)S.docs=[docView(res.data),...(S.docs||[]).filter(d=>d.uuid!==res.data.id)];
    clearPublishForm();R();toast('PDF uploaded. It is processing; the status updates automatically.');watchDocProcessing();
    return;
  }
  const title=val('pa-title'),text=val('pa-body');
  if(!title||!text){toast('Enter a title and a message.');return}
  const aud=$('#pa-aud')?.value||'all_students';
  const payload={title,body:text,audience:aud,scope:$('#pa-scope')?.value||'campus',category:'Notice',is_important:!!$('#pa-imp')?.checked};
  if(aud==='all_students'){
    if(val('pf-acad'))payload.academic_year=val('pf-acad');
    if(batch)payload.batch_year=Number(batch);
    if(val('pf-section'))payload.section=val('pf-section');
    if($('#pf-course')?.value)payload.course_id=$('#pf-course').value;
    if((S.pubPeople||[]).length)payload.person_ids=S.pubPeople.map(p=>p.id);
  }
  S.actionBusy=true;button.disabled=true;button.textContent='Publishing…';
  const res=await apiCall('/announcements',{method:'POST',body:JSON.stringify(payload)});
  S.actionBusy=false;
  if(!res.ok){button.disabled=false;button.textContent='Publish announcement';toast((typeof res.error==='string'?res.error:'The announcement was not published.')+' Your text is still in the form.');return}
  S.announcements=[{...res.data,c:res.data.category||'Notice',t:res.data.title,b:res.data.body,d:new Date(res.data.created_at).toLocaleDateString(),tone:'blue',big:res.data.is_important,imp:res.data.is_important},...(S.announcements||[])];
  clearPublishForm();R();toast('Announcement published.');
}

    const hits = [
      ...(S.docs || []).map(d => ({ t: d.title, k: 'docs', x: 'Document', text: d.title + ' ' + (d.scope || '') })),

  const heroHtml = `<div class="hero">
    <div class="orb" aria-hidden="true"></div>
    <div class="gt">${spGreet()}, ${esc(first)}</div>
    <div class="gt2">How Can I <span class="ac">Assist You</span> Today?</div>
    <div class="chips" style="margin-top:24px">
      ${SUG.map(s => `<button class="chip" data-a="sq" data-v="${esc(s[2])}">${spIc(s[0], 16)}${esc(s[1])}</button>`).join('')}
    </div>
  </div>`;

  const msgsHtml = msgs.length ? msgs.filter(m => m.k !== 'ty').map((x, i) => {
    if (x.r === 'u') {
      return `<div class="msg u"><div class="bub">${esc(x.t)}</div></div>`;
    }
    const citations = (x.citations || []).map(s => `<a class="src" href="#documents" data-a="view" data-v="docs">${spIc('file', 14)}${esc(s.title || 'Document')}${s.page ? ` · p. ${s.page}` : ''}</a>`).join('');

    return `<div class="msg b">
      <span class="lg"><img src="logo.png" alt="UniBuddy" onerror="this.onerror=null;this.src=LOGO"></span>
      <div class="bub">
        ${fmtAnswer(x.t)}

        ${rqBtn}
      </div>
    </div>`;
  }).join('') : heroHtml;

  const typingHtml = isTyping ? `<div class="msg b">
    <span class="lg"><img src="logo.png" alt="UniBuddy" onerror="this.onerror=null;this.src=LOGO"></span>
    <div class="bub"><div class="ty"><s></s><s></s><s></s></div></div>

  return `<div class="chatw">
    <div class="ms" id="msgs">
      ${msgsHtml}
      ${typingHtml}
    </div>
    <div class="comp">

function studentDocs() {
  const cat = S.spDocCat || 'all';
  const q = (S.spDocQ || '').toLowerCase();
  const docs = S.docs || [];
  const cnt = k => docs.filter(d => { const c = spCatOf(d); return c && c[2] === k; }).length;

  const tabsHtml = `<button data-a="sp-doc-cat" data-v="all" class="${cat === 'all' ? 'on' : ''}">All Documents <i>${docs.length}</i></button>` +
    SP_CATS.map(c => `<button data-a="sp-doc-cat" data-v="${c[2]}" class="k-${c[2]} ${cat === c[2] ? 'on' : ''}"><span class="kd"></span>${c[3]} <i>${cnt(c[2])}</i></button>`).join('');

  const filtered = docs.filter(d => {
    const c = spCatOf(d);
    const matchesCat = (cat === 'all' || (c && c[2] === cat));
    const text = (d.title + ' ' + (d.scope || '') + ' ' + (d.original_filename || '') + ' ' + (d.description || '') + ' ' + (d.category || '')).toLowerCase();
    const matchesQ = !q || text.includes(q);
    return matchesCat && matchesQ;
  });

  const cardsHtml = filtered.map(d => {
    const c = spCatOf(d);
    const k = c ? c[2] : 'n';
    const isDemo = d.isDemo || String(d.uuid).startsWith('demo-');
    const dlAttr = isDemo
      ? `href="data:text/plain;charset=utf-8,${encodeURIComponent((d.title || '') + '\n\n' + (d.description || 'Official University Demonstration Document') + '\n\nUniBuddy Portal Ref: ' + d.uuid)}" download="${esc(d.original_filename || d.title + '.txt')}"`
      : `href="/api/v1/documents/${esc(d.uuid)}/file" target="_blank" rel="noopener" download="${esc(d.original_filename || d.title)}"`;
    return `<div class="card dc k-${k}">
      <span class="fi">${spExt(d)}</span>
      <div class="db">
        <div class="cd">
          <b>${esc(d.title)}</b>
          <span class="badge">${c ? c[1] : 'General'}</span>
        </div>
        <p style="overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${esc(d.description || (d.original_filename ? 'File: ' + d.original_filename : 'Official University Document'))}</p>
        <div class="meta">${esc(d.date || new Date(d.created_at || Date.now()).toLocaleDateString())}</div>
        <div class="acts">
          <button class="btn s" data-a="view-pdf" data-v="${esc(d.uuid)}">${spIc('file', 14)} Preview</button>
          <a class="btn o s" ${dlAttr}>Download</a>
        </div>
      </div>
    </div>`;
  }).join('') || `<p class="emp" style="grid-column:1/-1">${docs.length ? 'No documents match this category or search.' : 'No documents are visible to this account.'}</p>`;

  return `<div class="wrap big">
    <div class="hd">
      <div style="display:block">
        <h1>Documents</h1>
        <p class="mu" style="margin-top:6px">Official files from your university, newest first.</p>
      </div>
      <input id="ds" value="${esc(S.spDocQ || '')}" placeholder="Search documents" aria-label="Search documents">
    </div>
    <div class="seg" id="dtabs">${tabsHtml}</div>
    <div id="dl" class="dgrid">${cardsHtml}</div>
  </div>`;
}

function studentAnn() {
  const f = S.spAnnFilt || 'all';
  const rd = spReadSet();
  const annList = S.announcements || [];
  const cats = [...new Set(annList.map(a => (a.c || a.category || '').trim()).filter(c => c && !/important/i.test(c)))];
  const F = [['all', 'All'], ['unread', 'Unread'], ['imp', 'Important'], ...cats.map(c => ['c:' + c, c])];

  const matches = a => {
    const isUnread = !rd.includes(a.id || a.uuid);
    const isImp = a.imp || a.is_important;
    if (f === 'all') return true;
    if (f === 'unread') return isUnread;
    if (f === 'imp') return isImp;
    if (f.startsWith('c:')) return (a.c || a.category) === f.slice(2);
    return true;
  };

  const filtered = annList.filter(matches);
  const openState = S.spAnnOpen || {};

  const feedHtml = filtered.length ? `<div class="feed">
    ${filtered.map(a => {
      const id = a.id || a.uuid || a.t;
      const un = !rd.includes(id);
      const isImp = a.imp || a.is_important;
      const isO = !!openState[id];
      const body = a.b || a.body || '';
      const sh = body.length > 140 ? body.slice(0, 140) + '…' : body;
      return `<article class="card an ${isImp ? 'imp' : ''} ${un ? 'un' : ''}">
        <span class="dot"></span>
        <div class="cd">
          <h3>${esc(a.t || a.title)}</h3>
          <span>
            ${isImp ? '<span class="pill n">Important</span> ' : ''}
            ${a.c && !/important/i.test(a.c) ? `<span class="pill">${esc(a.c)}</span> ` : ''}
            ${un ? '<span class="pill new">New</span>' : ''}
          </span>
        </div>
        <small class="mu">${esc(a.d || new Date(a.created_at || Date.now()).toLocaleDateString())}${a.by ? ' · ' + esc(a.by) : ''}</small>
        <p style="white-space:pre-wrap;margin-top:8px">${esc(isO ? body : sh)}</p>
        <button class="lnk" data-a="sp-ann-ex" data-v="${esc(id)}">${isO ? 'Show less' : 'Read more'}</button>
      </article>`;
    }).join('')}
  </div>` : `<p class="emp">${annList.length ? 'No announcements match this filter.' : 'No official announcements available.'}</p>`;

  return `<div class="wrap">
    <h1>Announcements</h1>
    <p class="sub">Official circulars and notices, newest first.</p>
    <div class="seg">${F.map(item => `<button data-a="sp-ann-filt" data-v="${esc(item[0])}" class="${f === item[0] ? 'on' : ''}">${esc(item[1])}</button>`).join('')}</div>
    ${feedHtml}
  </div>`;
}

// Management Stats: aggregate counts only. No student names, emails, question text or chat contents.
// Gemini usage is shown only where it was recorded; nothing is estimated.
function mgmtView(){
  const a=S.analytics;
  if(!a)return '<div class="pg"><h1 class="ed">Management Stats</h1><p class="mut">Loading aggregate analytics…</p></div>';
  const t=a.ticket_totals||{};
  const pct=x=>x==null?'—':`${Math.round(x*100)}%`;
  const hrs=x=>x==null?'—':`${x} h`;
  // One bar per day, in date order. The range and the total are stated above the chart, and the
  // three date labels below it show the start, middle and end of the range. Zero days stay as empty space.
  const dayText=s=>new Date(s+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
  const bars=(rows,what)=>{
    const n=rows.length,total=rows.reduce((s,r)=>s+(r.count||0),0);
    const range=n?`Last ${n} days: ${dayText(rows[0].day)} to ${dayText(rows[n-1].day)} ${new Date(rows[n-1].day+'T00:00:00Z').getUTCFullYear()} (UTC)`:'No days in range';
    if(!n||!total)return `<p class="mut" style="font-size:13px;margin:0 0 10px">${range}</p><div style="height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:1px dashed #d6dbe6;border-radius:10px"><b style="font-size:26px;color:var(--navy)">0</b><span class="mut" style="font-size:13px">${what} in this period</span></div>`;
    const max=Math.max(...rows.map(r=>r.count||0)),peak=rows.find(r=>r.count===max);
    return `<p class="mut" style="font-size:13px;margin:0 0 4px">${range}</p><p class="mut" style="font-size:13px;margin:0 0 10px">${total} ${what.toLowerCase()} in total. Highest day: ${max} on ${dayText(peak.day)}.</p>
<div style="height:150px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid #d6dbe6">${rows.map(r=>`<div title="${dayText(r.day)}: ${r.count||0} ${what.toLowerCase()}" style="flex:1;height:100%;display:flex;align-items:flex-end"><div style="width:100%;border-radius:3px 3px 0 0;${r.count?`height:${Math.max(3,Math.round(r.count/max*100))}%;background:var(--navy)`:'height:2px;background:#e3e7ef'}"></div></div>`).join('')}</div>
<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut,#667);margin-top:6px"><span>${dayText(rows[0].day)}</span><span>${dayText(rows[Math.floor((n-1)/2)].day)}</span><span>${dayText(rows[n-1].day)}</span></div>`;
  };
  const campuses=(t.campuses||[]).map(c=>`<tr><td>${esc(c.name)}</td><td>${c.total_tickets}</td><td>${c.resolved_tickets}</td><td>${pct(c.resolution_rate)}</td><td>${hrs(c.avg_first_response_hours)}</td></tr>`).join('');
  return `<div class="pg wide"><h1 class="ed">Management Stats</h1><p class="sub">Read-only aggregate overview. No student names, emails, question text or chat contents.</p>
<div class="strip">${[['Questions asked',a.questions_total],['Tickets',t.total_tickets],['Resolved',t.resolved_tickets],['Resolution rate',pct(t.resolution_rate)],['Avg first response',hrs(t.avg_first_response_hours)]].map(([l,v])=>`<div class="sti"><div><b>${v??'—'}</b><span>${l}</span></div></div>`).join('')}</div>
<div class="dgrid"><section class="card"><h3>Questions per day</h3>${bars(a.questions_by_day||[],'Questions')}</section><section class="card"><h3>Tickets per day</h3>${bars(a.tickets_by_day||[],'Tickets')}</section></div>
<section class="card" style="margin-top:16px"><h3>By campus</h3><div class="tw"><table><tr><th>Campus</th><th>Tickets</th><th>Resolved</th><th>Resolution rate</th><th>Avg first response</th></tr>${campuses||'<tr><td colspan="5" class="mut">No campus data.</td></tr>'}</table></div></section>
</div>`;
}

  const html=h+(S.modal?modal():'')+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');

  const t=S.fx=='screen'?a.firstElementChild:S.fx=='view'?$('.main > :last-child'):null;if(t)t.classList.add('fx');S.fx=0;S.chat.forEach(x=>x.n=0);
  if(ae&&$('#'+ae)&&ae!=='ci'&&ae!=='dq'){$('#'+ae).value=v;$('#'+ae).focus()}
  const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;

  else{const pg=$('.page');if(pg)pg.scrollTop=prevScroll}

  if(S.scr==='login'){
    applyLogos();

    initGoogleAuth();

  }

  if(S.scr==='landing'){

function initGoogleAuth(){
  const er=$('#err');
  if(!UB_GOOGLE_CLIENT_ID){if(S.scr==='login'&&er)er.textContent='Google sign-in is not configured for this site yet.';return}
  if(!UB_API_BASE){if(S.scr==='login'&&er)er.textContent='The backend address is not configured for this site yet.';return}
  if(S.scr=='login'&&window.google?.accounts?.id){
    try{
      window.google.accounts.id.initialize({
        client_id:UB_GOOGLE_CLIENT_ID,

let detailPollTimer=null;
function watchOpenTicket(){
  clearTimeout(detailPollTimer);detailPollTimer=null;
  if(!S.user||!['tix','queries'].includes(S.view))return;
  detailPollTimer=setTimeout(refreshOpenTicket,15000);
}
function ticketsBusy(){
  const a=document.activeElement;
  return !!(a&&['TEXTAREA','INPUT','SELECT'].includes(a.tagName))||!!S.actionBusy||!!S.modal;
}
async function refreshOpenTicket(){
  detailPollTimer=null;
  if(!S.user||!['tix','queries'].includes(S.view))return;
  if(ticketsBusy()){watchOpenTicket();return}
  const t=S.detail?.ticket;
  const [list,detail]=await Promise.all([
    apiCall('/tickets?limit=50'),
    t?apiCall(`/tickets/${t.uuid}`):Promise.resolve(null)
  ]);
  let changed=false;
  if(list.ok){
    const next=pageItems(list).map(ticketView).map(x=>({...x,dept:deptLabel(x)}));
    const sig=l=>JSON.stringify(l.map(x=>[x.uuid,x.status,x.assigned_faculty_id||null]));
    if(sig(next)!==sig(S.tickets)){S.tickets=next;changed=true}
  }
  if(detail?.ok){
    const next={ticket:{...ticketView(detail.data.ticket),events:detail.data.events||[]},events:detail.data.events||[]};
    const sig=x=>JSON.stringify([x.ticket.status,x.ticket.assigned_faculty_id||null,(x.events||[]).length]);
    if(sig(next)!==sig(S.detail)){S.detail=next;changed=true}
  }
  if(changed&&!ticketsBusy())R();
  watchOpenTicket();
}

  else if(a=='del-conv'){e.stopPropagation();if(S.conversationId===v){S.chat=[];S.conversationId=null}S.hist=(S.hist||[]).filter(c=>c.id!==v);R();apiCall(`/chat/conversations/${v}`,{method:'DELETE'})}
  else if(a=='rq-dialog'){const idx=+v,msg=S.chat[idx-1]||S.chat[idx];const q=msg?.t||'';const qs=$('#qs'),qt=$('#qt');if(qs)qs.value=q.slice(0,120);if(qt)qt.value=q;const d=$('#dq');if(d&&typeof d.showModal==='function')d.showModal()}
  else if(a=='close-dq'){const d=$('#dq');if(d&&typeof d.close==='function')d.close()}
  else if(a=='sp-ask-dash'){sendDash()}
  else if(a=='sp-copy-support'){const em=supportEmail();if(em){try{navigator.clipboard.writeText(em);toast('Address copied')}catch(_){toast(em)}}}
  else if(a=='sp-save-prof'){const fields=['sid','institute','course','branch','year','sem','batch','section'];const obj={};fields.forEach(k=>{const el=$('#p_'+k);if(el)obj[k]=el.value.trim()});try{localStorage.setItem('ub_prof',JSON.stringify(obj))}catch(e){}toast('Profile saved');R()}
  else if(a=='pub-type'){S.pubType=v;R()}
  else if(a=='pub-submit'){submitPublish(el)}
  else if(a=='pub-person-add'){const p=(S.pubResults||[]).find(x=>x.id===v);if(p&&!(S.pubPeople||[]).some(x=>x.id===p.id))S.pubPeople=[...(S.pubPeople||[]),p];S.pubQuery='';S.pubResults=[];const q=$('#pa-q');if(q)q.value='';R()}
  else if(a=='pub-person-remove'){S.pubPeople=(S.pubPeople||[]).filter(x=>x.id!==v);R()}
  else if(a=='doc-open'){S.modal={type:'doc-detail',uuid:v};R()}
  else if(a=='ann-open'){S.modal={type:'ann-detail',i:+v};R()}
  else if(a=='view-pdf'){openPdf(v)}
  else if(a=='opt-add'){const value=($('#op-new-'+v)?.value||'').trim();if(!value){toast('Enter a value first.');return}const res=await apiCall('/filter-options',{method:'POST',body:JSON.stringify({kind:v,value})});if(!res.ok){toast(typeof res.error==='string'?res.error:'The option was not added.');return}toast('Option added.');await reloadOptions()}
  else if(a=='opt-toggle'){const o=(S.options||[]).find(x=>x.id===v);if(!o)return;const res=await apiCall(`/filter-options/${v}`,{method:'PATCH',body:JSON.stringify({active:!o.active})});if(!res.ok){toast(typeof res.error==='string'?res.error:'The option was not changed.');return}toast(o.active?'Option deactivated.':'Option activated.');await reloadOptions()}
  else if(a=='opt-remove'){const res=await apiCall(`/filter-options/${v}`,{method:'DELETE'});if(!res.ok){toast(typeof res.error==='string'?res.error:'The option was not removed.');return}toast(res.data?.action==='deactivated'?'It is in use, so it was deactivated. Existing records keep it.':'Option removed.');await reloadOptions()}
  else if(a=='course-add'){const name=($('#cr-new')?.value||'').trim();if(!name){toast('Enter a course name.');return}const res=await apiCall('/courses',{method:'POST',body:JSON.stringify({name})});if(!res.ok){toast(typeof res.error==='string'?res.error:'The course was not added.');return}toast('Course added.');await reloadCourses()}
  else if(a=='course-save'){const name=($('#cr-'+v)?.value||'').trim();if(!name){toast('Enter a course name.');return}const res=await apiCall(`/courses/${v}`,{method:'PATCH',body:JSON.stringify({name})});if(!res.ok){toast(typeof res.error==='string'?res.error:'The course was not renamed.');return}toast('Course renamed.');await reloadCourses()}
  else if(a=='course-toggle'){const c=(S.courses||[]).find(x=>x.id===v);if(!c)return;const res=await apiCall(`/courses/${v}`,{method:'PATCH',body:JSON.stringify({active:!c.active})});if(!res.ok){toast(typeof res.error==='string'?res.error:'The course was not changed.');return}toast(c.active?'Course deactivated.':'Course activated.');await reloadCourses()}
  else if(a=='course-remove'){const res=await apiCall(`/courses/${v}`,{method:'DELETE'});if(!res.ok){toast(typeof res.error==='string'?res.error:'The course was not removed.');return}toast(res.data?.action==='deactivated'?'It is in use, so it was deactivated. Existing records keep it.':'Course removed.');await reloadCourses()}
  else if(a=='restore-doc'||a=='scope-univ'){
    if(S.actionBusy)return;
    S.actionBusy=true;el.disabled=true;
    const res=a==='restore-doc'?await apiCall(`/documents/${v}/restore`,{method:'POST'}):await apiCall(`/documents/${v}/scope`,{method:'POST',body:JSON.stringify({scope:'university_wide'})});
    S.actionBusy=false;
    if(!res.ok){el.disabled=false;toast(typeof res.error==='string'?res.error:'Document update failed.');return}
    S.modal=null;await loadViewData('docs');toast(a==='restore-doc'?'Restored as a draft. Publish it when ready.':'Now university-wide as a draft. Publish it to take effect.');
  }
  else if(a=='publish-doc'||a=='archive-doc'){
    el.disabled=true;const action=a==='publish-doc'?'publish':'archive',res=await apiCall(`/documents/${v}/${action}`,{method:'POST'});
    if(!res.ok){el.disabled=false;toast(typeof res.error==='string'?res.error:'Document update failed.');return}
    S.modal=null;await loadViewData('docs');toast(action==='publish'?'Document published.':'Document archived.');
  }
  else if(a=='logout'){
    try{localStorage.removeItem('ub-current-user');localStorage.removeItem('ub-token')}catch(x){}
    S.user=null;S.role=null;S.chat=[];S.hist=[];S.conversationId=null;S.restoredChat=false;S.chatOwner=null;go('landing');
  }
  else if(a=='view'){if(S.view!=v)S.fx='view';S.view=v;S.bell=false;S.spBellOpen=false;S.spUserOpen=false;S.nav=false;R();loadViewData(v)}
  else if(a=='navo'){S.nav=true;R()}else if(a=='navx'){S.nav=false;R()}
  else if(a=='new')newChat();
  else if(a=='hist'){const h=S.hist[+v];if(h)openConversation(h.id)}
  else if(a=='bell'){S.bell=!S.bell;R();if(S.bell)loadViewData(S.view)}
  else if(a=='readall'){await Promise.all(S.notifs.filter(n=>n.u).map(n=>apiCall(`/notifications/${n.id}/read`,{method:'PATCH'})));await loadViewData(S.view)}
  else if(a=='nt'){const n=S.notifs[v];if(n?.id)await apiCall(`/notifications/${n.id}/read`,{method:'PATCH'});S.bell=false;if(S.role==='student')S.view='queries';if(n?.tk){const ticket=await apiCall(`/tickets/${n.tk}`);if(ticket.ok)S.detail={ticket:{...ticketView(ticket.data.ticket),events:ticket.data.events||[]}}}R();loadViewData(S.view)}
  else if(a=='open'){const item=S.tickets.find(t=>t.uuid===v||t.id===v);S.sel=item?.id||v;const uuid=item?.uuid||v;if(item)S.detail={ticket:item,events:item.events||[]};if(S.role=='student'&&S.view!='queries'){S.view='queries';S.fx='view'}S.scrollDetail=true;R();const res=await apiCall(`/tickets/${uuid}`);if(res.ok){S.detail={ticket:{...ticketView(res.data.ticket),events:res.data.events||[]},events:res.data.events||[]};S.scrollDetail=true;R()}else if(!item){toast('This ticket could not be opened. Try again.')}watchOpenTicket()}
  else if(a=='dask')sendDash();
  else if(a=='sq')ask(v);
  else if(a=='send')sendChat();
  else if(a=='attach')toast('File attachments are not supported yet. You can describe the issue in the forwarded ticket.')
  else if(a=='fwd'){S.modal={i:+v,q:S.chat[+v-1]?.t||'Question'};R()}
  else if(a=='mc'){S.modal.out=1;R();setTimeout(()=>{if(S.pdf?.url)URL.revokeObjectURL(S.pdf.url);S.pdf=null;S.modal=null;R()},160)}
  else if(a=='ms'){
    if(S.actionBusy)return;
    const m=S.modal,msg=S.chat[m.i-1],assistantMessage=S.chat[m.i],departmentId=$('#md')?.value||null;
    if(!msg?.mid){toast('The question is missing its server reference. Ask it again, then forward it.');return}
    const label=el.textContent;S.actionBusy=true;el.disabled=true;el.textContent='Submitting…';
    const res=await apiCall(`/chat/messages/${msg.mid}/forward`,{method:'POST',body:JSON.stringify({department_id:departmentId,priority:$('#mp').value,description:$('#mx').value||null})});
    S.actionBusy=false;
    if(!res.ok){el.disabled=false;el.textContent=label;toast(typeof res.error==='string'?res.error:'Could not forward this question. Your text is still in the form.');return}
    if(assistantMessage)assistantMessage.fw=res.data.ticket_number;S.modal={done:res.data.ticket_number};await reloadTicketList();R();
  }
  else if(a=='vt'){S.modal=null;S.view='queries';S.fx='view';R();loadViewData('queries')}
  else if(a=='take-ticket'){
    if(S.actionBusy)return;
    const t=S.detail?.ticket;if(!t)return;
    const label=el.textContent;S.actionBusy=true;el.disabled=true;el.textContent='Taking…';
    const res=await apiCall(`/tickets/${t.uuid}`,{method:'PATCH',body:JSON.stringify({take_ticket:true})});
    S.actionBusy=false;
    if(!res.ok){el.disabled=false;el.textContent=label;toast(typeof res.error==='string'?res.error:'Could not take this ticket.');return}
    applyTicketUpdate(res.data);R();toast('Ticket taken. You can now reply or change its status.');watchOpenTicket();
  }
  else if(a=='respond'||a=='resolve'){
    if(S.actionBusy)return;
    const t=S.detail?.ticket,r=$('#rp')?.value.trim();
    if(!t){toast('Open a ticket first.');return}
    if(a=='respond'&&!r){toast('Write a response first.');return}
    const label=el.textContent;
    S.actionBusy=true;el.disabled=true;el.textContent=a==='resolve'?'Resolving…':'Sending…';
    toast(a==='resolve'?'Resolving ticket…':'Sending response…');
    const res=await apiCall(`/tickets/${t.uuid}`,{method:'PATCH',body:JSON.stringify(a==='resolve'?{status:'resolved'}:{reply:r})});
    S.actionBusy=false;
    if(!res.ok){el.disabled=false;el.textContent=label;toast((typeof res.error==='string'?res.error:'The update failed.')+' Your text is still in the box.');return}
    applyTicketUpdate(res.data);R();
    toast(a=='resolve'?'Ticket resolved. The student can now see the status.':'Response sent. The student can now see it.');
    watchOpenTicket();
  }
});

document.addEventListener('keydown',e=>{
  if(e.key=='Enter'&&e.target.id=='ci'&&!e.shiftKey){e.preventDefault();sendChat()}
  if(e.key=='Enter'&&(e.target.id=='dq'||e.target.id=='dq_in')){e.preventDefault();sendDash()}
  if(e.key=='Enter'&&(e.target.id=='em'||e.target.id=='pw')){e.preventDefault();doLogin()}
  if(e.key=='Enter'&&['on','oa','oc'].includes(e.target.id)){e.preventDefault();document.querySelector('[data-a=onsave]')?.click()}
});

document.addEventListener('input',e=>{
  if(e.target.id=='ci'){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,160)+'px'}
  if(e.target.id=='ds'){S.spDocQ=e.target.value;R()}
  if(e.target.id=='qsr'){S.fq=e.target.value;R()}
  if(e.target.id=='gs'){S.spSearch=e.target.value;S.fq=e.target.value;R()}
  if(e.target.id=='hs'||e.target.id=='hm_'){
    const ml=$('#mail');
    if(ml){
      const em=supportEmail(),s=$('#hs')?.value||'',m=$('#hm_')?.value||'';
      ml.href=`mailto:${encodeURIComponent(em).replace('%40','@')}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(m+'\n\n— '+pn()+(S.user?.email?' ('+S.user.email+')':''))}`;
    }
  }
});

document.addEventListener('change',e=>{
  if(e.target.id=='fs'||e.target.id=='qfl'){S.fs=e.target.value;R()}
});

document.addEventListener('submit',async e=>{
  if(e.target.id==='qf'){
    e.preventDefault();
    const qs=($('#qs')?.value||'').trim();
    const qd=$('#qd')?.value||null;
    const qp=$('#qp')?.value||'medium';
    const qt=($('#qt')?.value||'').trim();
    if(!qs)return;
    const body={
      subject:qs,
      question:qs+(qt?'\n\n'+qt:''),
      department_id:qd||null,
      priority:qp,
      description:qt||null
    };
    const res=await apiCall('/tickets',{method:'POST',body:JSON.stringify(body)});
    const dlg=$('#dq');
    if(dlg&&typeof dlg.close==='function')dlg.close();
    if(res.ok){
      toast('Query created: '+(res.data?.ticket_number||res.data?.id||'Submitted'));
      await reloadTicketList();
      S.view='queries';R();loadViewData('queries');
    }else{
      toast(typeof res.error==='string'?res.error:'Could not submit query. Try again.');
    }
  }
});

window.addEventListener('hashchange',()=>{
  const raw=(location.hash.slice(1)||'').trim().toLowerCase();
  if(['student','faculty','authority','management','super_admin','admin','non-authority','non_authority'].includes(raw)){
    loginAsRole(raw);
    return;
  }
  if(S.scr==='app'){
    const routeMap={
      dashboard: S.role==='student' ? 'chat' : 'dash',
      dash: S.role==='student' ? 'chat' : 'dash',
      chat:'chat',assistant:'chat',ai:'chat',
      documents:'docs',docs:'docs',
      announcements:'ann',ann:'ann',
      queries:'queries',
      tix:'tix',tickets:'tix',
      fdash:'fdash',overview:'fdash',
      publish:'publish',
      courses:'courses',
      stats:'x',analytics:'x',
      profile:'profile',
      settings:'settings',
      help:'help'
    };
    if(routeMap[raw]&&S.view!==routeMap[raw]){
      S.view=routeMap[raw];S.nav=false;R();loadViewData(S.view);
    }
  }
});

// Restore the signed-in session from the backend (the server checks the token)


// Restore session from backend on page refresh
async function restoreSession(){
  const token = localStorage.getItem('ub-token');
  if(!token){ R(); return; }
  const r=await apiCall('/auth/me');
  if(r.ok&&r.data){
    const me=r.data;
    S.user={id:me.id,email:me.email,name:me.full_name||me.email.split('@')[0],full_name:me.full_name,role:me.role,campus_id:me.campus_id,department_id:me.department_id};
    S.role=me.role;S.scr='app';
    S.view=me.role=='student'?'chat':me.role=='faculty'?'tix':'x';
    R();await loadViewData(S.view);return;
  }else if(r.status===401||r.status===403){
    try{localStorage.removeItem('ub-token')}catch(e){}
  }
  R();
}

if(typeof fetch === 'function' && UB_API_BASE)fetch(UB_API_BASE+'/health',{cache:'no-store'}).catch(()=>{});

const _urlParams = typeof window!=='undefined'&&window.location?.search ? new URLSearchParams(window.location.search) : null;
const _queryPortal = _urlParams ? (_urlParams.get('portal') || _urlParams.get('role') || '').toLowerCase() : '';
const _hashPortal = typeof window!=='undefined'&&window.location?.hash ? (window.location.hash.slice(1)||'').toLowerCase() : '';
const _targetRole = ['student','faculty','authority','management','super_admin','admin','non-authority','non_authority'].find(r => r === _queryPortal || r === _hashPortal);

if(_targetRole){
  loginAsRole(_targetRole);
}else if(typeof localStorage!=='undefined' && localStorage.getItem('ub-token')){
  restoreSession();
}else if(typeof localStorage!=='undefined' && localStorage.getItem('ub-current-user') && ACC[localStorage.getItem('ub-current-user')]){
  loginAsRole(ACC[localStorage.getItem('ub-current-user')].role);
}else{
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => R());
  } else {
    R();
  }
}
</script>
