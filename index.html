<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniBuddy — Campus AI Assistant & Query Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./runtime-config.js"></script>
<style>
:root{--bg:#141413;--ice:rgba(74,124,247,.12);--lav:rgba(74,124,247,.16);--bg2:#242321;--ind:#4a7cf7;--indd:#739eff;--navy:#faf9f5;--deep:#faf9f5;--ink:#faf9f5;--slate:#a6a39b;--bd:#34322e;--sh:0 4px 20px -2px rgba(0,0,0,.45);--sh2:0 12px 36px -4px rgba(0,0,0,.65);--grad:linear-gradient(135deg,#4a7cf7,#3864d4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14.5px/1.55 Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}h2{font-size:22px}h3{font-size:15.5px}
.ed{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.02em;line-height:1.15}h1.ed{font-size:clamp(32px,4.5vw,50px)}h2.ed{font-size:clamp(24px,3.2vw,32px)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{height:40px;padding:0 18px;border-radius:12px;border:1px solid var(--bd);background:#242321;color:#faf9f5;box-shadow:0 1px 2px rgba(0,0,0,.2);cursor:pointer;font-weight:500;transition:transform .2s,box-shadow .2s,border-color .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:var(--ind)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--grad);color:#fff;border:0;box-shadow:0 6px 18px -4px rgba(74,124,247,.45)}
.btn.sm{height:32px;padding:0 13px;font-size:13px;border-radius:10px}.btn.w{width:100%}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--slate);transition:background .2s,color .2s,transform .2s;position:relative}.ib:hover{background:rgba(255,255,255,.06);color:var(--navy)}.ib:active{transform:scale(.93)}
:focus-visible{outline:2px solid var(--ind);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
input,select,textarea{width:100%;height:42px;background:#181716;border:1px solid var(--bd);border-radius:12px;padding:0 14px;color:#faf9f5;transition:border-color .2s,box-shadow .2s}textarea{height:auto;padding:11px 14px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ind);box-shadow:0 0 0 4px rgba(74,124,247,.25)}
label{display:block;font-size:13px;font-weight:500;margin:14px 0 6px}
.mut{color:var(--slate)}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#4a7cf7,#3864d4);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;box-shadow:0 5px 10px -4px rgba(74,124,247,.8),inset 0 1px 0 rgba(255,255,255,.3)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;cursor:pointer;letter-spacing:-.02em;color:var(--navy)}
.ico{width:42px;height:42px;border-radius:13px;background:#242321;border:1px solid var(--bd);display:grid;place-items:center;color:var(--indd);box-shadow:0 5px 10px -5px rgba(0,0,0,.4);flex:none}
.card{background:#201f1d;border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:20px;color:#faf9f5}
.tint{background:linear-gradient(180deg,rgba(74,124,247,.1),#201f1d)}
.lift{transition:transform .22s,box-shadow .22s,border-color .22s;cursor:pointer}.lift:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:#48453f}
.fx{animation:fx .25s ease both}@keyframes fx{from{opacity:0;transform:translateY(6px)}}.in{animation:fx .25s ease both}
.lnk{background:none;border:0;cursor:pointer;color:var(--slate);padding:6px 10px;font-weight:500;transition:color .2s}.lnk:hover{color:var(--navy)}
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:99px;background:rgba(74,124,247,.14);border:1px solid rgba(74,124,247,.3);color:#8bb0ff;font-size:12.5px;font-weight:500;padding:4px 12px}
/* landing */
.land{position:relative;overflow:hidden;min-height:100vh}.land:before,.land:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.land:before{width:560px;height:560px;right:-160px;top:-180px;background:radial-gradient(circle,var(--lav),transparent 68%)}.land:after{width:520px;height:520px;left:-200px;top:260px;background:radial-gradient(circle,var(--ice),transparent 68%)}
.land>*{position:relative;z-index:1}
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px max(20px,5vw);gap:10px}.wrap{max-width:1060px;margin:auto;padding:0 max(20px,4vw)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:56px 0 72px}.hero p{color:var(--slate);font-size:17px;max-width:470px;margin:18px 0 28px}
.stage{position:relative;padding:28px 0 28px 18px}.prev{transform:perspective(1100px) rotateY(-6deg) rotateX(2deg);box-shadow:var(--sh2),0 40px 60px -34px rgba(38,54,83,.3);padding:18px;max-width:430px;margin-left:auto}
.chipf{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:500;box-shadow:var(--sh2);display:flex;gap:6px;align-items:center;color:var(--navy)}.c1{left:-6px;bottom:6px}.c2{right:6px;top:0;background:var(--lav)}
.bento{display:grid;grid-template-columns:1.1fr 1fr 1fr;grid-template-rows:auto auto;gap:14px;padding-bottom:72px}.bt{border-radius:20px;padding:24px;border:1px solid var(--bd);transition:transform .22s,box-shadow .22s;cursor:default}.bt:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.bt p{margin:6px 0 0;color:var(--slate);font-size:14px}.bt .ico{margin-bottom:16px}.bt.tall{grid-row:span 2;background:linear-gradient(160deg,var(--lav),#fff 75%)}.bt.tall h3{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:26px;line-height:1.15;margin-top:6px}.bt.tall p{font-size:15px}
.bt.b{background:var(--ice);grid-column:span 2}.bt.m{background:var(--bg2)}.bt.w{background:#fff}
.how{padding:0 0 72px}.hsteps{display:grid;grid-template-columns:repeat(3,1fr);margin-top:26px;position:relative}.hsteps:before{content:"";position:absolute;left:18px;right:18px;top:18px;height:2px;background:linear-gradient(90deg,var(--ind),#d5dcf1)}
.hs{position:relative;padding-right:24px}.num{width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--ind);color:var(--indd);display:grid;place-items:center;font-weight:600;margin-bottom:14px;position:relative}.hs p{margin:0;max-width:240px}
footer{padding:24px;text-align:center;color:var(--slate);font-size:13px;border-top:1px solid var(--bd)}

/* Redesigned Centered Login Page — matching screenshot visual aesthetic */
.login-wrap{--bg:#FFFFFF;--lav:#F0EDFF;--ice:#EAF1FC;--navy:#263653;--slate:#687386;--bd:#E3E8F0;--sh:0 1px 2px rgba(38,54,83,.05),0 8px 22px -10px rgba(38,54,83,.14);color-scheme:light;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px 20px 48px;background:radial-gradient(1100px 520px at 50% -10%,#F0EDFF,transparent 72%),#ffffff}
.login-wrap input{background:#ffffff;border:1px solid var(--bd);color:var(--navy)}
.login-header{text-align:center;max-width:540px;margin-bottom:26px}
.login-card{width:100%;max-width:440px;background:#ffffff;border:1px solid var(--bd);border-radius:22px;padding:32px 28px;box-shadow:var(--sh);position:relative}
.g-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:44px;background:#ffffff;border:1px solid var(--bd);border-radius:12px;color:var(--navy);font-weight:500;font-size:14.5px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;box-shadow:0 1px 2px rgba(38,54,83,.05)}
.g-btn:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:#b4c5e7;background:#fafbff}
.g-btn:active{transform:scale(.98)}
.divider{display:flex;align-items:center;margin:18px 0 16px;color:var(--slate);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--bd)}
.divider:before{margin-right:12px}.divider:after{margin-left:12px}

/* Demo Accounts Section */
.demo-section{width:100%;max-width:960px;margin-top:44px}
.demo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}
.demo-card{background:#ffffff;border:1px solid var(--bd);border-radius:20px;padding:22px 18px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
.demo-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--ind)}
.demo-card.t-lav{background:var(--lav);border-color:#d5cef7}
.demo-card.t-ice{background:var(--ice);border-color:#cddaf5}
.demo-card h3{font-size:16px;font-weight:600;color:var(--navy);margin-top:6px}
.demo-card p{font-size:13px;color:var(--slate);line-height:1.45;margin:0;flex:1}
.demo-card .demo-badge{font-size:11.5px;color:var(--slate);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(38,54,83,.05);padding:3px 8px;border-radius:6px;width:fit-content;margin:4px 0}
.demo-card .btn{background:#ffffff;border:1px solid var(--bd);color:var(--navy);font-weight:500;margin-top:8px}
.demo-card:hover .btn{border-color:var(--ind);background:linear-gradient(180deg,#ffffff,var(--ice))}
.demo-card.t-lav .btn{background:#ffffff}
@media(max-width:860px){.demo-grid{grid-template-columns:repeat(2,1fr)}.login-wrap{padding:32px 16px}}
@media(max-width:520px){.demo-grid{grid-template-columns:1fr}}

/* App Shell */
.app{display:flex;height:100vh;height:100dvh}
.side{width:262px;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px;flex:none;transition:transform .22s}.side .logo{padding:2px 8px 18px}
.si{display:flex;align-items:center;gap:11px;width:100%;height:40px;padding:0 12px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--slate);text-align:left;transition:background .2s,color .2s,transform .2s;position:relative}
.si:hover{background:var(--bg2);color:var(--navy)}.si:active{transform:scale(.98)}.si.on{background:var(--lav);color:var(--indd);font-weight:600}.si.on:before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ind)}
.si.nc{background:var(--grad);color:#fff;font-weight:500;margin-bottom:14px;box-shadow:0 8px 16px -8px rgba(79,102,168,.9),inset 0 1px 0 rgba(255,255,255,.3);justify-content:center}.si.nc:hover{filter:brightness(1.06);color:#fff}
.sh{font-size:12px;color:var(--slate);padding:16px 12px 6px;font-weight:500}.hist{overflow:auto;flex:1;min-height:60px}.hist .si{height:34px;font-size:13.5px}.hist .si span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof{border-top:1px solid var(--bd);padding-top:12px;margin-top:10px}.prof .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#8ea2db,#5f76bb);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:radial-gradient(800px 280px at 75% -80px,var(--lav),transparent 70%),#fff}
.hd{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none;position:relative;border-bottom:1px solid var(--bd);background:rgba(255,255,255,.7);backdrop-filter:blur(8px)}
.menu{display:none}.on-ind{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--slate)}.pu{width:8px;height:8px;border-radius:50%;background:#58b394;animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(88,179,148,.45)}50%{box-shadow:0 0 0 5px rgba(88,179,148,0)}}
.page{flex:1;overflow:auto;padding:30px max(16px,3vw)}.pg{max-width:880px;margin:auto}.pg.wide{max-width:980px}

/* Chat */
.chatw{flex:1;display:flex;flex-direction:column;min-height:0}.msgs{flex:1;overflow:auto;padding:24px 16px}.col{max-width:740px;margin:auto}
.empty{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-bottom:30px}
.welcome{position:relative;padding:34px 30px 30px;border-radius:28px;background:radial-gradient(closest-side at 50% 30%,var(--lav),transparent),radial-gradient(closest-side at 80% 90%,var(--ice),transparent);width:100%}.welcome .mark{width:54px;height:54px;border-radius:17px;font-size:23px;margin:0 auto 16px}.welcome p{color:var(--slate);margin:8px 0 22px;font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px;margin:auto}.chip{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:99px;padding:9px 16px 9px 12px;font-weight:500;font-size:13.5px;cursor:pointer;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}.chip svg{color:var(--indd)}.chip:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--ind);background:var(--lav)}.chip:active{transform:scale(.97)}
.u{display:flex;justify-content:flex-end;margin:20px 0 4px}.ub{background:var(--lav);border:1px solid #e1dbfa;color:var(--navy);padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:80%}
.ts{font-size:11.5px;color:var(--slate);margin-top:4px;opacity:.85}.tsr{text-align:right}
.a{display:flex;gap:12px;margin:18px 0}.a .body{flex:1;min-width:0}.a .who{font-weight:600;font-size:13.5px;margin-bottom:2px}
.vb{display:inline-flex;align-items:center;gap:5px;background:var(--ice);color:var(--indd);border:1px solid #d3e0f6;border-radius:99px;padding:2px 10px 2px 8px;font-size:12px;font-weight:600}
.ans ul,.ans ol{margin:6px 0 6px 20px;padding:0}.ans li{margin:3px 0}.ans p{margin:0 0 8px}.ans p:last-child{margin-bottom:0}
.src{margin-top:10px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;background:var(--bg2);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--slate);border-left:3px solid var(--ind)}.src button{color:var(--indd);font-weight:600;background:none;border:0;cursor:pointer;padding:0;text-decoration:underline}
.nf{margin-top:12px;background:var(--lav);border:1px solid #e1dbfa;border-radius:14px;padding:14px}
.ld{display:inline-flex;gap:5px;padding:10px 0}.ld span{width:7px;height:7px;border-radius:50%;background:var(--ind);animation:bl 1.2s infinite}.ld span:nth-child(2){animation-delay:.18s}.ld span:nth-child(3){animation-delay:.36s}@keyframes bl{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.comp{padding:0 16px 14px}.cbox{max-width:740px;margin:auto;border:1px solid var(--bd);border-radius:20px;display:flex;align-items:center;gap:4px;padding:8px 8px 8px 6px;background:#fff;box-shadow:var(--sh2);transition:border-color .2s,box-shadow .2s}.cbox:focus-within{border-color:var(--ind);box-shadow:0 0 0 4px rgba(113,135,201,.16),var(--sh2)}
.cbox input{border:0;height:42px;flex:1;box-shadow:none!important;background:none}.send{width:40px;height:40px;border-radius:13px;border:0;background:var(--grad);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 12px -5px rgba(79,102,168,.8),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .2s}.send:hover{transform:translateY(-1px)}.send:active{transform:scale(.92)}
.note{text-align:center;font-size:12px;color:var(--slate);margin-top:8px;opacity:.85}

/* Dashboard Editorial */
.sub{color:var(--slate);margin:8px 0 0;font-size:15.5px}
.askp{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:center;margin:26px 0 8px;padding:22px 24px;border-radius:22px;background:linear-gradient(120deg,var(--lav),var(--ice));border:1px solid #e1e6f7;box-shadow:var(--sh)}.askp p{margin:4px 0 0;color:var(--slate);font-size:13.5px}
.strip{display:flex;margin:22px 0 10px;border-bottom:1px solid var(--bd);padding-bottom:20px}.sti{flex:1;display:flex;gap:12px;align-items:center;padding:0 20px;border-left:1px solid var(--bd);cursor:pointer;transition:transform .2s}.sti:first-child{border:0;padding-left:0}.sti:hover{transform:translateY(-2px)}.sti b{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:32px;line-height:1;display:block}.sti span{font-size:12.5px;color:var(--slate)}.sti .ic{width:34px;height:34px;border-radius:10px;background:var(--ice);display:grid;place-items:center;color:var(--indd)}
.dgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:36px;margin:22px 0}.sh2{font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.feat1{border-radius:16px;padding:18px;background:linear-gradient(150deg,var(--lav),#fff);border:1px solid #e1dbfa;margin-bottom:6px;transition:transform .2s,box-shadow .2s;cursor:pointer}.feat1:hover{transform:translateY(-2px);box-shadow:var(--sh)}.feat1 h3{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:19px;margin:8px 0 2px}
.cat{font-size:12px;font-weight:600;color:var(--indd)}.dt{font-size:12px;color:var(--slate)}
.hrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}.hrow:last-child{border:0}.hrow span:first-child{display:flex;flex-direction:column}
.dl{position:relative;padding-left:20px}.dl:before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--ind),#dfe5f5)}.dli{position:relative;padding:0 0 16px}.dli:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ind)}.dli b{font-weight:600;display:block}.dli small{color:var(--slate);font-size:12.5px}
.qp{background:var(--bg2);border-radius:18px;padding:6px 18px}.qr{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer;transition:padding .2s}.qr:last-child{border:0}.qr:hover{padding-left:6px}.qr small{color:var(--slate);font-weight:500}

/* Announcements Magazine */
.mag{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:24px}.am{border-radius:20px;padding:22px;border:1px solid var(--bd);grid-column:span 2;transition:transform .22s,box-shadow .22s;display:flex;flex-direction:column;gap:6px}.am:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.am.big{grid-column:span 4;grid-row:span 2;padding:30px;justify-content:flex-end;min-height:260px}.am.big h3{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:30px;line-height:1.12}.am:nth-child(4),.am:nth-child(5){grid-column:span 3}
.am.lav{background:linear-gradient(150deg,var(--lav),#fff 85%)}.am.blue{background:linear-gradient(150deg,var(--ice),#fff 85%)}.am.mist{background:var(--bg2)}.am p{margin:0;color:var(--slate);font-size:13.5px}
.imp{align-self:flex-start;background:var(--indd);color:#fff;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 10px}

/* Tables & Tickets */
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-weight:500;font-size:12.5px;color:var(--slate);padding:10px 12px;background:var(--bg2);white-space:nowrap}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}td{padding:12px;border-bottom:1px solid var(--bd)}
table{min-width:620px}.card .tw{padding-bottom:6px}tr.rw{cursor:pointer;transition:background .2s}tr.rw:hover,tr.rw.on{background:var(--lav)}.tw{overflow-x:auto}

/* ==================== NEW SPLIT-CARD LOGIN PAGE STYLES (SCOPED) ==================== */
@view-transition {navigation:auto}
.ub-login {
  color-scheme: dark;
  --bg: #141413;
  --bg0: #141413;
  --bg2: #1e1d1b;
  --card: #201f1d;
  --card-hover: #262522;
  --ink: #faf9f5;
  --muted: #a6a39b;
  --line: #34322e;
  --blue: #4a7cf7;
  --bink: #739eff;
  --bsoft: rgba(74,124,247,.12);
  --ok: #2ea160;
  --bad: #e5484d;
  --e: cubic-bezier(.2,.8,.2,1);
}
.ub-login * {box-sizing:border-box;min-width:0}
.ub-login {margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif;display:flex;flex-direction:column;overflow-x:clip}
.ub-login::before {content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(55% 45% at 20% 12%,rgba(74,124,247,.08),transparent 70%),radial-gradient(45% 45% at 85% 88%,rgba(74,124,247,.06),transparent 70%)}
.ub-login a {color:var(--bink)}
.ub-login h1, .ub-login h2 {font-family:"Plus Jakarta Sans","DM Sans",sans-serif;font-weight:700;margin:0;letter-spacing:-.015em;text-wrap:balance}
.ub-login .top {display:flex;justify-content:space-between;align-items:center;padding:20px max(4vw,18px)}
.ub-login .brand {display:flex;align-items:center;gap:11px;font-family:"Plus Jakarta Sans","DM Sans",sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.ub-login .brand img {width:36px;height:36px;border-radius:10px;object-fit:contain;overflow:hidden;flex:none}
.ub-login .back {font-size:14px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;font-weight:500;transition:color .2s}
.ub-login .back:hover {color:var(--bink)}
.ub-login .back .ico {transition:transform .3s var(--e)}
.ub-login .back:hover .ico {transform:translateX(-4px)}
.ub-login main {flex:1;display:grid;place-items:center;padding:12px max(4vw,16px) 40px}

/* Unified Card */
.ub-login .card {
  width:min(1040px,100%);
  display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 24px 64px -20px rgba(24,61,105,.14),0 1px 3px rgba(24,61,105,.05);
  animation:in .7s var(--e) both;
  position:relative;
  transform:perspective(1400px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .4s var(--e);
}
.ub-login .ico {width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Left Hero Showcase with Animated Logo */
.ub-login .login-showcase {
  background:linear-gradient(160deg,#181716 0%,#201f1d 50%,#242321 100%);
  color:#faf9f5;
  padding:clamp(32px,4vw,48px);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:relative;
  overflow:hidden;
  border-right:1px solid rgba(255,255,255,.08);
}
.ub-login .login-showcase::before {
  content:"";
  position:absolute;
  width:440px;
  height:440px;
  top:-120px;
  right:-120px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(169,213,255,.24),transparent 70%);
  pointer-events:none;
  animation:showcaseOrbFloat 14s ease-in-out infinite alternate;
}
.ub-login .login-showcase::after {
  content:"";
  position:absolute;
  width:380px;
  height:380px;
  bottom:-100px;
  left:-80px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(67,143,232,.25),transparent 70%);
  pointer-events:none;
  animation:showcaseOrbFloat 18s ease-in-out infinite alternate-reverse;
}

.ub-login .showcase-brand-hero {
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  position:relative;
  z-index:2;
  margin-bottom:20px;
}

.ub-login .logo-stage-wrap {
  position:relative;
  width:132px;
  height:132px;
  display:grid;
  place-items:center;
  margin-bottom:16px;
  animation:logoHeroEntrance .9s cubic-bezier(.16,1,.3,1) both;
}
.ub-login .logo-halo-ring {
  position:absolute;
  inset:-12px;
  border-radius:36px;
  border:1.5px solid rgba(169,213,255,.35);
  background:radial-gradient(circle,rgba(67,143,232,.22),transparent 70%);
  animation:logoPulseRing 3.6s ease-in-out infinite;
  pointer-events:none;
}
.ub-login .logo-halo-ring.outer {
  inset:-24px;
  border-radius:44px;
  border-color:rgba(169,213,255,.18);
  animation:logoPulseRing 3.6s ease-in-out infinite 1.8s;
}
.ub-login .logo-pod-anchor {
  position:relative;
  width:108px;
  height:108px;
  border-radius:26px;
  background:#242321;
  border:2px solid #34322e;
  box-shadow:0 16px 36px -10px rgba(0,0,0,.6),0 0 28px rgba(74,124,247,.3);
  display:grid;
  place-items:center;
  animation:logoFloatBreathe 5s ease-in-out infinite;
  transition:transform .3s ease,box-shadow .3s ease;
  overflow:hidden;
}
.ub-login .logo-pod-anchor:hover {
  transform:translateY(-4px) scale(1.04);
  box-shadow:0 22px 42px -10px rgba(0,0,0,.4),0 0 38px rgba(67,143,232,.65);
}
.ub-login .showcase-logo-img {
  width:80px;
  height:80px;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 4px 10px rgba(24,61,105,.2));
  animation:logoGleam 6s ease-in-out infinite;
}

@keyframes logoHeroEntrance{
  0%{opacity:0;transform:translateY(24px) scale(.88);filter:blur(8px)}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
@keyframes logoFloatBreathe{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-7px) scale(1.025)}
}
@keyframes logoPulseRing{
  0%,100%{transform:scale(.96);opacity:.4}
  50%{transform:scale(1.06);opacity:.85}
}
@keyframes logoGleam{
  0%,100%{filter:drop-shadow(0 4px 10px rgba(24,61,105,.2))}
  50%{filter:drop-shadow(0 6px 18px rgba(67,143,232,.65))}
}
@keyframes showcaseOrbFloat{
  to{transform:translate(25px,20px) scale(1.08)}
}

.ub-login .showcase-body {
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.ub-login .showcase-desc {
  color:rgba(226,236,249,.9);
  font-size:14.5px;
  line-height:1.55;
  margin:0;
  text-align:center;
}
.ub-login .showcase-badges {
  display:flex;
  flex-direction:column;
  gap:11px;
  margin-top:6px;
}
.ub-login .showcase-pill {
  display:flex;
  align-items:center;
  gap:12px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  border-radius:13px;
  padding:10px 14px;
  backdrop-filter:blur(8px);
  transition:background .25s,border-color .25s,transform .25s;
}
.ub-login .showcase-pill:hover {
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.24);
  transform:translateX(4px);
}
.ub-login .showcase-pill .pico {
  width:32px;
  height:32px;
  border-radius:9px;
  background:rgba(67,143,232,.32);
  color:#93c5fd;
  display:grid;
  place-items:center;
  flex-shrink:0;
}
.ub-login .showcase-footer {
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:22px;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,.14);
  font-size:12px;
  color:rgba(219,234,254,.75);
}

/* Right Form Side */
.ub-login .side {
  padding:clamp(28px,4vw,48px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:#1c1b19;
}
.ub-login .side h1 {font-size:clamp(28px,3.2vw,36px);line-height:1.15;color:var(--ink)}
.ub-login .sub {color:var(--muted);margin:8px 0 24px;font-size:15px}
.ub-login .gbtn {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  min-height:48px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#242321;
  color:#faf9f5;
  font:600 15px "DM Sans",sans-serif;
  cursor:pointer;
  transition:all .2s;
  box-shadow:0 1px 2px rgba(0,0,0,.3);
}
.ub-login .gbtn:hover {background:#2e2c29;border-color:var(--blue);transform:translateY(-1px)}
.ub-login .gbtn:active, .ub-login .sbtn:active {transform:scale(.98)}
.ub-login .or {display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:20px 0}
.ub-login .or::before, .ub-login .or::after {content:"";flex:1;height:1px;background:var(--line)}
.ub-login form {display:grid;gap:14px}
.ub-login label {display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--ink)}
.ub-login .field {position:relative}
.ub-login .field .ico {position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none;transition:color .2s}
.ub-login .field:focus-within .ico {color:var(--bink)}
.ub-login input[type=email], .ub-login input[type=password], .ub-login input[type=text] {
  width:100%;
  min-height:48px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#181716;
  color:#faf9f5;
  font:15px "DM Sans",sans-serif;
  padding:0 44px;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
.ub-login input[type=email]:focus, .ub-login input[type=password]:focus, .ub-login input[type=text]:focus {
  outline:0;
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(74,124,247,.22);
  background:#181716;
}
.ub-login .field.bad input {border-color:var(--bad);animation:shk .45s}
.ub-login .field.bad .ico {color:var(--bad)}
.ub-login .eye {
  position:absolute;
  right:6px;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  border:0;
  background:none;
  color:var(--muted);
  cursor:pointer;
  display:grid;
  place-items:center;
  border-radius:8px;
  transition:color .2s,background .2s;
}
.ub-login .eye:hover {color:var(--ink);background:rgba(24,61,105,.06)}
.ub-login .eye .ico {transition:transform .3s var(--e)}
.ub-login .eye.on .ico {transform:scale(1.12);color:var(--bink)}
.ub-login .row {display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:10px;flex-wrap:wrap}
.ub-login .row label {display:flex;align-items:center;gap:8px;font-weight:400;color:var(--muted);cursor:pointer}
.ub-login .row input {width:18px;height:18px;accent-color:var(--blue)}
.ub-login .link {background:none;border:0;color:var(--bink);font:500 14px "DM Sans",sans-serif;cursor:pointer;padding:6px 0;transition:color .2s}
.ub-login .link:hover {color:var(--blue);text-decoration:underline}

.ub-login .sbtn {
  position:relative;
  overflow:hidden;
  min-height:50px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,var(--bink) 0%,var(--blue) 100%);
  color:#ffffff;
  font:600 16px "DM Sans",sans-serif;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  transition:transform .25s var(--e),box-shadow .3s;
  box-shadow:0 10px 24px -8px rgba(67,143,232,.6);
}
.ub-login .sbtn:hover {transform:translateY(-1px);box-shadow:0 14px 28px -8px rgba(67,143,232,.75)}
.ub-login .sbtn:disabled {opacity:.7;cursor:wait;transform:none}
.ub-login .sbtn::after {content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.24) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s var(--e);pointer-events:none}
.ub-login .sbtn:hover::after {transform:translateX(120%)}

.ub-login .spin {width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
.ub-login button:focus-visible, .ub-login input:focus-visible, .ub-login a:focus-visible {outline:2px solid var(--blue);outline-offset:2px}

.ub-login .msg {font-size:14px;border-radius:12px;padding:12px 14px;display:none;line-height:1.5}
.ub-login .msg.show {display:block;animation:fade .35s ease}
.ub-login .msg.err {background:rgba(229,72,77,.1);color:var(--bad);border:1px solid rgba(229,72,77,.25)}
.ub-login .msg.info {background:var(--bsoft);color:var(--bink);border:1px solid var(--line)}

.ub-login .demo-pills {display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.ub-login .demo-pills .btn {
  background:#242321;
  border:1px solid var(--line);
  color:#faf9f5;
  font-weight:600;
  transition:all .2s;
  min-height:32px;
  padding:0 12px;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
}
.ub-login .demo-pills .btn:hover {
  background:#2e2c29;
  border-color:var(--blue);
  color:#ffffff;
  transform:translateY(-1px);
}

.ub-login .newuni {margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.ub-login .preview {border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-top:16px}

.ub-login .state {display:none;text-align:center;animation:fade .45s ease}
.ub-login .state.show {display:block}
.ub-login .state .big {width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin:0 auto 18px;background:var(--bsoft);color:var(--bink);animation:popin .7s var(--e)}
.ub-login .state .big .ico {width:32px;height:32px}
.ub-login .state h1 {margin-bottom:10px;color:var(--ink)}
.ub-login .bar {height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin:24px auto 0;max-width:260px}
.ub-login .bar span {display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--bink));transition:width 1.6s ease}
.ub-login .btn {display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font:600 15px "DM Sans",sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:6px;transition:all .2s}
.ub-login .btn.pri {background:var(--ink);color:#ffffff;border-color:var(--ink)}
.ub-login .btn:hover {transform:translateY(-2px)}

.ub-login footer {display:block;text-align:center;font-size:13px;color:var(--muted);padding:0 16px 24px}

@media(max-width:860px) {
  .ub-login .card {grid-template-columns:minmax(0,1fr)}
  .ub-login .login-showcase {padding:26px 20px;border-right:0;border-bottom:1px solid rgba(255,255,255,.1)}
  .ub-login .logo-stage-wrap {width:110px;height:110px;margin-bottom:12px}
  .ub-login .logo-pod-anchor {width:90px;height:90px;border-radius:22px}
  .ub-login .showcase-logo-img {width:66px;height:66px}
  .ub-login .showcase-badges {gap:8px}
  .ub-login .showcase-pill {padding:8px 12px}
}

/* App Shell */
.app{display:flex;height:100vh;height:100dvh}
.side{width:262px;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px;flex:none;transition:transform .22s}.side .logo{padding:2px 8px 18px}
.si{display:flex;align-items:center;gap:11px;width:100%;height:40px;padding:0 12px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--slate);text-align:left;transition:background .2s,color .2s,transform .2s;position:relative}

.sh{font-size:12px;color:var(--slate);padding:16px 12px 6px;font-weight:500}.hist{overflow:auto;flex:1;min-height:60px}.hist .si{height:34px;font-size:13.5px}.hist .si span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof{border-top:1px solid var(--bd);padding-top:12px;margin-top:10px}.prof .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#8ea2db,#5f76bb);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:radial-gradient(800px 280px at 75% -80px,var(--lav),transparent 70%),#fff}
.hd{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none;position:relative;border-bottom:1px solid var(--bd);background:rgba(255,255,255,.7);backdrop-filter:blur(8px)}
.menu{display:none}.on-ind{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--slate)}.pu{width:8px;height:8px;border-radius:50%;background:#58b394;animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(88,179,148,.45)}50%{box-shadow:0 0 0 5px rgba(88,179,148,0)}}
.page{flex:1;overflow:auto;padding:30px max(16px,3vw)}.pg{max-width:880px;margin:auto}.pg.wide{max-width:980px}

/* Chat */
.chatw{flex:1;display:flex;flex-direction:column;min-height:0}.msgs{flex:1;overflow:auto;padding:24px 16px}.col{max-width:740px;margin:auto}
.empty{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-bottom:30px}
.welcome{position:relative;padding:34px 30px 30px;border-radius:28px;background:radial-gradient(closest-side at 50% 30%,var(--lav),transparent),radial-gradient(closest-side at 80% 90%,var(--ice),transparent);width:100%}.welcome .mark{width:54px;height:54px;border-radius:17px;font-size:23px;margin:0 auto 16px}.welcome p{color:var(--slate);margin:8px 0 22px;font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px;margin:auto}.chip{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:99px;padding:9px 16px 9px 12px;font-weight:500;font-size:13.5px;cursor:pointer;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}.chip svg{color:var(--indd)}.chip:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--ind);background:var(--lav)}.chip:active{transform:scale(.97)}
.u{display:flex;justify-content:flex-end;margin:20px 0 4px}.ub{background:var(--lav);border:1px solid #e1dbfa;color:var(--navy);padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:80%}
.ts{font-size:11.5px;color:var(--slate);margin-top:4px;opacity:.85}.tsr{text-align:right}
.a{display:flex;gap:12px;margin:18px 0}.a .body{flex:1;min-width:0}.a .who{font-weight:600;font-size:13.5px;margin-bottom:2px}
.vb{display:inline-flex;align-items:center;gap:5px;background:var(--ice);color:var(--indd);border:1px solid #d3e0f6;border-radius:99px;padding:2px 10px 2px 8px;font-size:12px;font-weight:600}
.ans ul,.ans ol{margin:6px 0 6px 20px;padding:0}.ans li{margin:3px 0}.ans p{margin:0 0 8px}.ans p:last-child{margin-bottom:0}
.src{margin-top:10px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;background:var(--bg2);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--slate);border-left:3px solid var(--ind)}.src button{color:var(--indd);font-weight:600;background:none;border:0;cursor:pointer;padding:0;text-decoration:underline}
.nf{margin-top:12px;background:var(--lav);border:1px solid #e1dbfa;border-radius:14px;padding:14px}
.ld{display:inline-flex;gap:5px;padding:10px 0}.ld span{width:7px;height:7px;border-radius:50%;background:var(--ind);animation:bl 1.2s infinite}.ld span:nth-child(2){animation-delay:.18s}.ld span:nth-child(3){animation-delay:.36s}@keyframes bl{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.comp{padding:0 16px 14px}.cbox{max-width:740px;margin:auto;border:1px solid var(--bd);border-radius:20px;display:flex;align-items:center;gap:4px;padding:8px 8px 8px 6px;background:#fff;box-shadow:var(--sh2);transition:border-color .2s,box-shadow .2s}.cbox:focus-within{border-color:var(--ind);box-shadow:0 0 0 4px rgba(113,135,201,.16),var(--sh2)}
.cbox input{border:0;height:42px;flex:1;box-shadow:none!important;background:none}.send{width:40px;height:40px;border-radius:13px;border:0;background:var(--grad);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 12px -5px rgba(79,102,168,.8),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .2s}.send:hover{transform:translateY(-1px)}.send:active{transform:scale(.92)}
.note{text-align:center;font-size:12px;color:var(--slate);margin-top:8px;opacity:.85}

/* Dashboard Editorial */
.sub{color:var(--slate);margin:8px 0 0;font-size:15.5px}
.askp{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:center;margin:26px 0 8px;padding:22px 24px;border-radius:22px;background:linear-gradient(120deg,var(--lav),var(--ice));border:1px solid #e1e6f7;box-shadow:var(--sh)}.askp p{margin:4px 0 0;color:var(--slate);font-size:13.5px}
.strip{display:flex;margin:22px 0 10px;border-bottom:1px solid var(--bd);padding-bottom:20px}.sti{flex:1;display:flex;gap:12px;align-items:center;padding:0 20px;border-left:1px solid var(--bd);cursor:pointer;transition:transform .2s}.sti:first-child{border:0;padding-left:0}.sti:hover{transform:translateY(-2px)}.sti b{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:32px;line-height:1;display:block}.sti span{font-size:12.5px;color:var(--slate)}.sti .ic{width:34px;height:34px;border-radius:10px;background:var(--ice);display:grid;place-items:center;color:var(--indd)}
.dgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:36px;margin:22px 0}.sh2{font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.feat1{border-radius:16px;padding:18px;background:linear-gradient(150deg,var(--lav),#fff);border:1px solid #e1dbfa;margin-bottom:6px;transition:transform .2s,box-shadow .2s;cursor:pointer}.feat1:hover{transform:translateY(-2px);box-shadow:var(--sh)}.feat1 h3{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:19px;margin:8px 0 2px}
.cat{font-size:12px;font-weight:600;color:var(--indd)}.dt{font-size:12px;color:var(--slate)}
.hrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}.hrow:last-child{border:0}.hrow span:first-child{display:flex;flex-direction:column}
.dl{position:relative;padding-left:20px}.dl:before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--ind),#dfe5f5)}.dli{position:relative;padding:0 0 16px}.dli:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ind)}.dli b{font-weight:600;display:block}.dli small{color:var(--slate);font-size:12.5px}
.qp{background:var(--bg2);border-radius:18px;padding:6px 18px}.qr{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer;transition:padding .2s}.qr:last-child{border:0}.qr:hover{padding-left:6px}.qr small{color:var(--slate);font-weight:500}

/* Announcements Magazine */
.mag{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:24px}.am{border-radius:20px;padding:22px;border:1px solid var(--bd);grid-column:span 2;transition:transform .22s,box-shadow .22s;display:flex;flex-direction:column;gap:6px}.am:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.am.big{grid-column:span 4;grid-row:span 2;padding:30px;justify-content:flex-end;min-height:260px}.am.big h3{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:30px;line-height:1.12}.am:nth-child(4),.am:nth-child(5){grid-column:span 3}
.am.lav{background:linear-gradient(150deg,var(--lav),#fff 85%)}.am.blue{background:linear-gradient(150deg,var(--ice),#fff 85%)}.am.mist{background:var(--bg2)}.am p{margin:0;color:var(--slate);font-size:13.5px}
.imp{align-self:flex-start;background:var(--indd);color:#fff;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 10px}

/* Tables & Tickets */
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-weight:500;font-size:12.5px;color:var(--slate);padding:10px 12px;background:var(--bg2);white-space:nowrap}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}td{padding:12px;border-bottom:1px solid var(--bd)}
table{min-width:620px}.card .tw{padding-bottom:6px}tr.rw{cursor:pointer;transition:background .2s}tr.rw:hover,tr.rw.on{background:var(--lav)}.tw{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--bg2);color:var(--slate)}.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.s1{background:var(--ice);color:#4a68a8}.pill.s2{background:var(--lav);color:#6a58b8}.pill.s3{background:#e3f3ec;color:#2f7d62}
.pri{font-size:12.5px;font-weight:500}.pri.High{color:var(--indd);font-weight:700}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:18px}.two>div{display:grid;gap:16px;align-content:start}.lab{font-size:12.5px;color:var(--slate)}
.prog{height:6px;border-radius:9px;background:var(--bg2);overflow:hidden;margin:0 0 6px}.prog i{display:block;height:100%;width:var(--p);border-radius:9px;background:linear-gradient(90deg,#8ea2db,var(--indd));animation:gr .7s ease-out both}@keyframes gr{from{width:0}}
.tl{padding-left:24px;margin-top:16px}.tl>div{position:relative;padding-bottom:18px;color:var(--slate)}.tl>div:before{content:"";position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bd);background:#242321}
.tl>div:after{content:"";position:absolute;left:-18px;top:18px;bottom:-4px;width:2px;background:var(--bd)}.tl>div:last-child:after{display:none}.tl>div.d{color:var(--ink);font-weight:500}.tl>div.d:before{background:var(--ind);border-color:var(--ind);box-shadow:0 0 0 4px rgba(74,124,247,.25)}.tl>div.d:after{background:var(--ind)}.tl small{display:block;color:var(--slate);font-size:12px;font-weight:400}
.drop{position:absolute;right:14px;top:54px;width:330px;max-width:calc(100vw - 28px);background:#201f1d;border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh2);padding:8px;z-index:30;animation:fx .2s ease both}
.n{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer;font-size:13.5px;transition:background .2s}.n:hover{background:rgba(255,255,255,.06)}.n i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}.n.un i{background:var(--ind)}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--ind);border:2px solid #201f1d;animation:pop .3s cubic-bezier(.2,1.5,.4,1) both}@keyframes pop{from{transform:scale(0)}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:50;padding:16px;animation:fi .2s both}.ov.out{animation:fo .16s both}@keyframes fi{from{opacity:0}}@keyframes fo{to{opacity:0}}
.modal{width:100%;max-width:490px;max-height:92vh;overflow:auto;background:#1e1d1b;border:1px solid var(--bd);border-radius:22px;padding:24px;box-shadow:var(--sh2),0 30px 60px -24px rgba(0,0,0,.75);animation:mi .25s cubic-bezier(.2,1,.4,1) both;color:#faf9f5}.out .modal{animation:mo .16s both}@keyframes mi{from{opacity:0;transform:translateY(12px) scale(.97)}}@keyframes mo{to{opacity:0;transform:translateY(8px) scale(.98)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#242321;color:#faf9f5;border:1px solid var(--bd);padding:11px 18px;border-radius:12px;z-index:99;font-size:13.5px;max-width:90vw;box-shadow:var(--sh2);animation:tin .25s both}@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.scrim{display:none}
.avb{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#8ea2db,#5f76bb);color:#fff;display:grid;place-items:center;font-weight:600;font-size:20px;flex:none}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding-top:28px}.prev{transform:none;margin:0}.chipf{display:none}.bento{grid-template-columns:1fr}.bt.tall{grid-row:auto}.bt.b{grid-column:auto}.hsteps{grid-template-columns:1fr;gap:20px}.hsteps:before{display:none}.split{grid-template-columns:1fr}.brandp{display:none}
.side{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);width:280px;box-shadow:var(--sh2)}.side.open{transform:none}.scrim.open{display:block;position:fixed;inset:0;background:rgba(38,54,83,.3);z-index:35}.menu{display:grid}
.two,.dgrid,.askp{grid-template-columns:1fr}.strip{flex-wrap:wrap;gap:14px}.sti{flex:1 1 40%;padding:0 10px}.g2{grid-template-columns:1fr}.mag{grid-template-columns:1fr}.am,.am.big,.am:nth-child(4),.am:nth-child(5){grid-column:auto;grid-row:auto}.am.big{min-height:200px}.qr{grid-template-columns:1fr auto}.qr small{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:18px}.row-link{cursor:pointer}.row-link:hover{box-shadow:var(--sh2)}.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}
.filters{margin-top:16px;padding:14px}.flt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.flt{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--slate)}.flt select,.flt input{height:38px;padding:0 8px}

/* ==================== NEW EDITORIAL LANDING PAGE STYLES (SCOPED) ==================== */
.ub-landing .rv {opacity:1!important;transform:none!important;filter:none!important}
.ub-landing .herocopy>* {opacity:1!important}
@view-transition {navigation:auto}
.ub-landing {--bg:#1a1918;--bg2:#262624;--bg0:#141413;--ink:#faf9f5;--mute:#a6a39b;--dim:#73716b;--line:#3a3936;--blue:#4a7cf7;--sage:#c3d2ca;--lav:#cdcbe0;--peach:#e9cdbb;--paper:#f5f3ee}
.ub-landing * {box-sizing:border-box;min-width:0}
.ub-landing {scroll-behavior:smooth;scroll-padding-top:120px}
.ub-landing {margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "DM Sans",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
.ub-landing a {color:inherit;text-decoration:none}
.ub-landing h1, .ub-landing h2, .ub-landing h3, .ub-landing .serif {font-family:"Source Serif 4",Georgia,serif;font-weight:500;letter-spacing:-.02em;margin:0;text-wrap:balance}
.ub-landing h1 {font-size:clamp(52px,7.6vw,104px);line-height:1}
.ub-landing h2 {font-size:clamp(40px,5vw,72px);line-height:1.04}
.ub-landing h3 {font-size:clamp(22px,2vw,28px);line-height:1.2}
.ub-landing p {margin:0}
.ub-landing .wrap {max-width:1360px;margin:0 auto;padding:0 max(4.5vw,20px)}
.ub-landing .sec {padding:clamp(80px,10vw,150px) 0}
.ub-landing .alt {background:var(--bg2)}
.ub-landing .center {text-align:center}
.ub-landing .lede {font-size:clamp(18px,1.6vw,22px);color:var(--mute);line-height:1.5}
.ub-landing .btn {display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:10px;font:500 17px "DM Sans",sans-serif;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.ub-landing .btn:hover {border-color:#5a5853;background:rgba(255,255,255,.03)}
.ub-landing .btn.light {background:var(--ink);color:var(--bg0);border-color:var(--ink)}
.ub-landing .btn.light:hover {background:#fff}
.ub-landing .ico {width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ub-landing a:focus-visible, .ub-landing button:focus-visible, .ub-landing input:focus-visible, .ub-landing summary:focus-visible {outline:2px solid var(--blue);outline-offset:3px}
.ub-landing header {position:sticky;top:0;z-index:40;background:var(--bg0)}
.ub-landing .nav {height:72px;display:flex;align-items:center;gap:32px}
.ub-landing .brand {display:flex;align-items:center;gap:10px;font-family:"Source Serif 4",serif;font-size:27px;font-weight:500;letter-spacing:-.02em}
.ub-landing .brand img {width:30px;height:30px;border-radius:8px;flex:none}
.ub-landing .links {display:flex;gap:30px;margin-left:auto;color:#cfcbc2;font-size:16px}
.ub-landing .links a:hover {color:var(--ink)}
.ub-landing .navr {display:flex;gap:10px;align-items:center}
.ub-landing .navr .login {color:#cfcbc2;padding:0 6px}
.ub-landing .navr .btn {min-height:40px;padding:0 16px;font-size:16px}
.ub-landing .subnav {border-top:1px solid #2a2927;border-bottom:1px solid #2a2927;background:var(--bg0)}
.ub-landing .subnav .wrap {height:46px;display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--mute)}
.ub-landing .jump {position:relative}
.ub-landing .jump summary {list-style:none;cursor:pointer;display:flex;gap:6px;align-items:center}
.ub-landing .jump summary::-webkit-details-marker {display:none}
.ub-landing .jump div {position:absolute;right:0;top:32px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:200px;display:grid}
.ub-landing .jump div a {padding:8px 12px;border-radius:8px;color:#d8d4cb}
.ub-landing .jump div a:hover {background:#2f2e2b}
.ub-landing .hero {position:relative;min-height:max(720px,calc(100vh - 118px));display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;overflow:hidden;background:var(--bg0);padding:clamp(48px,6vw,84px) 24px!important}
.ub-landing .tiles {--s:140px;--col-left:clamp(24px,4.5vw,64px);--col-right:calc(100% - clamp(24px,4.5vw,64px) - var(--s));position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 8%,#000 82%,transparent 100%),radial-gradient(ellipse 65% 70% at 50% 50%,transparent 40%,#000 75%);-webkit-mask-composite:source-in;mask-image:linear-gradient(180deg,transparent 0,#000 8%,#000 82%,transparent 100%),radial-gradient(ellipse 65% 70% at 50% 50%,transparent 40%,#000 75%);mask-composite:intersect}
.ub-landing .tile {position:absolute;top:0;width:var(--s);max-width:var(--s);will-change:transform}
.ub-landing .tile.col-left {left:var(--col-left)}
.ub-landing .tile.col-right {left:var(--col-right)}
.ub-landing .tile .face {aspect-ratio:1;border-radius:12px;overflow:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.ub-landing .tile:hover .face {transform:scale(1.04)}
.ub-landing .tile span {display:block;margin-top:10px;font-size:13.5px;font-weight:500;color:var(--mute);text-align:center;width:100%;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
@media(max-width:1280px){.ub-landing .tiles{--s:130px;--col-left:clamp(20px,3.5vw,48px);--col-right:calc(100% - clamp(20px,3.5vw,48px) - var(--s))}}
@media(max-width:1024px){.ub-landing .tiles{--s:115px;--col-left:clamp(16px,2.5vw,32px);--col-right:calc(100% - clamp(16px,2.5vw,32px) - var(--s))}.ub-landing .tile span{font-size:12.5px}}
@media(max-width:768px){.ub-landing .tiles{--s:105px;--col-left:14px;--col-right:calc(100% - 14px - var(--s))}.ub-landing .tile span{font-size:11.5px}}
@media(max-width:640px){.ub-landing .tiles{--s:120px;--col-left:calc(50% - var(--s)/2);--col-right:calc(50% - var(--s)/2);-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10%,#000 80%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 10%,#000 80%,transparent 100%)}.ub-landing .tile.col-left,.ub-landing .tile.col-right{left:calc(50% - var(--s)/2)!important}.ub-landing .tile span{font-size:12px}}
.ub-landing .sq svg {stroke-dasharray:820;stroke-dashoffset:820;animation:draw var(--t) ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes draw {to{stroke-dashoffset:0}}
.ub-landing .ui .ln {background:linear-gradient(90deg,#e2dfd7 0%,#efece5 45%,#e2dfd7 90%);background-size:220% 100%;animation:shim 2.8s linear infinite}
@keyframes shim {to{background-position:-220% 0}}
.ub-landing .ui .tag {position:relative;padding-left:14px!important}
.ub-landing .ui .tag::before {content:"";position:absolute;left:6px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:currentColor;animation:blinkd 1.4s ease-in-out infinite}
@keyframes blinkd {50%{opacity:.2}}
.ub-landing .ui .bars i {transform-origin:bottom;animation:bar 2.6s ease-in-out infinite alternate}
.ub-landing .ui .bars i:nth-child(2) {animation-delay:-.7s}
.ub-landing .ui .bars i:nth-child(3) {animation-delay:-1.3s}
.ub-landing .ui .bars i:nth-child(4) {animation-delay:-1.9s}
@keyframes bar {from{transform:scaleY(.45)}}
.ub-landing .ui .grid i {transition:background .5s}
.ub-landing .ui .row {padding:2px 6px;margin:0 -6px;border-radius:5px;transition:background .5s,color .5s}
.ub-landing .ui .row.on {background:#e4ecff;color:#2c55c9}
.ub-landing .ui .cd {font-variant-numeric:tabular-nums;color:#2c55c9;font-weight:600}
.ub-landing .ui .tag.ok {background:#e3f4ea;color:#17784a}
.ub-landing .sq {background:#232220}
.ub-landing .sq svg {width:100%;height:100%;stroke:#46443f;fill:none;stroke-width:1.2}

// Backend API client.
const sleepMs=ms=>new Promise(r=>setTimeout(r,ms));
window.__ubTimes=window.__ubTimes||[];
async function apiCall(endpoint,options={}){
  if(!UB_API_BASE)return {ok:false,status:0,error:'Backend URL is not configured for this website.'};
  const method=String(options.method||'GET').toUpperCase();
  const isAuth=endpoint.startsWith('/auth/');
  if(!isAuth && window.__authPromise && !localStorage.getItem('ub-token')){
    try{ await window.__authPromise; }catch(e){}
  }
  const attempts=options.maxAttempts||(isAuth?14:(method==='GET'||options.idempotent?3:1));
  const started=performance.now();
  const label=endpoint.split('?')[0].replace(/[0-9a-f]{8}-[0-9a-f-]{27}/g,':id');
  const token=localStorage.getItem('ub-token');
  if(!isAuth && !token && S.user){
    return {ok:false,status:401,error:'Your sign-in session has ended. Sign in again to continue.',data:null};
  }
  const headers={...((typeof FormData!=='undefined'&&options.body instanceof FormData)?{}:{'Content-Type':'application/json'}),...(options.headers||{})};
  if(token)headers['Authorization']=`Bearer ${token}`;
  for(let i=0;i<attempts;i++){
    const last=i===attempts-1;
    try{
      const res=await fetch(UB_API_BASE+endpoint,{...options,headers});
      window.__ubTimes.push({endpoint:label,status:res.status,ms:Math.round(performance.now()-started)});
      if(!res.ok){
        if(!last&&[500,502,503,504].includes(res.status)){
          await sleepMs(Math.min(3000,1000+i*400));
          continue;
        }
        let errData=null;
        try{errData=await res.json()}catch(e){}
        const errDetail=errData?.detail||errData?.message||`HTTP ${res.status}`;
        return {ok:false,status:res.status,error:errDetail,data:null};
      }
      if(res.status===204)return {ok:true,status:204,data:null};
      const data=await res.json();
      return {ok:true,status:res.status,data};
    }catch(err){
      if(!last){
        await sleepMs(Math.min(3000,1000+i*400));
        continue;
      }
      return {ok:false,status:0,error:err.message||'Network error',data:null};
    }
  }
  return {ok:false,status:0,error:'UniBuddy server is waking up. Please try again in a moment.',data:null};
}

    const list = getSharedTickets().filter(x => x.id !== t.id && x.uuid !== t.uuid);
    list.unshift(t);

function mergeSharedTickets(tickets) {
  const shared = getSharedTickets();
  const existing = new Set((tickets || []).map(x => x.id || x.uuid));
  const merged = [...(tickets || [])];
  for (const s of shared) {
    if (!existing.has(s.id) && !existing.has(s.uuid)) {
      merged.unshift(s);
      existing.add(s.id || s.uuid);
    }
  }
  return merged;
}

    return timeB - timeA;
  });
}

function parseJwt(token){
  try {
    const base64Url = token.split('.')[1];
    if(!base64Url) return null;
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(jsonPayload);
  } catch(e) { return null; }
}

// Google Sign-In Credential Handler — instant sub-second sign-in (<50ms)
async function handleGoogleCredential(id_token){
  if(!id_token)return;
  const er=$('#err');
  if(er)er.textContent='';

  // Instant sub-second client transition using Google verified identity
  const payload = parseJwt(id_token);
  if(payload && payload.email){
    const email = payload.email.toLowerCase();
    const isFaculty = email.includes('faculty') || email === 'tarun.s26366@nst.rishihood.edu.in';
    const isAuthority = email.includes('authority') || email.includes('admin') || email.includes('dean');
    const isManagement = email.includes('management') || email === 'jaysinghf204@gmail.com';
    const initialRole = isFaculty ? 'faculty' : isAuthority ? 'authority' : isManagement ? 'management' : 'student';

    S.user = {
      id: payload.sub || 'google-user',
      email: payload.email,
      name: payload.name || payload.email.split('@')[0],
      full_name: payload.name || payload.email.split('@')[0],
      role: initialRole,
      campus_id: null,
      department_id: null
    };
    S.role = initialRole;
    S.scr = 'app';
    S.view = initialRole === 'student' ? 'chat' : initialRole === 'faculty' ? 'tix' : 'x';
    try { localStorage.setItem('ub-user', JSON.stringify(S.user)); } catch(e){}
    R();
    toast('Signed in as ' + (payload.name || payload.email));
  }

  // Establish backend session & sync in background
  window.__authPromise = (async () => {
    let res;
    try{
      res=await apiCall('/auth/google',{method:'POST',body:JSON.stringify({id_token}),idempotent:true,maxAttempts:10});
    }catch(err){
      res={ok:false,status:0,error:err.message};
    }

    if(res.ok&&res.data?.access_token){
      localStorage.setItem('ub-token',res.data.access_token);
      window.__authPromise = null;
      const me=res.data.user;
      if(me){
        S.user={id:me.id,email:me.email,name:me.full_name||me.email.split('@')[0],full_name:me.full_name,role:me.role,campus_id:me.campus_id,department_id:me.department_id};
        S.role=me.role;
        S.scr='app';
        S.view=me.role=='student'?'chat':me.role=='faculty'?'tix':'x';
        try { localStorage.setItem('ub-user', JSON.stringify(S.user)); } catch(e){}
        R();
        await loadViewData(S.view);
        return true;
      }
      try{
        const meRes=await apiCall('/auth/me');
        if(meRes.ok&&meRes.data){
          const me=meRes.data;
          S.user={id:me.id,email:me.email,name:me.full_name||me.email.split('@')[0],full_name:me.full_name,role:me.role,campus_id:me.campus_id,department_id:me.department_id};
          S.role=me.role;
          S.scr='app';
          S.view=me.role=='student'?'chat':me.role=='faculty'?'tix':'x';
          try { localStorage.setItem('ub-user', JSON.stringify(S.user)); } catch(e){}
          R();
        }
      }catch(e){}
      await loadViewData(S.view);
      return true;
    }

    if(res.status===403&&res.error?.code==='no_profile'){
      S.modal={type:'access-request',id_token,msg:'Your Google identity is verified, but no student or staff profile exists for this email yet.'};
      R();
      return false;
    }

    const messages={0:'Cannot reach UniBuddy right now. Check backend connection.',401:'Google could not verify this sign-in. Try again.',409:'This Google account is linked differently. Contact campus administrator.',503:'UniBuddy sign-in service is currently not configured.'};
    const msg=(typeof res.error==='object'?(res.error.message||res.error.code):res.error)||messages[res.status]||'Sign-in failed. Please try again.';
    if(er)er.textContent=msg;
    toast(msg);
    return false;
  })();
  return await window.__authPromise;

  try {
    await window.__authPromise;
  } catch(e){}
}

    imgs[i].onerror = function(){ this.src = LOGO; };
  }
}

/* ---------- UniBuddy Claude Artifact Landing & Login Lifecycle ---------- */
let landingHeroToken = { active: false };
let landingAnimationIds = [];
let landingIntervalIds = [];
let landingObservers = [];
let landingSpeechActive = false;

function stopLandingAnimation(){
  landingHeroToken.active = false;
  landingAnimationIds.forEach(id => { try { cancelAnimationFrame(id); } catch(e){} });
  landingAnimationIds = [];
  landingIntervalIds.forEach(id => { try { clearInterval(id); } catch(e){} });
  landingIntervalIds = [];
  landingObservers.forEach(o => { try { o.disconnect(); } catch(e){} });
  landingObservers = [];
  try {
    if('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  } catch(e){}
  landingSpeechActive = false;
}

// Inferred university role lookup
const PUBLIC_DOMAINS = ['gmail.com','yahoo.com','outlook.com','hotmail.com','icloud.com','proton.me'];
function lookup(email){
  const [local, domain] = (email || '').toLowerCase().split('@');
  if(!domain) return 'student';
  if(PUBLIC_DOMAINS.includes(domain)) return null;
  if(/admin|mgmt|registrar|vc|director/.test(local)) return 'management';
  if(/dean|hod|office|warden|authority/.test(local)) return 'authority';
  if(/prof|faculty|dr\.|teacher|lecturer/.test(local)) return 'faculty';
  return 'student';
}

function doLogin(){
  const emInput = document.getElementById('email') || document.getElementById('em');
  const pwInput = document.getElementById('pw') || document.getElementById('pass');
  const btn = document.getElementById('submit');
  const msgEl = document.getElementById('msg');
  const e = (emInput?.value || '').trim().toLowerCase();
  const p = pwInput?.value || '';

  const showMsg = (text, type = 'err') => {
    if(msgEl){
      msgEl.textContent = text;
      msgEl.className = 'msg show ' + type;
    }
  };

  const fEmail = emInput?.closest('.field');
  const fPass = pwInput?.closest('.field');
  if(fEmail) fEmail.classList.remove('bad');
  if(fPass) fPass.classList.remove('bad');
  if(msgEl){ msgEl.className = 'msg'; msgEl.textContent = ''; }

  const okE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  const okP = !!p;

  if(!okE){
    if(fEmail){ fEmail.classList.remove('bad'); void fEmail.offsetWidth; fEmail.classList.add('bad'); }
    showMsg('Enter your university email address.', 'err');
    emInput?.focus();
    return;
  }

  if(!okP){
    if(fPass){ fPass.classList.remove('bad'); void fPass.offsetWidth; fPass.classList.add('bad'); }
    showMsg('Enter your password.', 'err');
    pwInput?.focus();
    return;
  }

  if(btn){
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>Checking your campus…';
  }

  setTimeout(() => {
    let a = ACC[e];
    let role = a?.role;

    if(!role){
      role = lookup(e);
      if(!role){
        if(btn){ btn.disabled = false; btn.innerHTML = 'Log in <svg class="ico"><use href="#i-arrow"/></svg>'; }
        const nSub = document.getElementById('nSub');
        if(nSub) nSub.textContent = `We couldn't find a campus for ${e}. Ask your university to join, or log in with your university email.`;
        showLoginState('notyet');
        return;
      }
      const nameParts = e.split('@')[0].split(/[._-]/);
      const capName = nameParts.map(s => s.charAt(0).toUpperCase() + s.slice(1)).join(' ');
      a = {
        role: role,
        name: capName || 'University User',
        department: role === 'faculty' ? 'Computer Science' : role === 'authority' ? 'Administration' : role === 'management' ? 'Institutional Operations' : 'Student Body',
        id: 'usr-' + Math.random().toString(36).slice(2, 8)
      };
    }

    if(ACC[e] && !VALID_PWS.includes(p) && p !== DPW){
      if(btn){ btn.disabled = false; btn.innerHTML = 'Log in <svg class="ico"><use href="#i-arrow"/></svg>'; }
      showMsg('Incorrect password. Universal demo password is ' + DPW + '.', 'err');
      if(fPass) fPass.classList.add('bad');
      return;
    }

    const PORTALS = [
      {id:'student',name:'Student portal',desc:'Ask, deadlines, materials, queries',icon:'cap'},
      {id:'faculty',name:'Faculty portal',desc:'Uploads, announcements, replies',icon:'brief'},
      {id:'authority',name:'Authority portal',desc:'Tickets, notices, departments',icon:'shield'},
      {id:'management',name:'Management portal',desc:'Roles, access, analytics',icon:'build'}
    ];
    const pObj = PORTALS.find(x => x.id === role) || {name: role + ' portal', icon:'cap'};

    const plist = document.getElementById('plist');
    if(plist){
      plist.classList.add('pick');
      document.querySelectorAll('.prow').forEach(r => r.classList.remove('on'));
      const activeRow = document.querySelector(`.prow[data-id="${role}"]`);
      if(activeRow) activeRow.classList.add('on');
    }

    const rIcon = document.getElementById('rIcon');
    const rTitle = document.getElementById('rTitle');
    const rSub = document.getElementById('rSub');
    const rBar = document.getElementById('rBar');

    if(rIcon) rIcon.innerHTML = `<svg class="ico"><use href="#i-${pObj.icon}"/></svg>`;
    if(rTitle) rTitle.textContent = 'Opening your ' + pObj.name.toLowerCase();
    if(rSub) rSub.textContent = `Authenticated as ${e}. Opening your dashboard…`;
    showLoginState('routing');

    if(rBar){
      rBar.style.width = '0';
      requestAnimationFrame(() => requestAnimationFrame(() => { rBar.style.width = '100%'; }));
    }

    try {
      const rem = document.getElementById('rem');
      if(rem?.checked) localStorage.setItem('ub-email', e);
      else localStorage.removeItem('ub-email');
      localStorage.setItem('ub-current-user', e);
      localStorage.setItem('ub-user', JSON.stringify({ ...a, email: e }));
    } catch(x){}

    S.user = { ...a, email: e };
    S.role = a.role;
    S.view = a.role === 'student' ? 'chat' : a.role === 'faculty' ? 'tix' : a.role === 'management' ? 'kb' : 'x';

    setTimeout(() => {
      stopLandingAnimation();
      go(PR[e] ? 'app' : 'app');
      toast('Signed in as ' + (a.name || e));
    }, 1000);
  }, 400);
}

// Answers are plain text from the model. Escape first, then turn **bold**, '-' bullets, numbered lists and
// paragraphs into tags. Nothing from the answer is ever treated as HTML.
function fmtAnswer(t){
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  let html='',list=null,para=[];
  const flushPara=()=>{if(para.length){html+=`<p>${para.join(' ')}</p>`;para=[]}};
  const closeList=()=>{if(list){html+=`</${list}>`;list=null}};
  for(const raw of esc(String(t||'')).replace(/\r/g,'').split('\n')){
    const line=raw.trim();
    if(!line){flushPara();closeList();continue}
    const bullet=line.match(/^[-*\u2022]\s+(.*)$/),numbered=line.match(/^\d+[.)]\s+(.*)$/);
    if(bullet||numbered){
      flushPara();const kind=bullet?'ul':'ol';
      if(list!==kind){closeList();html+=`<${kind}>`;list=kind}
      html+=`<li>${inline((bullet||numbered)[1])}</li>`;continue;
    }
    closeList();para.push(inline(line));
  }
  flushPara();closeList();
  return html||'<p></p>';
}

// Ask AI Assistant — calls the real backend RAG endpoint.
async function ask(q){
  if(!q||!q.trim())return;
  const cleanQ=q.trim();
  S.chat.push({r:'u',t:cleanQ,time:now(),n:1});
  S.chat.push({r:'a',k:'ty',n:1});
  S.view='chat';
  R();
  
  if(window.__authPromise){
    try{ await window.__authPromise; }catch(e){}
  }
  const token=localStorage.getItem('ub-token');
  if(!token && UB_API_BASE){
    S.chat.pop();
    S.chat.push({r:'a',k:'err',t:'Your sign-in did not finish, so this question was not sent. Please sign in again.',time:now(),n:1});
    R();
    return;
  }

  // Ask the real backend RAG service; never fabricate a local answer. The wait is bounded: a stalled request
  // shows a visible, retryable error instead of typing dots that never end.
  const ASK_WAIT_MS=45000;
  const backendRes=await Promise.race([
    apiCall('/chat/ask',{
      method:'POST',
      body:JSON.stringify({question:cleanQ,conversation_id:S.conversationId||null})
    }),
    new Promise(resolve=>setTimeout(()=>resolve({ok:false,status:0,data:null,error:'UniBuddy took too long to answer. Please try again.'}),ASK_WAIT_MS))
  ]);

  S.chat.pop(); // Remove typing indicator
  
  if(backendRes.ok&&backendRes.data){
    const d=backendRes.data;
    const userMessage=S.chat.at(-1);if(userMessage)userMessage.mid=d.user_message_id;
    if(d.conversation_id)S.conversationId=d.conversation_id;
    if(!d.abstained){
      S.chat.push({r:'a',k:'ok',t:d.answer,citations:d.citations||[],time:now(),n:1,mid:d.assistant_message_id});
    }else{
      S.chat.push({r:'a',k:'nf',t:d.answer,time:now(),n:1,mid:d.assistant_message_id});
    }
  }else{
    const errText = (backendRes.error && typeof backendRes.error === 'string')
      ? backendRes.error
      : 'The UniBuddy assistant is unavailable right now. Please try again later.';
    S.chat.push({r:'a',k:'err',t:errText,time:now(),n:1});
  }
  R();
  loadConversations().then(R);
}

const ttl=()=>{const u=S.chat.find(x=>x.r=='u');return u?u.t.slice(0,30):'Query'};
// Chat history is stored on the server for each signed-in Student. The database rules return only that person's conversations.
const fmtTime=iso=>{try{return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
// Chat history on screen covers the last 72 hours. Older messages stay stored on the server; only the display changes.
const CHAT_VISIBLE_MS=72*60*60*1000;
const withinChatWindow=iso=>{const t=Date.parse(iso);return Number.isFinite(t)&&Date.now()-t<=CHAT_VISIBLE_MS};
const messageView=m=>m.role==='user'
  ?{r:'u',t:m.content,time:fmtTime(m.created_at),n:0,mid:m.id}
  :{r:'a',k:(m.citations||[]).length?'ok':'nf',t:m.content,citations:m.citations||[],time:fmtTime(m.created_at),n:0,mid:m.id};
async function loadConversations(){
  if(window.__authPromise){
    try{ await window.__authPromise; }catch(e){}
  }
  if(!localStorage.getItem('ub-token')) return;
  const r=await apiCall('/chat/conversations?limit=30');
  if(r.ok)S.hist=pageItems(r).map(c=>({id:c.id,title:c.title||'Conversation'}));
}
const __chatCache = window.__chatCache = window.__chatCache || new Map();
async function openConversation(id,render=true){
  if(__chatCache.has(id)){
    S.chat=__chatCache.get(id);
    S.conversationId=id;
    if(render){S.view='chat';S.nav=false;R()}
  }
  const r=await apiCall(`/chat/conversations/${id}/messages?limit=100`);
  if(!r.ok){
    if(!__chatCache.has(id))toast('Could not open this conversation. Please try again.');
    return false;
  }
  const msgs=pageItems(r).filter(m=>withinChatWindow(m.created_at)).map(messageView);
  __chatCache.set(id,msgs);
  S.chat=msgs;
  S.conversationId=id;
  if(render){S.view='chat';S.nav=false;S.fx='view';R()}
  return true;
}

function detail(t,fac){
  const assignedToMe=t.assigned_faculty_id===S.user?.id;

// Date choices use the browser's local calendar; the server receives instants.
function dateRange(f){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
  let from=null,before=null;
  if(f.date==='today'){from=new Date(y,m,d);before=new Date(y,m,d+1)}
  else if(f.date==='previous_month'){from=new Date(y,m-1,1);before=new Date(y,m,1)}
  else if(f.date==='previous_year'){from=new Date(y-1,0,1);before=new Date(y,0,1)}
  else if(f.date==='custom'){
    if(f.from){const x=new Date(f.from+'T00:00:00');from=x}
    if(f.to){const t=new Date(f.to+'T00:00:00');before=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1)}
  }
  return {from:from?from.toISOString():'',before:before?before.toISOString():''};
}
function listQuery(kind){
  const f=F(kind),p=new URLSearchParams({limit:'100'});
  if(f.academic_year)p.set('academic_year',f.academic_year);
  if(f.batch)p.set('batch_year',f.batch);
  if(f.section)p.set('section',f.section);
  if(f.course)p.set('course_id',f.course);
  if(f.audience)p.set(kind==='ann'?'audience':'visibility',f.audience);
  if(f.scope)p.set('scope',f.scope);
  const r=dateRange(f);if(r.from)p.set('created_from',r.from);if(r.before)p.set('created_before',r.before);
  return p.toString();
}

async function submitPublish(button){

  const section=val('pf-section');
  if(!batch){toast('Please select a Batch Year.');return}
  if(!activeOptions('batch').includes(batch)){toast('Please select a valid Batch Year.');return}
  if(!course){toast('Please select a Course.');return}
  if(!activeCourses().some(c=>c.id===course)){toast('Please select a valid Course.');return}
  const validSections=getSectionsForCourse(course);
  if(!validSections.length){toast('No sections are set up yet. Ask Authority to add them.');return}
  if(!section){toast('Please select a Section.');return}
  if(!validSections.includes(section)){toast('Selected section is not valid for '+course+'. Please select a valid section.');return}

  if(button.dataset.v==='pdf'){

    if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){toast('Choose a PDF file.');return}

    body.append('file',file);
    body.append('visibility',$('#pd-vis')?.value||'public_students');
    body.append('scope',$('#pd-scope')?.value||'university_wide');

    body.append('section',section);
    if(val('pd-source'))body.append('source_person',val('pd-source'));

    const res=await apiCall('/documents',{method:'POST',body});
    S.actionBusy=false;
    if(!res.ok){button.disabled=false;button.textContent='Upload PDF';toast(typeof res.error==='string'?res.error:'Upload failed. Check your access and try again.');return}
    const createdDoc=res.data?docView(res.data):{uuid:'doc-'+Date.now(),title,batch_year:Number(batch),course,course_id:course,section,visibility:$('#pd-vis')?.value||'public_students',scope:$('#pd-scope')?.value||'university_wide',status:'completed',publication:'published',date:today()};

function getStudentProfile() {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('ub_prof') || '{}'); } catch(e){}
  const u = S.user || {};
  return {
    batch_year: String(p.batch || u.batch_year || u.batch || (u.email === 'student@unibuddy.demo' ? '2025' : '')).trim(),
    course: String(p.course || u.course || (u.email === 'student@unibuddy.demo' ? 'CS and AI' : '')).trim(),
    section: String(p.section || u.section || (u.email === 'student@unibuddy.demo' ? 'Section A' : '')).trim()
  };
}

function isItemVisibleToStudent(item) {
  if (S.role !== 'student') return true;
  if (!item) return false;
  const itemBatch = item.batch_year || item.batch;
  const itemCourse = item.course || item.course_id;
  const itemSection = item.section;
  
  if (!itemBatch && !itemCourse && !itemSection) return true;
  
  const stu = getStudentProfile();
  
  if (itemBatch) {
    if (!stu.batch_year) return false;
    if (String(itemBatch).trim().toLowerCase() !== stu.batch_year.toLowerCase()) return false;
  }
  if (itemCourse) {
    if (!stu.course) return false;
    if (String(itemCourse).trim().toLowerCase() !== stu.course.toLowerCase()) return false;
  }
  if (itemSection) {
    if (!stu.section) return false;
    if (String(itemSection).trim().toLowerCase() !== stu.section.toLowerCase()) return false;
  }
  return true;
}

  const tabsHtml = `<button data-a="sp-doc-cat" data-v="all" class="${cat === 'all' ? 'on' : ''}">All Documents <i>${docs.length}</i></button>` +
    SP_CATS.map(c => `<button data-a="sp-doc-cat" data-v="${c[2]}" class="k-${c[2]} ${cat === c[2] ? 'on' : ''}"><span class="kd"></span>${c[3]} <i>${cnt(c[2])}</i></button>`).join('');

  const filtered = docs.filter(d => {
    const c = spCatOf(d);
    const matchesCat = (cat === 'all' || (c && c[2] === cat));
