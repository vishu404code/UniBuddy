<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UniBuddy · AI Campus Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF;
      --ice: #EAF1FC;
      --lav: #F0EDFF;
      --bg2: #F4F6FA;
      --ind: #7187C9;
      --indd: #5a70b4;
      --navy: #263653;
      --deep: #263653;
      --ink: #263653;
      --slate: #687386;
      --bd: #E3E8F0;
      --sh: 0 1px 2px rgba(38,54,83,.05), 0 8px 22px -10px rgba(38,54,83,.14);
      --sh2: 0 2px 4px rgba(38,54,83,.05), 0 18px 38px -14px rgba(38,54,83,.24);
      --grad: linear-gradient(180deg, #6b81c3, #4f66a8);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 14.5px/1.55 Inter, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.02em; }
    h2 { font-size: 22px; }
    h3 { font-size: 15.5px; }
    .ed { font-family: Fraunces, Georgia, serif; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; }
    h1.ed { font-size: clamp(34px, 5vw, 54px); }
    h2.ed { font-size: clamp(26px, 3.4vw, 34px); }
    button, input, select, textarea { font: inherit; color: inherit; }
    .btn {
      height: 40px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid var(--bd);
      background: var(--bg);
      box-shadow: 0 1px 2px rgba(38,54,83,.06);
      cursor: pointer;
      font-weight: 500;
      transition: transform .2s, box-shadow .2s, border-color .2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--sh); border-color: var(--ind); }
    .btn:active { transform: scale(.97); }
    .btn.p {
      background: var(--grad);
      color: #fff;
      border-color: #4a60a0;
      box-shadow: 0 8px 16px -8px rgba(79,102,168,.8), inset 0 1px 0 rgba(255,255,255,.28);
    }
    .btn.sm { height: 32px; padding: 0 13px; font-size: 13px; border-radius: 10px; }
    .btn.w { width: 100%; }
    .ib {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 0;
      background: none;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: var(--slate);
      transition: background .2s, color .2s, transform .2s;
      position: relative;
    }
    .ib:hover { background: var(--lav); color: var(--navy); }
    .ib:active { transform: scale(.93); }
    :focus-visible { outline: 2px solid var(--ind); outline-offset: 2px; }
    svg.i {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none;
    }
    input, select, textarea {
      width: 100%;
      height: 42px;
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 0 14px;
      transition: border-color .2s, box-shadow .2s;
    }
    textarea { height: auto; padding: 11px 14px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--ind);
      box-shadow: 0 0 0 4px rgba(113,135,201,.18);
    }
    label { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 6px; }
    .mut { color: var(--slate); }
    .row { display: flex; align-items: center; gap: 10px; }
    .sp { justify-content: space-between; }
    .mark {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: linear-gradient(135deg, #8ea2db, #5f76bb);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 14px;
      flex: none;
      box-shadow: 0 5px 10px -4px rgba(113,135,201,.8), inset 0 1px 0 rgba(255,255,255,.4);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
      letter-spacing: -.02em;
    }
    .ico {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(180deg, #fff, var(--ice));
      border: 1px solid var(--bd);
      display: grid;
      place-items: center;
      color: var(--indd);
      box-shadow: 0 5px 10px -5px rgba(38,54,83,.25), inset 0 1px 0 #fff;
      flex: none;
    }
    .card {
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 16px;
      box-shadow: var(--sh);
      padding: 20px;
    }
    .tint { background: linear-gradient(180deg, var(--ice), #fff); }
    .lift { transition: transform .22s, box-shadow .22s, border-color .22s; cursor: pointer; }
    .lift:hover { transform: translateY(-3px); box-shadow: var(--sh2); border-color: #cdd8ee; }
    .fx { animation: fx .25s ease both; }
    @keyframes fx { from { opacity: 0; transform: translateY(6px); } }
    .in { animation: fx .25s ease both; }
    .lnk {
      background: none;
      border: 0;
      cursor: pointer;
      color: var(--slate);
      padding: 6px 10px;
      font-weight: 500;
      transition: color .2s;
    }
    .lnk:hover { color: var(--navy); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 99px;
      background: var(--lav);
      border: 1px solid #e1dbfa;
      color: var(--indd);
      font-size: 12.5px;
      font-weight: 500;
      padding: 4px 12px;
    }

    /* landing */
    .land { position: relative; overflow: hidden; min-height: 100vh; }
    .land:before, .land:after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .land:before {
      width: 560px;
      height: 560px;
      right: -160px;
      top: -180px;
      background: radial-gradient(circle, var(--lav), transparent 68%);
    }
    .land:after {
      width: 520px;
      height: 520px;
      left: -200px;
      top: 260px;
      background: radial-gradient(circle, var(--ice), transparent 68%);
    }
    .land > * { position: relative; z-index: 1; }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px max(20px, 5vw);
      gap: 10px;
    }
    .wrap { max-width: 1060px; margin: auto; padding: 0 max(20px, 4vw); }
    .hero {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 40px;
      align-items: center;
      padding: 56px 0 72px;
    }
    .hero p { color: var(--slate); font-size: 17px; max-width: 470px; margin: 18px 0 28px; }
    .stage { position: relative; padding: 28px 0 28px 18px; }
    .prev {
      transform: perspective(1100px) rotateY(-6deg) rotateX(2deg);
      box-shadow: var(--sh2), 0 40px 60px -34px rgba(38,54,83,.3);
      padding: 18px;
      max-width: 430px;
      margin-left: auto;
    }
    .chipf {
      position: absolute;
      background: #fff;
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: var(--sh2);
      display: flex;
      gap: 6px;
      align-items: center;
      color: var(--navy);
    }
    .c1 { left: -6px; bottom: 6px; }
    .c2 { right: 6px; top: 0; background: var(--lav); }
    .bento {
      display: grid;
      grid-template-columns: 1.1fr 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 14px;
      padding-bottom: 72px;
    }
    .bt {
      border-radius: 20px;
      padding: 24px;
      border: 1px solid var(--bd);
      transition: transform .22s, box-shadow .22s;
      cursor: default;
    }
    .bt:hover { transform: translateY(-3px); box-shadow: var(--sh2); }
    .bt p { margin: 6px 0 0; color: var(--slate); font-size: 14px; }
    .bt .ico { margin-bottom: 16px; }
    .bt.tall {
      grid-row: span 2;
      background: linear-gradient(160deg, var(--lav), #fff 75%);
    }
    .bt.tall h3 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: 26px;
      line-height: 1.15;
      margin-top: 6px;
    }
    .bt.tall p { font-size: 15px; }
    .bt.b { background: var(--ice); grid-column: span 2; }
    .bt.m { background: var(--bg2); }
    .bt.w { background: #fff; }
    .how { padding: 0 0 72px; }
    .hsteps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 26px;
      position: relative;
    }
    .hsteps:before {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      top: 18px;
      height: 2px;
      background: linear-gradient(90deg, var(--ind), #d5dcf1);
    }
    .hs { position: relative; padding-right: 24px; }
    .num {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--ind);
      color: var(--indd);
      display: grid;
      place-items: center;
      font-weight: 600;
      margin-bottom: 14px;
      position: relative;
    }
    .hs p { margin: 0; max-width: 240px; }
    footer {
      padding: 24px;
      text-align: center;
      color: var(--slate);
      font-size: 13px;
      border-top: 1px solid var(--bd);
    }

    /* REDESIGNED LOGIN PAGE (matching user visual reference) */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: radial-gradient(850px 480px at 50% -10%, var(--lav), transparent 75%), #FFFFFF;
    }
    .login-container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
    }
    .login-header {
      text-align: center;
      max-width: 480px;
    }
    .login-header .mark {
      margin: 0 auto 16px;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      font-size: 18px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid var(--bd);
      border-radius: 20px;
      padding: 28px 30px;
      box-shadow: var(--sh2);
    }
    .auth-error {
      display: none;
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      background: #fdf2f2;
      border: 1px solid #f8d7da;
      color: #b02a37;
      animation: fx .2s ease;
    }
    .auth-error.visible { display: block; }
    
    /* Demo accounts shelf matching the visual screenshot */
    .demo-shelf {
      width: 100%;
      margin-top: 8px;
    }
    .demo-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 18px 0;
      color: var(--slate);
      font-size: 12.5px;
      font-weight: 500;
    }
    .demo-divider::before, .demo-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--bd);
    }
    .demo-divider span {
      padding: 0 12px;
    }
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .demo-card {
      border-radius: 16px;
      padding: 16px 14px;
      border: 1px solid var(--bd);
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, border-color .2s;
      position: relative;
    }
    .demo-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--sh2);
      border-color: var(--ind);
    }
    .demo-card.selected {
      border-color: var(--ind);
      box-shadow: 0 0 0 3px rgba(113,135,201,.25), var(--sh);
      background: #fbfbfe;
    }
    .demo-card.t0 { background: var(--ice); }
    .demo-card.t1 { background: var(--lav); }
    .demo-card.t2 { background: var(--bg2); }
    .demo-card.t3 { background: #FFFFFF; }
    .demo-card .ico {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      margin-bottom: 2px;
    }
    .demo-card h4 {
      margin: 0;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--navy);
    }
    .demo-card p {
      margin: 0;
      font-size: 12px;
      color: var(--slate);
      line-height: 1.35;
      flex: 1;
    }
    .demo-card .email-tag {
      font-size: 11px;
      font-family: monospace;
      color: var(--indd);
      background: rgba(255,255,255,.8);
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 2px 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .demo-card button {
      margin-top: 6px;
      height: 30px;
      font-size: 12px;
      border-radius: 8px;
    }

    /* app shell */
    .app { display: flex; height: 100vh; height: 100dvh; }
    .side {
      width: 262px;
      background: #fff;
      border-right: 1px solid var(--bd);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      flex: none;
      transition: transform .22s;
    }
    .side .logo { padding: 2px 8px 18px; }
    .si {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 0;
      background: none;
      border-radius: 12px;
      cursor: pointer;
      color: var(--slate);
      text-align: left;
      transition: background .2s, color .2s, transform .2s;
      position: relative;
    }
    .si:hover { background: var(--bg2); color: var(--navy); }
    .si:active { transform: scale(.98); }
    .si.on {
      background: var(--lav);
      color: var(--indd);
      font-weight: 600;
    }
    .si.on:before {
      content: "";
      position: absolute;
      left: -12px;
      top: 10px;
      bottom: 10px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--ind);
    }
    .si.nc {
      background: var(--grad);
      color: #fff;
      font-weight: 500;
      margin-bottom: 14px;
      box-shadow: 0 8px 16px -8px rgba(79,102,168,.9), inset 0 1px 0 rgba(255,255,255,.3);
      justify-content: center;
    }
    .si.nc:hover { filter: brightness(1.06); color: #fff; }
    .sh {
      font-size: 12px;
      color: var(--slate);
      padding: 16px 12px 6px;
      font-weight: 500;
    }
    .hist { overflow: auto; flex: 1; min-height: 60px; }
    .hist .si { height: 34px; font-size: 13.5px; }
    .hist .si span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prof {
      border-top: 1px solid var(--bd);
      padding-top: 12px;
      margin-top: 10px;
    }
    .prof .av {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8ea2db, #5f76bb);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 600;
      flex: none;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: radial-gradient(800px 280px at 75% -80px, var(--lav), transparent 70%), #fff;
    }
    .hd {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      flex: none;
      position: relative;
      border-bottom: 1px solid var(--bd);
      background: rgba(255,255,255,.7);
      backdrop-filter: blur(8px);
    }
    .menu { display: none; }
    .on-ind {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: var(--slate);
    }
    .pu {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #58b394;
      animation: pu 2.4s ease-in-out infinite;
    }
    @keyframes pu {
      0%, 100% { box-shadow: 0 0 0 0 rgba(88,179,148,.45); }
      50% { box-shadow: 0 0 0 5px rgba(88,179,148,0); }
    }
    .page { flex: 1; overflow: auto; padding: 30px max(16px, 3vw); }
    .pg { max-width: 880px; margin: auto; }
    .pg.wide { max-width: 980px; }

    /* chat */
    .chatw { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .msgs { flex: 1; overflow: auto; padding: 24px 16px; }
    .col { max-width: 740px; margin: auto; }
    .empty {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-bottom: 30px;
    }
    .welcome {
      position: relative;
      padding: 34px 30px 30px;
      border-radius: 28px;
      background: radial-gradient(420px 220px at 50% 0%, var(--lav), transparent 75%),
                  radial-gradient(360px 200px at 85% 100%, var(--ice), transparent 75%);
      width: 100%;
    }
    .welcome .mark {
      width: 54px;
      height: 54px;
      border-radius: 17px;
      font-size: 23px;
      margin: 0 auto 16px;
    }
    .welcome p { color: var(--slate); margin: 8px 0 22px; font-size: 15.5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .chip {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      background: #fff;
      border: 1px solid var(--bd);
      border-radius: 99px;
      padding: 9px 16px 9px 12px;
      font-weight: 500;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: var(--sh);
      transition: transform .2s, box-shadow .2s, border-color .2s, background .2s;
    }
    .chip svg { color: var(--indd); }
    .chip:hover {
      transform: translateY(-2px);
      box-shadow: var(--sh2);
      border-color: var(--ind);
      background: var(--lav);
    }
    .chip:active { transform: scale(.97); }
    .u { display: flex; justify-content: flex-end; margin: 20px 0 4px; }
    .ub {
      background: var(--lav);
      border: 1px solid #e1dbfa;
      color: var(--navy);
      padding: 10px 15px;
      border-radius: 16px 16px 4px 16px;
      max-width: 80%;
      word-break: break-word;
    }
    .ts { font-size: 11.5px; color: var(--slate); margin-top: 4px; opacity: .85; }
    .tsr { text-align: right; }
    .a { display: flex; gap: 12px; margin: 18px 0; }
    .a .body { flex: 1; min-width: 0; }
    .a .who { font-weight: 600; font-size: 13.5px; margin-bottom: 2px; }
    .vb {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--ice);
      color: var(--indd);
      border: 1px solid #d3e0f6;
      border-radius: 99px;
      padding: 2px 10px 2px 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .src {
      margin-top: 10px;
      display: flex;
      gap: 6px 12px;
      flex-wrap: wrap;
      align-items: center;
      background: var(--bg2);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--slate);
      border-left: 3px solid var(--ind);
    }
    .src button {
      color: var(--indd);
      font-weight: 600;
      background: none;
      border: 0;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }
    .nf {
      margin-top: 12px;
      background: var(--lav);
      border: 1px solid #e1dbfa;
      border-radius: 14px;
      padding: 14px;
    }
    .ld { display: inline-flex; gap: 5px; padding: 10px 0; }
    .ld span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ind);
      animation: bl 1.2s infinite;
    }
    .ld span:nth-child(2) { animation-delay: .18s; }
    .ld span:nth-child(3) { animation-delay: .36s; }
    @keyframes bl {
      0%, 100% { opacity: .3; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }
    .comp { padding: 0 16px 14px; }
    .cbox {
      max-width: 740px;
      margin: auto;
      border: 1px solid var(--bd);
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 8px 8px 6px;
      background: #fff;
      box-shadow: var(--sh2);
      transition: border-color .2s, box-shadow .2s;
    }
    .cbox:focus-within {
      border-color: var(--ind);
      box-shadow: 0 0 0 4px rgba(113,135,201,.16), var(--sh2);
    }
    .cbox input {
      border: 0;
      height: 42px;
      flex: 1;
      box-shadow: none !important;
      background: none;
    }
    .send {
      width: 40px;
      height: 40px;

      try {

    }

      try {
        localStorage.removeItem(SESSION_STORAGE_KEY);
      } catch (e) {}
    }

    function restoreSession() {
      try {
        const raw = localStorage.getItem(SESSION_STORAGE_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (data && data.email && DEMO_ACCOUNTS[data.email]) {
          const acc = DEMO_ACCOUNTS[data.email];
          authenticateUser(acc, false);
          return true;
        }
      } catch (e) {}
      return false;
    }

      S.bell = false;

      S.fx = 'screen';

    function ask(q) {
      if (!q || !q.trim()) return;
      const cleanQ = q.trim();
      S.chat.push({ r: 'u', t: cleanQ.replace(/</g, '&lt;'), time: now(), n: 1 });
      S.chat.push({ r: 'a', k: 'ty', n: 1 });
      S.view = 'chat';
      R();

      const l = cleanQ.toLowerCase();
      const h = KB.find(e => e.k.some(k => l.includes(k)));

      setTimeout(() => {
        S.chat.pop();
        if (h) {
          S.chat.push({ r: 'a', k: 'ok', t: h.a, s: h.s, p: h.p, time: now(), n: 1 });
        } else {
          S.chat.push({ r: 'a', k: 'nf', time: now(), n: 1, origQ: cleanQ });
        }
        R();
      }, 700);
    }

    /* 8. RENDER ENGINE */
    function R() {
      const a = $('#app');
      const activeEl = document.activeElement;
      const activeId = activeEl?.id;
      const activeVal = activeEl ? activeEl.value : '';

      let h = '';
      if (S.scr == 'landing') {
        h = landing();
      } else if (S.scr == 'login') {
        h = login();
      } else {
        // Protected App portals based on authenticated role
        if (!S.user) {
          S.scr = 'login';
          h = login();
        } else if (S.role == 'student') {
          h = studentPortal();
        } else if (S.role == 'faculty') {
          h = facultyPortal();
        } else if (S.role == 'authority') {
          h = authorityPortal();
        } else if (S.role == 'management') {
          h = managementPortal();
        } else {
          S.scr = 'login';
          h = login();
        }
      }

      a.innerHTML = h + (S.modal ? modal() : '') + (S.toast ? `<div class="toast">${S.toast}</div>` : '');

      const t = S.fx == 'screen' ? a.firstElementChild : S.fx == 'view' ? $('.main > :last-child') : null;
      if (t) t.classList.add('fx');
      S.fx = 0;
      S.chat.forEach(x => x.n = 0);

      // Preserve active input focus if not chat inputs
      if (activeId && $('#' + activeId) && activeId !== 'ci' && activeId !== 'dq') {
        $('#' + activeId).value = activeVal;
        $('#' + activeId).focus();
      }

      const m = $('#msgs');
      if (m) m.scrollTop = m.scrollHeight;
    }

    const notify = (t, tk) => S.notifs.unshift({ t, u: 1, tk });

    function handleChatSend() {
      const ci = $('#ci');
      if (!ci) return;
      const v = ci.value;
      if (!v || !v.trim()) return;
      ci.value = '';
      ask(v);
    }

    function handleDashSend() {
      const dq = $('#dq');
      if (!dq) return;
      const v = dq.value;
      if (!v || !v.trim()) return;
      dq.value = '';
      ask(v);
    }

    /* Process Authentication */
    function processLogin() {
      const emailEl = $('#loginEmail');
      const passEl = $('#loginPassword');
      const email = emailEl ? emailEl.value.trim().toLowerCase() : '';
      const password = passEl ? passEl.value : '';

      S.loginDraft.email = email;
      S.loginDraft.password = password;

      if (!email || !password) {
        S.loginDraft.error = 'Please enter both your university email and password.';
        R();
        return;
      }

      // Check account in predefined registry
      const account = DEMO_ACCOUNTS[email];
      if (!account) {
        S.loginDraft.error = 'Unknown account. Please check your email or click a demo account below.';
        R();
        return;
      }

      if (password !== account.password) {
        S.loginDraft.error = `Invalid password. (Use demo password: ${DEMO_PASSWORD})`;
        R();
        return;
      }

      // Valid credentials
      S.loginDraft.error = '';
      S.loginDraft.loading = true;
      R();

      setTimeout(() => {
        S.loginDraft.loading = false;
        authenticateUser(account, true);
        toast(`Signed in as ${account.name} (${account.roleTitle})`);
      }, 350);
    }

    /* Event Listeners */
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-a]');
      if (!el) {
        if (S.bell && !e.target.closest('.drop')) {
          S.bell = false;
          R();
        }
        return;
      }
      const a = el.dataset.a;
      const v = el.dataset.v;

      if (a == 'home') {
        go(S.user ? 'app' : 'landing');
      }
      else if (a == 'toLogin') {
        go('login');
      }
      else if (a == 'scroll') {
        const target = $('#' + v);
        if (target) target.scrollIntoView({ behavior: 'smooth' });
      }
      else if (a == 'togglePw') {
        const p = $('#loginPassword');
        if (p) p.type = p.type == 'password' ? 'text' : 'password';
      }
      else if (a == 'forgotPw') {
        toast('Password reset instructions sent to university administrator.');
      }
      else if (a == 'selectDemo') {
        const r = DEMO_ACCOUNTS[ROLES[v].email];
        if (r) {
          S.loginDraft.email = r.email;
          S.loginDraft.password = DEMO_PASSWORD;
          S.loginDraft.selectedRole = v;
          S.loginDraft.error = '';
          R();
        }
      }
      else if (a == 'useDemo') {
        const r = DEMO_ACCOUNTS[ROLES[v].email];
        if (r) {
          S.loginDraft.email = r.email;
          S.loginDraft.password = DEMO_PASSWORD;
          S.loginDraft.selectedRole = v;
          S.loginDraft.error = '';
          S.loginDraft.loading = true;
          R();
          setTimeout(() => {
            S.loginDraft.loading = false;
            authenticateUser(r, true);
            toast(`Signed in as ${r.name} (${r.roleTitle})`);
          }, 250);
        }
      }
      else if (a == 'submitLogin') {
        processLogin();
      }
      else if (a == 'logout') {
        logout();
      }
      else if (a == 'view') {
        if (S.view != v) S.fx = 'view';
        S.view = v;
        S.bell = false;
        S.nav = false;
        R();
      }
      else if (a == 'navo') { S.nav = true; R(); }
      else if (a == 'navx') { S.nav = false; R(); }
      else if (a == 'new') newChat();
      else if (a == 'hist') {
        const h = S.hist.splice(+v, 1)[0];
        if (S.chat.length) S.hist.unshift({ title: ttl(), msgs: [...S.chat] });
        S.chat = h.msgs;
        S.view = 'chat';
        S.nav = false;
        S.fx = 'view';
        R();
      }
      else if (a == 'bell') { S.bell = !S.bell; R(); }
      else if (a == 'readall') {
        S.notifs.forEach(n => n.u = 0);
        R();
      }
      else if (a == 'nt') {
        const n = S.notifs[+v];
        if (n) {
          n.u = 0;
          if (n.tk) S.sel = n.tk;
          S.view = S.role == 'student' ? 'queries' : 'tix';
          S.bell = false;
          S.fx = 'view';
          R();
        }
      }
      else if (a == 'open') {
        S.sel = v;
        if (S.role == 'student' && S.view != 'queries') {
          S.view = 'queries';
          S.fx = 'view';
        }
        R();
      }
      else if (a == 'dask') handleDashSend();
      else if (a == 'sq') ask(v);
      else if (a == 'send') handleChatSend();
      else if (a == 'attach') {
        toast('Attachment support: PDF / Document upload is ready for campus backend integration.');
      }
      else if (a == 'vs') {
        const x = S.chat[+v];
        if (x) toast(`Verified Document Source: ${x.s}, ${x.p}`);
      }
      else if (a == 'fwd') {
        const questionText = S.chat[+v - 1]?.t || S.chat[+v]?.origQ || 'Campus inquiry';
        S.modal = { i: +v, q: questionText };
        R();
      }
      else if (a == 'mc') {
        S.modal.out = 1;
        R();
        setTimeout(() => {
          S.modal = null;
          R();
        }, 160);
      }
      else if (a == 'ms') {
        const m = S.modal;
        const q = m.q || S.chat[m.i - 1]?.t || 'Campus Inquiry';
        const id = 'UB-' + (2100 + Math.floor(Math.random() * 900));
        const dept = $('#md')?.value || 'Computer Science';
        const pri = $('#mp')?.value || 'Medium';
        const desc = $('#mx')?.value || '';
        const facultyAssigned = dept == 'Computer Science' ? 'Dr. Mehta' : dept == 'Accounts' ? 'Ms. Rao' : 'Department Faculty';

        S.tickets.unshift({
          id,
          subj: q.slice(0, 40) + (q.length > 40 ? '...' : ''),
          dept,
          fac: facultyAssigned,
          date: today(),
          pri,
          st: 0,
          q,
          desc,
          reply: '',
          tl: [today().slice(0, 6)]
        });

        if (S.chat[m.i]) {
          S.chat[m.i].fw = id;
        }
        S.sel = id;
        notify(`Ticket ${id} was submitted and routed to ${dept}.`, id);
        S.modal = { done: id };
        R();
      }
      else if (a == 'vt') {
        S.modal = null;
        S.sel = v;
        S.view = 'queries';
        S.fx = 'view';
        R();
      }
      else if (a == 'respond' || a == 'resolve') {
        const t = T(S.sel);
        if (!t) return;
        const rp = $('#rp')?.value.trim() || '';
        if (a == 'respond' && !rp) {
          toast('Please write a response first.');
          return;
        }
        if (rp) t.reply = rp;
        const d = today().slice(0, 6);
        if (t.fac == 'Unassigned') t.fac = 'Dr. Mehta';
        while (t.tl.length < 3) t.tl.push(d);

        if (a == 'resolve') {
          t.st = 3;
          t.tl[3] = d;
          notify(`Ticket ${t.id} was marked as Resolved by ${t.fac}.`, t.id);
          toast('Ticket marked as Resolved.');
        } else {
          if (t.st < 2) t.st = 2; // In Progress
          notify(`${t.fac} sent a response to Ticket ${t.id}.`, t.id);
          toast('Response sent successfully.');
        }
        R();
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (e.target.id === 'ci') {
          e.preventDefault();
          handleChatSend();
        } else if (e.target.id === 'dq') {
          e.preventDefault();
          handleDashSend();
        } else if (e.target.id === 'loginEmail' || e.target.id === 'loginPassword') {
          e.preventDefault();
          processLogin();
        }
      }
    });

    document.addEventListener('input', e => {
      if (e.target.id === 'gs') {
        S.fq = e.target.value;
        R();
      } else if (e.target.id === 'loginEmail') {
        S.loginDraft.email = e.target.value;
      } else if (e.target.id === 'loginPassword') {
        S.loginDraft.password = e.target.value;
      }
    });

    document.addEventListener('change', e => {
      if (e.target.id === 'fs') {
        S.fs = e.target.value;
        R();
      }
    });

    // Check for existing valid session on startup
    if (!restoreSession()) {
      R();
    }
  </script>
</body>
</html>
