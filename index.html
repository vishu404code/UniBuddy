  if(m.type==='upload-doc'){
    return `<div class="ov${o}"><div class="modal"><h2 class="ed">Upload University Document</h2><p class="mut" style="font-size:13px;margin:4px 0 14px">Upload PDF, DOCX, or TXT documents to be parsed and indexed for verified AI answers.</p>
<div class="dropzone" id="dz" onclick="$('#doc-file').click()">${IC('upload')}<div style="font-weight:600;margin-top:6px">Click to select file or drag & drop</div><div class="mut" style="font-size:12px">Supports PDF, DOCX, TXT (up to 20MB)</div></div>
<input id="doc-file" type="file" accept=".pdf,.docx,.txt" style="display:none" onchange="$('#dz-name').textContent=this.files[0]?.name||''">
<div id="dz-name" style="font-size:12.5px;color:var(--indd);margin-top:6px;font-weight:500;min-height:18px"></div>
<label>Document Title</label><input id="doc-title" placeholder="e.g. Data Structures Syllabus 2026">
<div class="g2"><div><label>Category</label><select id="doc-cat"><option>Academic Policy</option><option>Examinations</option><option>Hostel & Campus</option><option>Scholarships</option><option>Fee & Accounts</option><option>General</option></select></div>
<div><label>Publication Status</label><select id="doc-status"><option value="published">Publish Immediately</option><option value="draft">Save as Draft</option></select></div></div>
<div class="g2"><div><label>Scope</label><select id="doc-scope"><option value="campus">Campus</option><option value="university_wide">University Wide</option></select></div>
<div><label>Visibility</label><select id="doc-vis"><option value="public_students">Public for Students</option><option value="staff_only">Staff Only</option></select></div></div>
<label>Brief Description</label><input id="doc-desc" placeholder="Summary of what this document covers">
<div class="row sp" style="margin-top:20px"><button class="btn" data-a="mc">Cancel</button><button class="btn p" data-a="submit-doc-upload">Upload & Index</button></div></div></div>`;
  }
  if(m.type==='view-doc'){
    const item=m.item;
    return `<div class="ov${o}"><div class="modal" style="max-width:600px"><div class="row sp" style="margin-bottom:8px"><span class="badge">${item.category||'General'}</span><span class="pill ${item.publication_status==='published'?'s3':'draft'}">${item.publication_status}</span></div>
<h2 class="ed">${item.title}</h2>
<p class="mut" style="font-size:13px;margin:4px 0 14px">${item.description||'Official university knowledge entry.'}</p>
<div style="background:var(--bg2);padding:14px;border-radius:12px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;max-height:300px;overflow:auto">${item.raw_content||'File Document: '+(item.original_filename||item.title)+'. Content parsed into AI vector chunks.'}</div>
<div class="row sp" style="margin-top:18px"><div class="mut" style="font-size:12px">AI Index Status: <b>${item.processing_status}</b></div><button class="btn p" data-a="mc">Close</button></div></div></div>`;
  }
  if(m.type==='delete-confirm'){
    const item=m.item;
    return `<div class="ov${o}"><div class="modal"><div style="text-align:center"><div style="display:grid;justify-items:center;margin-bottom:12px"><div class="ico" style="background:#fdf2f4;color:#b4445a;border-color:#e0b2bb">${I('trash')}</div></div><h2 class="ed">Delete Knowledge Entry?</h2><p class="mut" style="margin:8px 0 18px">Are you sure you want to permanently delete <b>"${item.title}"</b>? This will remove all associated vector chunks from the AI retrieval index.</p><div class="row" style="justify-content:center;gap:10px"><button class="btn" data-a="mc">Cancel</button><button class="btn danger" data-a="confirm-delete" data-v="${item.id}">Delete Permanently</button></div></div></div></div>`;
  }
  if(m.done){
    return `<div class="ov${o}"><div class="modal" style="text-align:center"><div style="display:grid;justify-items:center;margin-bottom:10px">${IC('tick')}</div><h2>Ticket submitted</h2><p class="mut" style="margin:6px 0">Your ticket ID is</p><div style="font-size:24px;font-weight:600;margin:2px 0 8px;color:var(--navy)">${m.done}</div><p class="mut" style="font-size:13px;margin-bottom:18px">Your query has reached the department faculty queue.</p><button class="btn p w" data-a="vt" data-v="${m.done}">View ticket details</button></div></div>`;
  }
  const q=S.chat[m.i-1]?.t||'Question';
  return `<div class="ov${o}"><div class="modal"><h2>Forward to Faculty</h2><label>Original question</label><div class="demo" style="margin:0;color:var(--ink);padding:10px 12px;background:var(--bg2);border-radius:10px">${q}</div><div class="g2"><div><label>Department</label><select id="md">${['Computer Science','Accounts','Examinations','Hostel Affairs','Library'].map(d=>`<option>${d}</option>`).join('')}</select></div><div><label>Priority</label><select id="mp"><option>Low</option><option selected>Medium</option><option>High</option></select></div></div><label>Additional description</label><textarea id="mx" rows="3" placeholder="Add any helpful context for faculty"></textarea><div class="row" style="justify-content:flex-end;margin-top:20px"><button class="btn" data-a="mc">Cancel</button><button class="btn p" data-a="ms">Submit Ticket</button></div></div></div>`;
}

// Render Engine
function R(){
  const a=$('#app');if(!a)return;
  const ae=document.activeElement?.id,v=ae?document.activeElement.value:'';let h;
  if(S.scr=='landing')h=landing();else if(S.scr=='login')h=login();else if(S.scr=='onboard')h=onboard();else h=S.role=='student'?student():S.role=='faculty'?faculty():placeholder();
  a.innerHTML=h+(S.modal?modal():'')+(S.toast?`<div class="toast">${S.toast}</div>`:'');
  const t=S.fx=='screen'?a.firstElementChild:S.fx=='view'?$('.main > :last-child'):null;if(t)t.classList.add('fx');S.fx=0;S.chat.forEach(x=>x.n=0);
  if(ae&&$('#'+ae)&&ae!=='ci'&&ae!=='dq'){$('#'+ae).value=v;$('#'+ae).focus()}
  const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
  if(S.scr=='login'){
    applyLogos();
    initLoginEntrances();
    startLoginThread();
    initGoogleAuth();
  } else {
    stopLoginThread();
  }
  if(S.scr=='landing'){
    initLandingPage();
  } else {
    stopLandingAnimation();
  }
}

function initGoogleAuth(){
  if(S.scr=='login'&&window.google?.accounts?.id){
    try{
      window.google.accounts.id.initialize({
        client_id: (window.UB_CONFIG && window.UB_CONFIG.googleClientId) || '675157891879-ufpn2fmb16n6qkq7qjjeclre6eaem085.apps.googleusercontent.com',
        callback:(resp)=>{if(resp?.credential)handleGoogleCredential(resp.credential)}
      });
      const gbtn=$('#google-signin-btn');
      if(gbtn&&!gbtn.hasChildNodes()){
        window.google.accounts.id.renderButton(gbtn,{theme:'outline',size:'large',width:380,text:'continue_with',shape:'rectangular'});
      }
    }catch(e){}
  }
}

const notify=(t,tk)=>{S.notifs.unshift({t,u:1,tk});saveTickets()};
function sendChat(){const ci=$('#ci');if(!ci)return;const v=ci.value.trim();if(!v)return;ci.value='';ask(v)}
function sendDash(){const dq=$('#dq');if(!dq)return;const v=dq.value.trim();if(!v)return;dq.value='';ask(v)}

// Global Actions Dispatcher
document.addEventListener('click',async e=>{
  const anch = e.target.closest('a[href^="#"]');
  if(anch && S.scr === 'landing'){
    const tid = anch.getAttribute('href').slice(1);
    if(tid){
      const tgt = document.getElementById(tid);
      if(tgt){
        e.preventDefault();
        tgt.scrollIntoView({behavior:'smooth'});
        return;
      }
    }
  }
  const el=e.target.closest('[data-a]');
  if(!el){if(S.bell&&!e.target.closest('.drop')){S.bell=false;R()}return}
  const a=el.dataset.a,v=el.dataset.v;
  
  if(a=='home')go(S.user?'app':'landing');
  else if(a=='login-screen')go('login');
  else if(a=='scroll')$('#'+v)?.scrollIntoView({behavior:'smooth'});
  else if(a=='fill'){$('#em').value=v;$('#pw').value=DPW;$('#err').textContent='';$('#pw').type='password';$('#em').focus()}
  else if(a=='login-demo'){$('#em').value=v;$('#pw').value=DPW;$('#err').textContent='';$('#pw').type='password';doLogin()}
  else if(a=='google-login'){
    if(window.google?.accounts?.id){
      try{window.google.accounts.id.prompt()}catch(x){toast('Google Identity prompt initiated')}
    }else{
      toast('Google Identity Services loaded. Connect Google client credentials to authenticate.');
    }
  }
  else if(a=='forgot'){bannerLogin('ok', 'Prototype demo password: '+DPW);toast('Universal demo password: '+DPW)}
  else if(a=='pw'){togglePassVisibility()}
  else if(a=='login-submit'||a=='login'){doLogin()}
  else if(a=='fill-demo'){
    const em=document.getElementById('email')||document.getElementById('em');
    const pw=document.getElementById('pass')||document.getElementById('pw');
    if(em)em.value=v;
    if(pw)pw.value=DPW;
    document.getElementById('f-email')?.classList.remove('bad');
    document.getElementById('f-pass')?.classList.remove('bad');
    bannerLogin('', '');
    if(em)em.focus();
  }
  else if(a=='submit-access-request'){
    const res=await apiCall('/auth/google/access-request',{method:'POST',body:JSON.stringify({id_token:S.modal.id_token})});
    S.modal=null;R();
    toast(res.ok?'Student access request submitted for campus review!':'Request queued.');
  }
  // Knowledge Base Modals & Actions
  else if(a=='add-content-modal'){S.modal={type:'add-content'};R()}
  else if(a=='upload-doc-modal'){S.modal={type:'upload-doc'};R()}
  else if(a=='view-doc'){
    const item=S.docs.find(d=>d.id===v);
    if(item){S.modal={type:'view-doc',item};R()}
  }
  else if(a=='edit-doc'){
    const item=S.docs.find(d=>d.id===v);
    if(item){S.modal={type:'edit-content',item};R()}
  }
  else if(a=='delete-doc-prompt'){
    const item=S.docs.find(d=>d.id===v);
    if(item){S.modal={type:'delete-confirm',item};R()}
  }
  else if(a=='confirm-delete'){
    const docId=v;
    // Call backend delete
    await apiCall(`/documents/${docId}`,{method:'DELETE'});
    S.docs=S.docs.filter(d=>d.id!==docId);
    saveTickets();
    S.modal=null;R();
    toast('Knowledge entry deleted and vectors removed.');
  }
  else if(a=='toggle-pub'){
    const item=S.docs.find(d=>d.id===v);
    if(item){
      const isPub=item.publication_status==='published';
      const newStatus=isPub?'draft':'published';
      await apiCall(`/documents/${item.id}/${isPub?'unpublish':'publish'}`,{method:'POST'});
      item.publication_status=newStatus;
      saveTickets();R();
      toast(`Entry "${item.title}" is now ${newStatus}.`);
    }
  }
  else if(a=='reprocess-doc'){
    const item=S.docs.find(d=>d.id===v);
    if(item){
      await apiCall(`/documents/${item.id}/reprocess`,{method:'POST'});
      item.processing_status='ready';
      saveTickets();R();
      toast(`Rebuilt AI embeddings for "${item.title}".`);
    }
  }
  else if(a=='submit-content'){
    const title=$('#ct-title')?.value.trim();
    const content=$('#ct-body')?.value.trim();
    if(!title||!content){toast('Title and content are required.');return}
    const cat=$('#ct-cat')?.value||'General';
    const scope=$('#ct-scope')?.value||'campus';
    const vis=$('#ct-vis')?.value||'public_students';
    const eff=$('#ct-eff')?.value||today();
    const exp=$('#ct-exp')?.value||null;
    const status=v||'published';

    const payload={title,content,category:cat,scope,visibility:vis,publication_status:status,effective_date:eff,expiry_date:exp};
    const res=await apiCall('/documents/content',{method:'POST',body:JSON.stringify(payload)});
    const newDoc=res.ok&&res.data?res.data:{
      id:'KB-'+(100+S.docs.length+1),item_type:'text_content',title,category:cat,raw_content:content,
      scope,visibility:vis,publication_status:status,processing_status:'ready',effective_date:eff,date:today()
    };
    S.docs.unshift(newDoc);
    saveTickets();
    S.modal=null;R();
    toast(`Added "${title}" to Knowledge Base (${status}).`);
  }
  else if(a=='submit-content-update'){
    const docId=v;
    const item=S.docs.find(d=>d.id===docId);
    if(item){
      const title=$('#et-title')?.value.trim()||item.title;
      const cat=$('#et-cat')?.value||item.category;
      const status=$('#et-status')?.value||item.publication_status;
      const scope=$('#et-scope')?.value||item.scope;
      const vis=$('#et-vis')?.value||item.visibility;
      const content=$('#et-body')?.value.trim()||item.raw_content;

      const payload={title,category:cat,publication_status:status,scope,visibility:vis,content};
      await apiCall(`/documents/content/${docId}`,{method:'PATCH',body:JSON.stringify(payload)});
      Object.assign(item,{title,category:cat,publication_status:status,scope,visibility:vis,raw_content:content,processing_status:'ready'});
      saveTickets();
      S.modal=null;R();
      toast(`Updated "${title}".`);
    }
  }
  else if(a=='submit-doc-upload'){
    const title=$('#doc-title')?.value.trim()||'University Policy Document';
    const cat=$('#doc-cat')?.value||'General';
    const scp=$('#doc-scope')?.value||'campus';
    const vis=$('#doc-vis')?.value||'public_students';
    const desc=$('#doc-desc')?.value.trim()||'';
    const status=$('#doc-status')?.value||'published';
    const fileInput=$('#doc-file');
    const filename=fileInput?.files[0]?.name||'Document.pdf';

    const newDoc={
      id:'DOC-'+(100+S.docs.length+1),item_type:'file',title,category:cat,description:desc,
      original_filename:filename,scope:scp,visibility:vis,status:'ready',publication_status:status,processing_status:'ready',date:today()
    };
    S.docs.unshift(newDoc);
    saveTickets();
    S.modal=null;R();
    toast(`Uploaded "${title}" and queued for AI indexing.`);
  }
  else if(a=='onsave'){
    const n=$('#on').value,ag=$('#oa').value,c=$('#oc')?.value||'',st=S.role=='student',er=vProf(n,ag,c,st);
    if(er){$('#oerr').textContent=er;return}
    PR[S.user.email]={name:n.trim().replace(/\s+/g,' '),age:Number(ag),course:st?c:''};
    savePR();go('app');
  }
  else if(a=='saveprof'){
    const n=$('#pn').value,ag=$('#pa').value,c=$('#pc')?.value||'',st=S.role=='student',er=vProf(n,ag,c,st);
    if(er){$('#perr').textContent=er;return}
    PR[S.user.email]={name:n.trim().replace(/\s+/g,' '),age:Number(ag),course:st?c:''};
    savePR();toast('Profile updated.');
  }
  else if(a=='resetprof'){delete PR[S.user.email];savePR();go('onboard')}
  else if(a=='logout'){
    try{localStorage.removeItem('ub-current-user');localStorage.removeItem('ub-token')}catch(x){}
    S.user=null;S.role=null;go('landing');
  }
  else if(a=='view'){if(S.view!=v)S.fx='view';S.view=v;S.bell=false;S.nav=false;R()}
  else if(a=='navo'){S.nav=true;R()}else if(a=='navx'){S.nav=false;R()}
  else if(a=='new')newChat();
  else if(a=='hist'){const h=S.hist.splice(+v,1)[0];if(S.chat.length)S.hist.unshift({title:ttl(),msgs:S.chat});S.chat=h.msgs;S.view='chat';S.nav=false;S.fx='view';R()}
  else if(a=='bell'){S.bell=!S.bell;R()}
  else if(a=='readall'){S.notifs.forEach(n=>n.u=0);saveTickets();R()}
  else if(a=='nt'){const n=S.notifs[v];n.u=0;saveTickets();S.sel=n.tk;S.view='queries';S.bell=false;S.fx='view';R()}
  else if(a=='open'){S.sel=v;if(S.role=='student'&&S.view!='queries'){S.view='queries';S.fx='view'}R()}
  else if(a=='dask')sendDash();
  else if(a=='sq')ask(v);
  else if(a=='send')sendChat();
  else if(a=='attach')toast('Attachments will be attached to ticket escalation.')
  else if(a=='vs'){const x=S.chat[v];toast(`Verified source: ${x.s}, ${x.p}.`)}
  else if(a=='fwd'){S.modal={i:+v,q:S.chat[+v-1]?.t||'Question'};R()}
  else if(a=='mc'){S.modal.out=1;R();setTimeout(()=>{S.modal=null;R()},160)}
  else if(a=='ms'){
    const m=S.modal,q=m.q||S.chat[m.i-1]?.t||'Question',id='UB-'+(2100+Math.floor(Math.random()*900));
    S.tickets.unshift({id,subj:q.slice(0,40),dept:$('#md').value,fac:'Unassigned',date:today(),pri:$('#mp').value,st:0,q,desc:$('#mx').value,reply:'',tl:[today().slice(0,6)]});
    saveTickets();
    if(S.chat[m.i])S.chat[m.i].fw=id;
    S.sel=id;
    notify(`Ticket ${id} was submitted.`,id);
    S.modal={done:id};R();
  }
  else if(a=='vt'){S.modal=null;S.sel=v;S.view='queries';S.fx='view';R()}
  else if(a=='respond'||a=='resolve'){
    const t=T(S.sel),r=$('#rp').value.trim();
    if(a=='respond'&&!r){toast('Write a response first.');return}
    if(r)t.reply=r;
    const d=today().slice(0,6);t.fac=pn();
    while(t.tl.length<3)t.tl.push(d);
    if(a=='resolve'){t.st=3;t.tl[3]=d}else if(t.st<2)t.st=2;
    saveTickets();
    notify(a=='resolve'?`Ticket ${t.id} was resolved by ${t.fac}.`:`${t.fac} replied to ${t.id}.`,t.id);
    toast(a=='resolve'?'Ticket resolved.':'Response sent.');
  }
});

document.addEventListener('keydown',e=>{
  if(e.key=='Enter'&&e.target.id=='ci'){e.preventDefault();sendChat()}
  if(e.key=='Enter'&&e.target.id=='dq'){e.preventDefault();sendDash()}
  if(e.key=='Enter'&&(e.target.id=='email'||e.target.id=='pass'||e.target.id=='em'||e.target.id=='pw')){e.preventDefault();doLogin()}
  if(e.key=='Enter'&&['on','oa','oc'].includes(e.target.id)){e.preventDefault();document.querySelector('[data-a=onsave]')?.click()}
  if(e.key=='Enter'&&e.target.id=='kb-search-input'){S.kbSearch=e.target.value;R()}
});
document.addEventListener('input',e=>{
  if(e.target.id=='email'||e.target.id=='em'){document.getElementById('f-email')?.classList.remove('bad');}
  if(e.target.id=='pass'||e.target.id=='pw'){document.getElementById('f-pass')?.classList.remove('bad');}
  if(e.target.id=='gs'){S.fq=e.target.value;R()}
  if(e.target.id=='kb-search-input'){S.kbSearch=e.target.value;R()}
});
document.addEventListener('change',e=>{
  if(e.target.id=='fs'){S.fs=e.target.value;R()}
  if(e.target.id=='kb-filter-type'){S.kbFilterType=e.target.value;R()}
  if(e.target.id=='kb-filter-cat'){S.kbFilterCat=e.target.value;R()}
  if(e.target.id=='kb-filter-status'){S.kbFilterStatus=e.target.value;R()}
});

// Auto-restore active session if exists
try{
  const savedUser=localStorage.getItem('ub-current-user');
  if(savedUser&&ACC[savedUser]){
    const a=ACC[savedUser];
    S.user={...a,email:savedUser};
    S.role=a.role;
    S.scr=PR[savedUser]?'app':'onboard';
    S.view=a.role=='student'?'chat':a.role=='faculty'?'tix':a.role=='management'?'kb':'x';
  }
}catch(e){}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", () => R());
} else {
  R();
}
</script></body></html>
