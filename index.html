<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniBuddy — Campus AI Assistant & Query Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer onload="if(window.initGoogleAuth)initGoogleAuth()"></script>
<script src="./runtime-config.js"></script>
<style>
:root{--bg:#FFFFFF;--ice:#EAF1FC;--lav:#F0EDFF;--bg2:#F4F6FA;--ind:#7187C9;--indd:#5a70b4;--navy:#263653;--deep:#263653;--ink:#263653;--slate:#687386;--bd:#E3E8F0;--sh:0 1px 2px rgba(38,54,83,.05),0 8px 22px -10px rgba(38,54,83,.14);--sh2:0 2px 4px rgba(38,54,83,.05),0 18px 38px -14px rgba(38,54,83,.24);--grad:linear-gradient(180deg,#6b81c3,#4f66a8);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14.5px/1.55 Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}h2{font-size:22px}h3{font-size:15.5px}
.ed{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.02em;line-height:1.15}h1.ed{font-size:clamp(32px,4.5vw,50px)}h2.ed{font-size:clamp(24px,3.2vw,32px)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{height:40px;padding:0 18px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);box-shadow:0 1px 2px rgba(38,54,83,.06);cursor:pointer;font-weight:500;transition:transform .2s,box-shadow .2s,border-color .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:var(--ind)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--grad);color:#fff;border-color:#4a60a0;box-shadow:0 8px 16px -8px rgba(79,102,168,.8),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.sm{height:32px;padding:0 13px;font-size:13px;border-radius:10px}.btn.w{width:100%}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--slate);transition:background .2s,color .2s,transform .2s;position:relative}.ib:hover{background:var(--lav);color:var(--navy)}.ib:active{transform:scale(.93)}
:focus-visible{outline:2px solid var(--ind);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
input,select,textarea{width:100%;height:42px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:0 14px;transition:border-color .2s,box-shadow .2s}textarea{height:auto;padding:11px 14px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ind);box-shadow:0 0 0 4px rgba(113,135,201,.18)}
label{display:block;font-size:13px;font-weight:500;margin:14px 0 6px}
.mut{color:var(--slate)}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#8ea2db,#5f76bb);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;box-shadow:0 5px 10px -4px rgba(113,135,201,.8),inset 0 1px 0 rgba(255,255,255,.4)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;cursor:pointer;letter-spacing:-.02em;color:var(--navy)}
.ico{width:42px;height:42px;border-radius:13px;background:linear-gradient(180deg,#fff,var(--ice));border:1px solid var(--bd);display:grid;place-items:center;color:var(--indd);box-shadow:0 5px 10px -5px rgba(38,54,83,.25),inset 0 1px 0 #fff;flex:none}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:20px}
.tint{background:linear-gradient(180deg,var(--ice),#fff)}
.lift{transition:transform .22s,box-shadow .22s,border-color .22s;cursor:pointer}.lift:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:#cdd8ee}
.fx{animation:fx .25s ease both}@keyframes fx{from{opacity:0;transform:translateY(6px)}}.in{animation:fx .25s ease both}
.lnk{background:none;border:0;cursor:pointer;color:var(--slate);padding:6px 10px;font-weight:500;transition:color .2s}.lnk:hover{color:var(--navy)}
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:99px;background:var(--lav);border:1px solid #e1dbfa;color:var(--indd);font-size:12.5px;font-weight:500;padding:4px 12px}
/* landing */
.land{position:relative;overflow:hidden;min-height:100vh}.land:before,.land:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.land:before{width:560px;height:560px;right:-160px;top:-180px;background:radial-gradient(circle,var(--lav),transparent 68%)}.land:after{width:520px;height:520px;left:-200px;top:260px;background:radial-gradient(circle,var(--ice),transparent 68%)}
.land>*{position:relative;z-index:1}
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px max(20px,5vw);gap:10px}.wrap{max-width:1060px;margin:auto;padding:0 max(20px,4vw)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:56px 0 72px}.hero p{color:var(--slate);font-size:17px;max-width:470px;margin:18px 0 28px}
.stage{position:relative;padding:28px 0 28px 18px}.prev{transform:perspective(1100px) rotateY(-6deg) rotateX(2deg);box-shadow:var(--sh2),0 40px 60px -34px rgba(38,54,83,.3);padding:18px;max-width:430px;margin-left:auto}
.chipf{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:500;box-shadow:var(--sh2);display:flex;gap:6px;align-items:center;color:var(--navy)}.c1{left:-6px;bottom:6px}.c2{right:6px;top:0;background:var(--lav)}
.bento{display:grid;grid-template-columns:1.1fr 1fr 1fr;grid-template-rows:auto auto;gap:14px;padding-bottom:72px}.bt{border-radius:20px;padding:24px;border:1px solid var(--bd);transition:transform .22s,box-shadow .22s;cursor:default}.bt:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.bt p{margin:6px 0 0;color:var(--slate);font-size:14px}.bt .ico{margin-bottom:16px}.bt.tall{grid-row:span 2;background:linear-gradient(160deg,var(--lav),#fff 75%)}.bt.tall h3{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:26px;line-height:1.15;margin-top:6px}.bt.tall p{font-size:15px}
.bt.b{background:var(--ice);grid-column:span 2}.bt.m{background:var(--bg2)}.bt.w{background:#fff}
.how{padding:0 0 72px}.hsteps{display:grid;grid-template-columns:repeat(3,1fr);margin-top:26px;position:relative}.hsteps:before{content:"";position:absolute;left:18px;right:18px;top:18px;height:2px;background:linear-gradient(90deg,var(--ind),#d5dcf1)}
.hs{position:relative;padding-right:24px}.num{width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--ind);color:var(--indd);display:grid;place-items:center;font-weight:600;margin-bottom:14px;position:relative}.hs p{margin:0;max-width:240px}
footer{padding:24px;text-align:center;color:var(--slate);font-size:13px;border-top:1px solid var(--bd)}

/* Redesigned Centered Login Page — matching screenshot visual aesthetic */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px 20px 48px;background:radial-gradient(1100px 520px at 50% -10%,var(--lav),transparent 72%),#ffffff}
.login-header{text-align:center;max-width:540px;margin-bottom:26px}
.login-card{width:100%;max-width:440px;background:#ffffff;border:1px solid var(--bd);border-radius:22px;padding:32px 28px;box-shadow:var(--sh);position:relative}
.g-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:44px;background:#ffffff;border:1px solid var(--bd);border-radius:12px;color:var(--navy);font-weight:500;font-size:14.5px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;box-shadow:0 1px 2px rgba(38,54,83,.05)}
.g-btn:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:#b4c5e7;background:#fafbff}
.g-btn:active{transform:scale(.98)}
.divider{display:flex;align-items:center;margin:18px 0 16px;color:var(--slate);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--bd)}
.divider:before{margin-right:12px}.divider:after{margin-left:12px}

/* Demo Accounts Section */
.demo-section{width:100%;max-width:960px;margin-top:44px}
.demo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}
.demo-card{background:#ffffff;border:1px solid var(--bd);border-radius:20px;padding:22px 18px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
.demo-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--ind)}
.demo-card.t-lav{background:var(--lav);border-color:#d5cef7}
.demo-card.t-ice{background:var(--ice);border-color:#cddaf5}
.demo-card h3{font-size:16px;font-weight:600;color:var(--navy);margin-top:6px}
.demo-card p{font-size:13px;color:var(--slate);line-height:1.45;margin:0;flex:1}
.demo-card .demo-badge{font-size:11.5px;color:var(--slate);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(38,54,83,.05);padding:3px 8px;border-radius:6px;width:fit-content;margin:4px 0}
.demo-card .btn{background:#ffffff;border:1px solid var(--bd);color:var(--navy);font-weight:500;margin-top:8px}
.demo-card:hover .btn{border-color:var(--ind);background:linear-gradient(180deg,#ffffff,var(--ice))}
.demo-card.t-lav .btn{background:#ffffff}
@media(max-width:860px){.demo-grid{grid-template-columns:repeat(2,1fr)}.login-wrap{padding:32px 16px}}
@media(max-width:520px){.demo-grid{grid-template-columns:1fr}}

/* App Shell */
.app{display:flex;height:100vh;height:100dvh}
.side{width:262px;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px;flex:none;transition:transform .22s}.side .logo{padding:2px 8px 18px}
.si{display:flex;align-items:center;gap:11px;width:100%;height:40px;padding:0 12px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--slate);text-align:left;transition:background .2s,color .2s,transform .2s;position:relative}
.si:hover{background:var(--bg2);color:var(--navy)}.si:active{transform:scale(.98)}.si.on{background:var(--lav);color:var(--indd);font-weight:600}.si.on:before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ind)}
.si.nc{background:var(--grad);color:#fff;font-weight:500;margin-bottom:14px;box-shadow:0 8px 16px -8px rgba(79,102,168,.9),inset 0 1px 0 rgba(255,255,255,.3);justify-content:center}.si.nc:hover{filter:brightness(1.06);color:#fff}
.sh{font-size:12px;color:var(--slate);padding:16px 12px 6px;font-weight:500}
.hist{overflow-y:auto;overflow-x:hidden;flex:1;min-height:60px}
.hist-row{display:flex;align-items:center;position:relative;border-radius:12px;margin-bottom:2px}
.hist-row:hover{background:var(--bg2)}
.hist-row.on{background:var(--lav)}
.hist-row .si{flex:1;min-width:0;height:34px;font-size:13.5px;padding-right:6px}
.hist-row .si span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-row.on .si{color:var(--indd);font-weight:600}
.del-chat{display:none;align-items:center;justify-content:center;width:28px;height:28px;margin-right:6px;border:0;background:none;border-radius:8px;color:var(--slate);cursor:pointer;flex-shrink:0;transition:color .15s,background .15s}
.del-chat svg{width:14px;height:14px}
.del-chat:hover{color:#b4445a;background:rgba(180,68,90,.12)}
.hist-row:hover .del-chat,.hist-row.on .del-chat{display:flex}
.prof{border-top:1px solid var(--bd);padding-top:12px;margin-top:10px}.prof .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#8ea2db,#5f76bb);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:radial-gradient(800px 280px at 75% -80px,var(--lav),transparent 70%),#fff}
.hd{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none;position:relative;border-bottom:1px solid var(--bd);background:rgba(255,255,255,.7);backdrop-filter:blur(8px)}
.menu{display:none}.on-ind{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--slate)}.pu{width:8px;height:8px;border-radius:50%;background:#58b394;animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(88,179,148,.45)}50%{box-shadow:0 0 0 5px rgba(88,179,148,0)}}
.page{flex:1;overflow:auto;padding:30px max(16px,3vw)}.pg{max-width:880px;margin:auto}.pg.wide{max-width:980px}

/* Chat */
.chatw{flex:1;display:flex;flex-direction:column;min-height:0}.msgs{flex:1;overflow:auto;padding:24px 16px}.col{max-width:740px;margin:auto}
.empty{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-bottom:30px}
.welcome{position:relative;padding:34px 30px 30px;border-radius:28px;background:radial-gradient(closest-side at 50% 30%,var(--lav),transparent),radial-gradient(closest-side at 80% 90%,var(--ice),transparent);width:100%}.welcome .mark{width:54px;height:54px;border-radius:17px;font-size:23px;margin:0 auto 16px}.welcome p{color:var(--slate);margin:8px 0 22px;font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px;margin:auto}.chip{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:99px;padding:9px 16px 9px 12px;font-weight:500;font-size:13.5px;cursor:pointer;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}.chip svg{color:var(--indd)}.chip:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--ind);background:var(--lav)}.chip:active{transform:scale(.97)}
.u{display:flex;justify-content:flex-end;margin:20px 0 4px}.ub{background:var(--lav);border:1px solid #e1dbfa;color:var(--navy);padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:80%}
.ts{font-size:11.5px;color:var(--slate);margin-top:4px;opacity:.85}.tsr{text-align:right}
.a{display:flex;gap:12px;margin:18px 0}.a .body{flex:1;min-width:0}.a .who{font-weight:600;font-size:13.5px;margin-bottom:2px}
.vb{display:inline-flex;align-items:center;gap:5px;background:var(--ice);color:var(--indd);border:1px solid #d3e0f6;border-radius:99px;padding:2px 10px 2px 8px;font-size:12px;font-weight:600}
.ans ul,.ans ol{margin:6px 0 6px 20px;padding:0}.ans li{margin:3px 0}.ans p{margin:0 0 8px}.ans p:last-child{margin-bottom:0}
.src{margin-top:10px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;background:var(--bg2);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--slate);border-left:3px solid var(--ind)}.src button{color:var(--indd);font-weight:600;background:none;border:0;cursor:pointer;padding:0;text-decoration:underline}
.nf{margin-top:12px;background:var(--lav);border:1px solid #e1dbfa;border-radius:14px;padding:14px}
.ld{display:inline-flex;gap:5px;padding:10px 0}.ld span{width:7px;height:7px;border-radius:50%;background:var(--ind);animation:bl 1.2s infinite}.ld span:nth-child(2){animation-delay:.18s}.ld span:nth-child(3){animation-delay:.36s}@keyframes bl{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.comp{padding:0 16px 14px}.cbox{max-width:740px;margin:auto;border:1px solid var(--bd);border-radius:20px;display:flex;align-items:center;gap:4px;padding:8px 8px 8px 6px;background:#fff;box-shadow:var(--sh2);transition:border-color .2s,box-shadow .2s}.cbox:focus-within{border-color:var(--ind);box-shadow:0 0 0 4px rgba(113,135,201,.16),var(--sh2)}
.cbox input{border:0;height:42px;flex:1;box-shadow:none!important;background:none}.send{width:40px;height:40px;border-radius:13px;border:0;background:var(--grad);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 12px -5px rgba(79,102,168,.8),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .2s}.send:hover{transform:translateY(-1px)}.send:active{transform:scale(.92)}
.note{text-align:center;font-size:12px;color:var(--slate);margin-top:8px;opacity:.85}

/* Dashboard Editorial */
.sub{color:var(--slate);margin:8px 0 0;font-size:15.5px}
.askp{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:center;margin:26px 0 8px;padding:22px 24px;border-radius:22px;background:linear-gradient(120deg,var(--lav),var(--ice));border:1px solid #e1e6f7;box-shadow:var(--sh)}.askp p{margin:4px 0 0;color:var(--slate);font-size:13.5px}
.strip{display:flex;margin:22px 0 10px;border-bottom:1px solid var(--bd);padding-bottom:20px}.sti{flex:1;display:flex;gap:12px;align-items:center;padding:0 20px;border-left:1px solid var(--bd);cursor:pointer;transition:transform .2s}.sti:first-child{border:0;padding-left:0}.sti:hover{transform:translateY(-2px)}.sti b{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:32px;line-height:1;display:block}.sti span{font-size:12.5px;color:var(--slate)}.sti .ic{width:34px;height:34px;border-radius:10px;background:var(--ice);display:grid;place-items:center;color:var(--indd)}
.dgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:36px;margin:22px 0}.sh2{font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.feat1{border-radius:16px;padding:18px;background:linear-gradient(150deg,var(--lav),#fff);border:1px solid #e1dbfa;margin-bottom:6px;transition:transform .2s,box-shadow .2s;cursor:pointer}.feat1:hover{transform:translateY(-2px);box-shadow:var(--sh)}.feat1 h3{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:19px;margin:8px 0 2px}
.cat{font-size:12px;font-weight:600;color:var(--indd)}.dt{font-size:12px;color:var(--slate)}
.hrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}.hrow:last-child{border:0}.hrow span:first-child{display:flex;flex-direction:column}
.dl{position:relative;padding-left:20px}.dl:before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--ind),#dfe5f5)}.dli{position:relative;padding:0 0 16px}.dli:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ind)}.dli b{font-weight:600;display:block}.dli small{color:var(--slate);font-size:12.5px}
.qp{background:var(--bg2);border-radius:18px;padding:6px 18px}.qr{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer;transition:padding .2s}.qr:last-child{border:0}.qr:hover{padding-left:6px}.qr small{color:var(--slate);font-weight:500}

/* Announcements Magazine */
.mag{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:24px}.am{border-radius:20px;padding:22px;border:1px solid var(--bd);grid-column:span 2;transition:transform .22s,box-shadow .22s;display:flex;flex-direction:column;gap:6px}.am:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.am.big{grid-column:span 4;grid-row:span 2;padding:30px;justify-content:flex-end;min-height:260px}.am.big h3{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:30px;line-height:1.12}.am:nth-child(4),.am:nth-child(5){grid-column:span 3}
.am.lav{background:linear-gradient(150deg,var(--lav),#fff 85%)}.am.blue{background:linear-gradient(150deg,var(--ice),#fff 85%)}.am.mist{background:var(--bg2)}.am p{margin:0;color:var(--slate);font-size:13.5px}
.imp{align-self:flex-start;background:var(--indd);color:#fff;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 10px}

/* Tables & Tickets */
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-weight:500;font-size:12.5px;color:var(--slate);padding:10px 12px;background:var(--bg2);white-space:nowrap}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}td{padding:12px;border-bottom:1px solid var(--bd)}
table{min-width:620px}.card .tw{padding-bottom:6px}tr.rw{cursor:pointer;transition:background .2s}tr.rw:hover,tr.rw.on{background:var(--lav)}.tw{overflow-x:auto}

const $=s=>document.querySelector(s),now=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),today=()=>new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

// Public settings only. The deploy-specific URL and OAuth client ID live in runtime-config.js.
const _isLocalPreview=['localhost','127.0.0.1'].includes(window.location.hostname);
const UB_API_BASE=String(
  (_isLocalPreview && !window.UB_CONFIG?.forceRemoteApi)
    ? (['3000', '8099'].includes(window.location.port) ? '/api/v1' : 'http://127.0.0.1:8000/api/v1')
    : (window.UB_CONFIG?.apiBase || '')
).replace(/\/$/,'');
const UB_GOOGLE_CLIENT_ID=String(window.UB_CONFIG?.googleClientId||'');

const pn=()=>S.user?.full_name||S.user?.name||S.user?.email||'Campus User',ini=()=>pn()[0].toUpperCase();

const ROLES={
  student:['user','Student','Ask verified questions and track tickets.'],
  faculty:['book','Faculty','Review and answer student tickets.'],
  authority:['shield','Authority','Campus oversight, documents & announcements.'],
  management:['bld','Management','University-level analytics & resolution stats.']

const SUG=[['cal','Academic Timetable','Where can I find the academic timetable?'],['edit','Examination Information','When is the next internal examination?'],['cap','Scholarships','How can I apply for a scholarship?'],['bld','Campus Facilities','What are the library hours and campus facilities?']];

// Application state
const S={
  scr:'landing',role:null,user:null,view:'chat',sel:null,modal:null,bell:false,nav:false,
  chat:[],hist:[],fq:'',fs:'All',toast:'',fx:'screen',conversationId:null,

const T=id=>S.tickets.find(t=>t.id==id),stl=t=>{const h=humanStatus(t.status);return `<span class="pill s${Math.max(0,STG.indexOf(h))}">${esc(h)}</span>`};
const go=(s,o={})=>{Object.assign(S,{scr:s,bell:false,nav:false,fx:'screen'},o);R();scrollTo(0,0)};
let toastTimer;
const toast=m=>{
  S.toast=m;
  let node=$('#app .toast');
  if(!node){node=document.createElement('div');node.className='toast';$('#app')?.append(node)}

// Backend API client. No local/demo data is used as a fallback.
const sleepMs=ms=>new Promise(r=>setTimeout(r,ms));
// Reads are retried while the free backend wakes up (cold start: 502/503/504 or a network error).
// Writes (POST, PATCH) are never retried here, so one click cannot create a second record.
// Timings for this page, read from the browser console: window.__ubTimes (endpoint, status, ms). No ids or tokens.
window.__ubTimes=window.__ubTimes||[];
async function apiCall(endpoint,options={}){
  if(!UB_API_BASE)return {ok:false,status:0,error:'Backend URL is not configured for this website.'};
  const method=String(options.method||'GET').toUpperCase();
  const attempts=(method==='GET'||options.idempotent)?3:1;
  const started=performance.now();
  const label=endpoint.split('?')[0].replace(/[0-9a-f]{8}-[0-9a-f-]{27}/g,':id');
  const token=localStorage.getItem('ub-token');
  const headers={...(options.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(options.headers||{})};
  if(token)headers['Authorization']=`Bearer ${token}`;
  for(let i=0;i<attempts;i++){
    const last=i===attempts-1;
    try{
      const res=await fetch(UB_API_BASE+endpoint,{...options,headers});
      window.__ubTimes.push({endpoint:label,status:res.status,ms:Math.round(performance.now()-started)});
      if(res.ok){let data=null;try{data=await res.json()}catch(e){}return {ok:true,status:res.status,data}}
      if(!last&&[502,503,504].includes(res.status)){await sleepMs(4000*(i+1));continue}
      let errData={};try{errData=await res.json()}catch(e){}
      const detail=typeof errData.detail==='string'
        ? errData.detail
        : (errData.detail?.message || errData.message || '');
      let error=detail||'Request failed';
      if(res.status===503&&!detail)error=/storage/i.test(detail)?'File storage is unavailable right now. Nothing was uploaded; try again later.':'UniBuddy service is unavailable right now. Please try again in a moment.';
      const detail=typeof errData.detail==='string'?errData.detail:'';
      let error=detail||'Request failed';
      if(res.status===503)error=/storage/i.test(detail)?'File storage is unavailable right now. Nothing was uploaded; try again later.':'UniBuddy is waking up on free hosting. Please wait a minute and try again.';
      return {ok:false,status:res.status,error};
    }catch(err){
      if(!last&&method==='GET'){await sleepMs(4000*(i+1));continue}
      return {ok:false,status:0,error:method==='GET'?'UniBuddy is waking up on free hosting. Please wait a minute and try again.':'The request may not have finished. Check the list before trying again.'};
    }
  }
}

const pageItems=r=>Array.isArray(r?.data?.items)?r.data.items:[];

// While an uploaded PDF is pending or processing, re-check only the document list (every 4 s, about 6 minutes).
// The page redraws only when a document's status or publication actually changes.
let docPollTimer=null,docPollCount=0;
function docView(d){return {...d,id:d.id.slice(0,8),uuid:d.id,status:d.processing_status,publication:d.publication_status,date:new Date(d.created_at).toLocaleDateString()}}
function watchDocProcessing(){
  clearTimeout(docPollTimer);docPollTimer=null;
  const busy=(S.docs||[]).some(d=>d.status==='pending'||d.status==='processing');
  if(!busy){docPollCount=0;return}
  if(++docPollCount>90){docPollCount=0;return}
  docPollTimer=setTimeout(pollDocProcessing,4000);
}
async function pollDocProcessing(){
  docPollTimer=null;
  if(!S.user||S.view!=='docs'){docPollCount=0;return}
  const r=await apiCall('/documents?limit=50');
  if(r.ok){
    const next=pageItems(r).map(docView);
    const sig=l=>JSON.stringify(l.map(d=>[d.uuid,d.status,d.publication]));
    if(sig(next)!==sig(S.docs||[])){S.docs=next;if(!S.modal)R()}
  }
  watchDocProcessing();
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const humanStatus=s=>({submitted:'Submitted',assigned:'Assigned',in_progress:'In Progress',resolved:'Resolved'}[s]||s||'Submitted');
// A ticket with no department went to the campus queue, which Authority sees.
const deptLabel=t=>t.department_id?(S.departments.find(d=>d.id===t.department_id)?.name||'Department'):'Campus queue';
// After the server confirms a ticket change, only that ticket is updated: its open detail and its row.
function applyTicketUpdate(data){
  const view={...ticketView(data.ticket),events:data.events||[]};
  view.dept=deptLabel(view);
  S.detail={ticket:view,events:data.events||[]};
  S.tickets=(S.tickets||[]).map(t=>t.uuid===view.uuid?{...t,...view}:t);
}
async function reloadTicketList(){
  const r=await apiCall('/tickets?limit=50');
  if(r.ok)S.tickets=pageItems(r).map(ticketView).map(x=>({...x,dept:deptLabel(x)}));
}
function ticketView(t){return {...t,id:t.ticket_number||t.id,uuid:t.id,subj:t.subject,q:t.question,desc:t.description||'',pri:t.priority||'medium',status:t.status||'submitted',date:new Date(t.created_at).toLocaleDateString(),dept:t.department_name||'Department',fac:t.assigned_faculty_id?'Assigned':'Unassigned',reply:'',events:[]}}
async function loadViewData(view=S.view){
  if(!S.user)return;
  S.loading=true;
  const tasks=[];
  // Chat state belongs to one signed-in person; clear it when a different account loads the page.
  if(S.user.id!==S.chatOwner){S.chat=[];S.hist=[];S.conversationId=null;S.restoredChat=false;S.chatOwner=S.user.id}
  if(S.role==='student')tasks.push(loadConversations());
  if(['student','faculty','authority'].includes(S.role)&&['queries','tix','fdash','x'].includes(view))tasks.push(apiCall('/tickets?limit=50').then(r=>{if(r.ok)S.tickets=pageItems(r).map(ticketView)}));
  if(view==='docs'||view==='x')tasks.push(apiCall('/documents?limit=50').then(r=>{if(r.ok)S.docs=pageItems(r).map(d=>({...d,id:d.id.slice(0,8),uuid:d.id,status:d.processing_status,publication:d.publication_status,date:new Date(d.created_at).toLocaleDateString()}))}));
  if(view==='ann'||view==='dash'||view==='x')tasks.push(apiCall('/announcements?limit=20').then(r=>{if(r.ok)S.announcements=pageItems(r).map(a=>({...a,c:a.category||'Notice',t:a.title,b:a.body,d:new Date(a.created_at).toLocaleDateString(),tone:'blue',big:a.is_important,imp:a.is_important}))}));
  if(['student','faculty','authority'].includes(S.role)&&!S.departments.length)tasks.push(apiCall('/departments').then(r=>{if(r.ok)S.departments=Array.isArray(r.data)?r.data:[]}));
  if(['student','faculty','authority'].includes(S.role)&&['chat','queries','tix','fdash','x'].includes(view))tasks.push(apiCall('/tickets?limit=50').then(r=>{if(r.ok)S.tickets=pageItems(r).map(ticketView)}));
  if((view==='docs'||view==='x')&&S.role!=='management')tasks.push(apiCall(['faculty','authority'].includes(S.role)?'/documents?'+listQuery('doc'):'/documents?limit=50').then(r=>{if(r.ok)S.docTotal=r.data?.total??null;if(r.ok)S.docs=pageItems(r).map(d=>({...d,id:d.id.slice(0,8),uuid:d.id,status:d.processing_status,publication:d.publication_status,date:new Date(d.created_at).toLocaleDateString()}))}));
  if((view==='ann'||view==='dash'||view==='x')&&S.role!=='management')tasks.push(apiCall(['faculty','authority'].includes(S.role)?'/announcements?'+listQuery('ann'):'/announcements?limit=20').then(r=>{if(r.ok)S.annTotal=r.data?.total??null;if(r.ok)S.announcements=pageItems(r).map(a=>({...a,c:a.category||'Notice',t:a.title,b:a.body,d:new Date(a.created_at).toLocaleDateString(),tone:'blue',big:a.is_important,imp:a.is_important}))}));
  if(['student','faculty','authority'].includes(S.role)&&!S.departments.length)tasks.push(apiCall('/departments').then(r=>{if(r.ok)S.departments=Array.isArray(r.data)?r.data:[]}));
  if(['faculty','authority'].includes(S.role)&&['publish','courses','docs','ann','x'].includes(view)){tasks.push(apiCall(S.role==='authority'?'/courses?include_inactive=true':'/courses').then(r=>{if(r.ok)S.courses=Array.isArray(r.data)?r.data:[]}));tasks.push(apiCall(S.role==='authority'?'/filter-options?include_inactive=true':'/filter-options').then(r=>{if(r.ok)S.options=Array.isArray(r.data)?r.data:[]}))}
  if(view==='dash')tasks.push(apiCall('/dashboard/student').then(r=>{if(r.ok)S.dashboard=r.data}));
  if(view==='fdash'||(view==='x'&&S.role!=='management'))tasks.push(apiCall(S.role==='management'?'/management/stats':'/dashboard/staff').then(r=>{if(r.ok)S.dashboard=r.data}));
  // Management: aggregate counts and recorded Gemini usage only. Read-only; the backend checks the role.
  if(view==='x'&&S.role==='management')tasks.push(apiCall('/management/analytics').then(r=>{if(r.ok)S.analytics=r.data}));
  if(S.bell)tasks.push(apiCall('/notifications?limit=20').then(r=>{if(r.ok)S.notifs=pageItems(r).map(n=>({id:n.id,t:n.text||'Update',u:!n.is_read,tk:n.ticket_id}))}));
  if(S.bell&&S.role!=='management')tasks.push(apiCall('/notifications?limit=20').then(r=>{if(r.ok)S.notifs=pageItems(r).map(n=>({id:n.id,t:n.text||'Update',u:!n.is_read,tk:n.ticket_id}))}));
  await Promise.all(tasks);S.tickets.forEach(t=>{t.dept=deptLabel(t)});
  if(S.role==='student'&&!S.restoredChat){S.restoredChat=true;if(S.hist.length&&!S.chat.length&&!S.conversationId)await openConversation(S.hist[0].id,false)}
  S.loading=false;R();
  watchOpenTicket();
}

// Google Sign-In Credential Handler
async function handleGoogleCredential(id_token){
  if(!id_token)return;
  const er=$('#err');
  if(er){
    er.style.color='var(--slate)';
    er.textContent='Signing in…';
  }
  let res;
  try{
    res=await apiCall('/auth/google',{method:'POST',body:JSON.stringify({id_token}),idempotent:true});
  }catch(e){
    res={ok:false,status:0,error:'Sign-in request failed.'};
  }
  const began=Date.now();
  const progress=()=>{if(er)er.textContent=`Verifying with UniBuddy Google Auth... ${Math.round((Date.now()-began)/1000)}s`+(Date.now()-began>8000?' (the free server may be waking up)':'')};
  progress();
  const ticker=setInterval(progress,1000);
  // Sign-in is idempotent: a repeat after a cold start cannot create a second account.
  let res;
  try{
    res=await apiCall('/auth/google',{method:'POST',body:JSON.stringify({id_token}),idempotent:true});
  }finally{clearInterval(ticker)}
  
  if(res.ok&&res.data?.access_token){
    if(er)er.textContent='';
    localStorage.setItem('ub-token',res.data.access_token);
    let me=res.data.user;
    if(!me){
      const meRes=await apiCall('/auth/me');
      if(meRes.ok&&meRes.data)me=meRes.data;
    }
    if(me){
      S.user={id:me.id,email:me.email,name:me.full_name||me.email.split('@')[0],full_name:me.full_name,role:me.role,campus_id:me.campus_id,department_id:me.department_id};
      S.role=me.role;
      S.scr='app';
      S.view=me.role=='student'?'chat':me.role=='faculty'?'tix':'x';
      S.loading=false;
      R();
    const meRes=await apiCall('/auth/me');
    if(meRes.ok&&meRes.data){
      const me=meRes.data;
      S.user={id:me.id,email:me.email,name:me.full_name||me.email.split('@')[0],full_name:me.full_name,role:me.role,campus_id:me.campus_id,department_id:me.department_id};
      S.role=me.role;
      S.scr='app';S.view=me.role=='student'?'chat':me.role=='faculty'?'tix':'x';R();await loadViewData(S.view);
      toast('Signed in as '+(me.full_name||me.email));
      loadViewData(S.view);
      return;
    }
    localStorage.removeItem('ub-token');
  }
  
  if(er)er.style.color='#b4445a';
  const messages={0:'Cannot reach UniBuddy backend. Make sure the server is running.',401:'Google could not verify this sign-in. Try again.',409:'This Google account is linked differently. Contact the UniBuddy administrator.',503:'UniBuddy sign-in is not configured yet.'};
  const errorMsg = (res.error && res.error !== 'Request failed') ? res.error : (messages[res.status] || 'Sign-in failed. Please try again or contact the UniBuddy administrator.');
  if(er)er.textContent=errorMsg;
  const messages={0:'Cannot reach UniBuddy right now. Check the backend address and try again.',401:'Google could not verify this sign-in. Try again.',409:'This Google account is linked differently. Contact the UniBuddy administrator.',503:'UniBuddy sign-in is not configured yet.'};
  if(er)er.textContent=messages[res.status]||'Sign-in failed. Please try again or contact the UniBuddy administrator.';
}

// Answers are plain text from the model. Escape first, then turn **bold**, '-' bullets, numbered lists and
// paragraphs into tags. Nothing from the answer is ever treated as HTML.
function fmtAnswer(t){
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  let html='',list=null,para=[];
  const flushPara=()=>{if(para.length){html+=`<p>${para.join(' ')}</p>`;para=[]}};
  const closeList=()=>{if(list){html+=`</${list}>`;list=null}};
  for(const raw of esc(String(t||'')).replace(/\r/g,'').split('\n')){
    const line=raw.trim();
    if(!line){flushPara();closeList();continue}
    const bullet=line.match(/^[-*\u2022]\s+(.*)$/),numbered=line.match(/^\d+[.)]\s+(.*)$/);
    if(bullet||numbered){
      flushPara();const kind=bullet?'ul':'ol';
      if(list!==kind){closeList();html+=`<${kind}>`;list=kind}
      html+=`<li>${inline((bullet||numbered)[1])}</li>`;continue;
    }
    closeList();para.push(inline(line));
  }
  flushPara();closeList();
  return html||'<p></p>';
}

const __chatCache=new Map();

// Ask AI Assistant — calls the real backend RAG endpoint.
async function ask(q){
  if(!q||!q.trim())return;
  const cleanQ=q.trim();
  S.chat.push({r:'u',t:cleanQ,time:now(),n:1});
  S.chat.push({r:'a',k:'ty',n:1});
  S.view='chat';
  R();
  
  // Ask the real backend RAG service; never fabricate a local answer.
  const backendRes=await apiCall('/chat/ask',{
    method:'POST',
    body:JSON.stringify({question:cleanQ,conversation_id:S.conversationId||null})
  });
  
  S.chat.pop(); // Remove typing indicator
  
  if(backendRes.ok&&backendRes.data){
    const d=backendRes.data;
    const userMessage=S.chat.at(-1);if(userMessage)userMessage.mid=d.user_message_id;
    const isNew=!S.conversationId&&d.conversation_id;
    if(d.conversation_id)S.conversationId=d.conversation_id;
    if(!d.abstained){
      S.chat.push({r:'a',k:'ok',t:d.answer,citations:d.citations||[],time:now(),n:1,mid:d.assistant_message_id});
    }else{
      S.chat.push({r:'a',k:'nf',t:d.answer,time:now(),n:1,mid:d.assistant_message_id});
    }
    if(S.conversationId)__chatCache.set(S.conversationId,[...S.chat]);
    if(isNew&&!S.hist.some(h=>h.id===d.conversation_id)){
      S.hist.unshift({id:d.conversation_id,title:cleanQ.slice(0,30)});
    }
  }else{
    S.chat.push({r:'a',k:'err',t:'The UniBuddy assistant is unavailable right now. Please try again later.',time:now(),n:1});
  }
  R();
  loadConversations().then(R);
}

// Chat history is stored on the server for each signed-in Student. The database rules return only that person's conversations.
const fmtTime=iso=>{try{return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
// Chat history on screen covers the last 72 hours. Older messages stay stored on the server; only the display changes.
const CHAT_VISIBLE_MS=72*60*60*1000;
const withinChatWindow=iso=>{const t=Date.parse(iso);return Number.isFinite(t)&&Date.now()-t<=CHAT_VISIBLE_MS};
const messageView=m=>m.role==='user'
  ?{r:'u',t:m.content,time:fmtTime(m.created_at),n:0,mid:m.id}
  :{r:'a',k:(m.citations||[]).length?'ok':'nf',t:m.content,citations:m.citations||[],time:fmtTime(m.created_at),n:0,mid:m.id};
async function loadConversations(){
  const r=await apiCall('/chat/conversations?limit=30');
  if(r.ok)S.hist=pageItems(r).map(c=>({id:c.id,title:c.title||'Conversation'}));
}
async function openConversation(id,render=true){
  if(__chatCache.has(id)){
    S.chat=[...__chatCache.get(id)];
    S.conversationId=id;
    if(render){S.view='chat';S.nav=false;R()}
  }
  const r=await apiCall(`/chat/conversations/${id}/messages?limit=100`);
  if(!r.ok){
    if(!__chatCache.has(id))toast('Could not open this conversation. Please try again.');
    return false;
  }
  const msgs=pageItems(r).map(messageView);
  __chatCache.set(id,msgs);
  S.chat=msgs;
  S.conversationId=id;
  if(render){S.view='chat';S.nav=false;R()}
  return true;
}
function newChat(){S.chat=[];S.conversationId=null;S.view='chat';S.nav=false;R()}
  const r=await apiCall(`/chat/conversations/${id}/messages?limit=100`);
  if(!r.ok){toast('Could not open this conversation. Please try again.');return false}
  S.chat=pageItems(r).filter(m=>withinChatWindow(m.created_at)).map(messageView);
  S.conversationId=id;

}

function detail(t,fac){
  const assignedToMe=t.assigned_faculty_id===S.user?.id;
  const canReply=fac&&(S.role==='authority'||assignedToMe);

// Date choices use the browser's local calendar; the server receives instants.
function dateRange(f){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
  let from=null,before=null;
  if(f.date==='today'){from=new Date(y,m,d);before=new Date(y,m,d+1)}
  else if(f.date==='previous_month'){from=new Date(y,m-1,1);before=new Date(y,m,1)}
  else if(f.date==='previous_year'){from=new Date(y-1,0,1);before=new Date(y,0,1)}
  else if(f.date==='custom'){
    if(f.from){const x=new Date(f.from+'T00:00:00');from=x}
    if(f.to){const t=new Date(f.to+'T00:00:00');before=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1)}
  }
  return {from:from?from.toISOString():'',before:before?before.toISOString():''};
}
function listQuery(kind){
  const f=F(kind),p=new URLSearchParams({limit:'100'});
  if(f.academic_year)p.set('academic_year',f.academic_year);
  if(f.batch)p.set('batch_year',f.batch);
  if(f.section)p.set('section',f.section);
  if(f.course)p.set('course_id',f.course);
  if(f.audience)p.set(kind==='ann'?'audience':'visibility',f.audience);
  if(f.scope)p.set('scope',f.scope);
  const r=dateRange(f);if(r.from)p.set('created_from',r.from);if(r.before)p.set('created_before',r.before);
  return p.toString();
}

// Opens a PDF through the server. The request carries the session token; the response is shown from a
// temporary local address, which is released when the dialog closes.
async function openPdf(uuid){
  S.modal={type:'pdf',uuid};S.pdf={state:'loading'};R();
  try{
    const res=await fetch(UB_API_BASE+`/documents/${uuid}/file`,{headers:{Authorization:`Bearer ${localStorage.getItem('ub-token')||''}`}});
    if(!res.ok){
      let message='This PDF cannot be opened right now.';
      try{const j=await res.json();if(typeof j.detail==='string')message=j.detail}catch(e){}
      if(res.status===401)message='Your session has ended. Sign in again to open this PDF.';
      S.pdf={state:'error',message};R();return;
    }
    const url=URL.createObjectURL(await res.blob());
    if(S.pdf?.url)URL.revokeObjectURL(S.pdf.url);
    S.pdf={state:'ready',url};R();
  }catch(e){S.pdf={state:'error',message:'Could not reach the server. Check your connection and try again.'};R()}
}

async function submitPublish(button){
  if(S.actionBusy)return;
  const val=id=>($('#'+id)?.value||'').trim();
  const batch=val('pf-batch');
  if(batch&&!(Number(batch)>=2000&&Number(batch)<=2100)){toast('Batch year must be between 2000 and 2100.');return}
  if(button.dataset.v==='pdf'){
    const title=val('pd-title'),file=$('#pd-file')?.files?.[0];
    if(!title||!file){toast('Enter a title and choose a PDF.');return}
    if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){toast('Choose a PDF file.');return}
    // One click = one POST. The button stays disabled until the answer arrives.
    const body=new FormData();body.append('title',title);body.append('file',file);
    body.append('visibility',$('#pd-vis')?.value||'public_students');body.append('scope',$('#pd-scope')?.value||'university_wide');
    [['academic_year',val('pf-acad')],['batch_year',batch],['section',val('pf-section')],['course_id',$('#pf-course')?.value||''],['source_person',val('pd-source')]].forEach(([k,v])=>{if(v)body.append(k,v)});
    S.actionBusy=true;button.disabled=true;button.textContent='Uploading…';
    const res=await apiCall('/documents',{method:'POST',body});
    S.actionBusy=false;
    if(!res.ok){button.disabled=false;button.textContent='Upload PDF';toast(typeof res.error==='string'?res.error:'Upload failed. Check your access and try again.');return}
    if(res.data&&res.data.id)S.docs=[docView(res.data),...(S.docs||[]).filter(d=>d.uuid!==res.data.id)];
    clearPublishForm();R();toast('PDF uploaded. It is processing; the status updates automatically.');watchDocProcessing();
    return;
  }
  const title=val('pa-title'),text=val('pa-body');
  if(!title||!text){toast('Enter a title and a message.');return}
  const aud=$('#pa-aud')?.value||'all_students';
  const payload={title,body:text,audience:aud,scope:$('#pa-scope')?.value||'campus',category:'Notice',is_important:!!$('#pa-imp')?.checked};
  if(aud==='all_students'){
    if(val('pf-acad'))payload.academic_year=val('pf-acad');

    if(val('pf-section'))payload.section=val('pf-section');
    if($('#pf-course')?.value)payload.course_id=$('#pf-course').value;
    if((S.pubPeople||[]).length)payload.person_ids=S.pubPeople.map(p=>p.id);
  }
  S.actionBusy=true;button.disabled=true;button.textContent='Publishing…';
  const res=await apiCall('/announcements',{method:'POST',body:JSON.stringify(payload)});
  S.actionBusy=false;
  if(!res.ok){button.disabled=false;button.textContent='Publish announcement';toast((typeof res.error==='string'?res.error:'The announcement was not published.')+' Your text is still in the form.');return}
  S.announcements=[{...res.data,c:res.data.category||'Notice',t:res.data.title,b:res.data.body,d:new Date(res.data.created_at).toLocaleDateString(),tone:'blue',big:res.data.is_important,imp:res.data.is_important},...(S.announcements||[])];
  clearPublishForm();R();toast('Announcement published.');
}

// Management Stats: aggregate counts only. No student names, emails, question text or chat contents.
// Gemini usage is shown only where it was recorded; nothing is estimated.
function mgmtView(){
  const a=S.analytics;
  if(!a)return '<div class="pg"><h1 class="ed">Management Stats</h1><p class="mut">Loading aggregate analytics…</p></div>';
  const t=a.ticket_totals||{},g=a.gemini||{};
  const pct=x=>x==null?'—':`${Math.round(x*100)}%`;
  const hrs=x=>x==null?'—':`${x} h`;
  const bars=rows=>{const max=Math.max(1,...rows.map(r=>r.count));return `<div style="display:flex;align-items:flex-end;gap:3px;height:120px">${rows.map(r=>`<div title="${esc(r.day)}: ${r.count}" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="background:var(--navy);opacity:.8;border-radius:3px 3px 0 0;height:${Math.round(r.count/max*100)}%;min-height:${r.count?2:0}px"></div></div>`).join('')}</div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut,#667)"><span>${esc(rows[0]?.day||'')}</span><span>${esc(rows[rows.length-1]?.day||'')}</span></div>`};
  const campuses=(t.campuses||[]).map(c=>`<tr><td>${esc(c.name)}</td><td>${c.total_tickets}</td><td>${c.resolved_tickets}</td><td>${pct(c.resolution_rate)}</td><td>${hrs(c.avg_first_response_hours)}</td></tr>`).join('');
  const usage=g.rows_recorded
    ?`<div class="strip">${[['Answer calls recorded',g.requests],['Input tokens',g.input_tokens??'—'],['Output tokens',g.output_tokens??'—']].map(([l,v])=>`<div class="sti"><div><b>${v}</b><span>${l}</span></div></div>`).join('')}</div>
<p class="mut" style="font-size:13px">Token totals cover only the calls where Gemini returned counts: input for ${g.rows_with_input_tokens} of ${g.rows_recorded} calls, output for ${g.rows_with_output_tokens} of ${g.rows_recorded}.</p>
<p class="mut" style="font-size:13px">Models: ${(g.models||[]).map(esc).join(', ')||'—'}. Recording since ${esc(new Date(g.first_recorded_at).toLocaleString())}.</p>`
    :'<p class="mut">No Gemini usage has been recorded yet.</p>';
  return `<div class="pg wide"><h1 class="ed">Management Stats</h1><p class="sub">Read-only aggregate overview. No student names, emails, question text or chat contents.</p>
<div class="strip">${[['Questions asked',a.questions_total],['Tickets',t.total_tickets],['Resolved',t.resolved_tickets],['Resolution rate',pct(t.resolution_rate)],['Avg first response',hrs(t.avg_first_response_hours)]].map(([l,v])=>`<div class="sti"><div><b>${v??'—'}</b><span>${l}</span></div></div>`).join('')}</div>
<div class="dgrid"><section class="card"><h3>Questions per day (last 30 days, UTC)</h3>${bars(a.questions_by_day||[])}</section><section class="card"><h3>Tickets per day (last 30 days, UTC)</h3>${bars(a.tickets_by_day||[])}</section></div>
<section class="card" style="margin-top:16px"><h3>By campus</h3><div class="tw"><table><tr><th>Campus</th><th>Tickets</th><th>Resolved</th><th>Resolution rate</th><th>Avg first response</th></tr>${campuses||'<tr><td colspan="5" class="mut">No campus data.</td></tr>'}</table></div></section>
<section class="card" style="margin-top:16px"><h3>Gemini answer usage</h3>${usage}<p class="mut" style="font-size:13px">Usage before this feature was deployed was never recorded, so historical usage is unavailable. Embedding calls for documents and questions are not recorded in this version.</p></section></div>`;
  const t=a.ticket_totals||{};
  const pct=x=>x==null?'—':`${Math.round(x*100)}%`;
  const hrs=x=>x==null?'—':`${x} h`;
  // One bar per day, in date order. The range and the total are stated above the chart, and the
  // three date labels below it show the start, middle and end of the range. Zero days stay as empty space.
  const dayText=s=>new Date(s+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
  const bars=(rows,what)=>{
    const n=rows.length,total=rows.reduce((s,r)=>s+(r.count||0),0);
    const range=n?`Last ${n} days: ${dayText(rows[0].day)} to ${dayText(rows[n-1].day)} ${new Date(rows[n-1].day+'T00:00:00Z').getUTCFullYear()} (UTC)`:'No days in range';
    if(!n||!total)return `<p class="mut" style="font-size:13px;margin:0 0 10px">${range}</p><div style="height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:1px dashed #d6dbe6;border-radius:10px"><b style="font-size:26px;color:var(--navy)">0</b><span class="mut" style="font-size:13px">${what} in this period</span></div>`;
    const max=Math.max(...rows.map(r=>r.count||0)),peak=rows.find(r=>r.count===max);
    return `<p class="mut" style="font-size:13px;margin:0 0 4px">${range}</p><p class="mut" style="font-size:13px;margin:0 0 10px">${total} ${what.toLowerCase()} in total. Highest day: ${max} on ${dayText(peak.day)}.</p>
<div style="height:150px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid #d6dbe6">${rows.map(r=>`<div title="${dayText(r.day)}: ${r.count||0} ${what.toLowerCase()}" style="flex:1;height:100%;display:flex;align-items:flex-end"><div style="width:100%;border-radius:3px 3px 0 0;${r.count?`height:${Math.max(3,Math.round(r.count/max*100))}%;background:var(--navy)`:'height:2px;background:#e3e7ef'}"></div></div>`).join('')}</div>
<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut,#667);margin-top:6px"><span>${dayText(rows[0].day)}</span><span>${dayText(rows[Math.floor((n-1)/2)].day)}</span><span>${dayText(rows[n-1].day)}</span></div>`;
  };
  const campuses=(t.campuses||[]).map(c=>`<tr><td>${esc(c.name)}</td><td>${c.total_tickets}</td><td>${c.resolved_tickets}</td><td>${pct(c.resolution_rate)}</td><td>${hrs(c.avg_first_response_hours)}</td></tr>`).join('');
  return `<div class="pg wide"><h1 class="ed">Management Stats</h1><p class="sub">Read-only aggregate overview. No student names, emails, question text or chat contents.</p>
<div class="strip">${[['Questions asked',a.questions_total],['Tickets',t.total_tickets],['Resolved',t.resolved_tickets],['Resolution rate',pct(t.resolution_rate)],['Avg first response',hrs(t.avg_first_response_hours)]].map(([l,v])=>`<div class="sti"><div><b>${v??'—'}</b><span>${l}</span></div></div>`).join('')}</div>
<div class="dgrid"><section class="card"><h3>Questions per day</h3>${bars(a.questions_by_day||[],'Questions')}</section><section class="card"><h3>Tickets per day</h3>${bars(a.tickets_by_day||[],'Tickets')}</section></div>
<section class="card" style="margin-top:16px"><h3>By campus</h3><div class="tw"><table><tr><th>Campus</th><th>Tickets</th><th>Resolved</th><th>Resolution rate</th><th>Avg first response</th></tr>${campuses||'<tr><td colspan="5" class="mut">No campus data.</td></tr>'}</table></div></section>
</div>`;
}

// Render Engine
function R(){
  const a=$('#app'),active=document.activeElement,ae=active?.id;
  const ss=active?.selectionStart,se=active?.selectionEnd;
  const prevScroll=$('.page')?.scrollTop||0;
  const kept=[...document.querySelectorAll('#app input[id],#app textarea[id],#app select[id]')]
    .filter(el=>el.type!=='file').map(el=>({id:el.id,value:el.value,checked:el.checked}));
  let h;
  if(S.scr=='landing')h=landing();else if(S.scr=='login')h=login();else h=S.role=='student'?student():S.role=='faculty'?faculty():placeholder();
  const html=h+(S.modal?modal():'')+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');
  if(html!==window.__lastRenderHtml){
    window.__lastRenderHtml=html;a.innerHTML=html;
    kept.forEach(k=>{
      const el=document.getElementById(k.id);
      if(!el)return;
      if(el.type==='checkbox')el.checked=k.checked;
      else el.value=k.value;
    });
    if(ae){
      const restoredEl=document.getElementById(ae);
      if(restoredEl){
        restoredEl.focus();
        if(typeof ss==='number'&&typeof se==='number'){
          try{restoredEl.setSelectionRange(ss,se)}catch(x){}
        }
      }
    }
  const a=$('#app'),ae=document.activeElement?.id,v=ae?document.activeElement.value:'';let h;
  const prevScroll=$('.page')?.scrollTop||0;
  // Fields in an open dialog and the search box keep what was typed or chosen when the page is redrawn.
  const kept=[...document.querySelectorAll('#app .modal input[id],#app .modal textarea[id],#app .modal select[id],#app .formarea input[id],#app .formarea textarea[id],#app .formarea select[id],#gs')]
    .filter(el=>el.type!=='file').map(el=>({id:el.id,value:el.value,checked:el.checked}));
  if(S.scr=='landing')h=landing();else if(S.scr=='login')h=login();else h=S.role=='student'?student():S.role=='faculty'?faculty():placeholder();
  const html=h+(S.modal?modal():'')+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');
  // Only rewrite the page when its markup actually changed: a refresh with the same data causes no blink.
  if(html!==window.__lastRenderHtml){
    window.__lastRenderHtml=html;a.innerHTML=html;
    kept.forEach(k=>{const el=document.getElementById(k.id);if(!el)return;if(el.type==='checkbox')el.checked=k.checked;else el.value=k.value});
  }
  const t=S.fx=='screen'?a.firstElementChild:S.fx=='view'?$('.main > :last-child'):null;if(t)t.classList.add('fx');S.fx=0;S.chat.forEach(x=>x.n=0);

  else{const pg=$('.page');if(pg)pg.scrollTop=prevScroll}
  initGoogleAuth();
}

// My Queries and the staff ticket list re-check every 15 s: the list (status, assignment) and the open
// ticket (status, replies). A redraw happens only when something changed, and never while a field has
// focus, a write is in flight or a dialog is open, so typed text and the reply draft are not lost.
let detailPollTimer=null;
function watchOpenTicket(){
  clearTimeout(detailPollTimer);detailPollTimer=null;
  if(!S.user||!['tix','queries'].includes(S.view))return;
  detailPollTimer=setTimeout(refreshOpenTicket,15000);
}
function ticketsBusy(){
  const a=document.activeElement;
  return !!(a&&['TEXTAREA','INPUT','SELECT'].includes(a.tagName))||!!S.actionBusy||!!S.modal;
}
async function refreshOpenTicket(){
  detailPollTimer=null;
  if(!S.user||!['tix','queries'].includes(S.view))return;
  if(ticketsBusy()){watchOpenTicket();return}
  const t=S.detail?.ticket;
  const [list,detail]=await Promise.all([
    apiCall('/tickets?limit=50'),
    t?apiCall(`/tickets/${t.uuid}`):Promise.resolve(null)
  ]);
  let changed=false;
  if(list.ok){
    const next=pageItems(list).map(ticketView).map(x=>({...x,dept:deptLabel(x)}));
    const sig=l=>JSON.stringify(l.map(x=>[x.uuid,x.status,x.assigned_faculty_id||null]));
    if(sig(next)!==sig(S.tickets)){S.tickets=next;changed=true}
  }
  if(detail?.ok){
    const next={ticket:{...ticketView(detail.data.ticket),events:detail.data.events||[]},events:detail.data.events||[]};
    const sig=x=>JSON.stringify([x.ticket.status,x.ticket.assigned_faculty_id||null,(x.events||[]).length]);
    if(sig(next)!==sig(S.detail)){S.detail=next;changed=true}
  }
  if(changed&&!ticketsBusy())R();
  watchOpenTicket();
}

    const res=await apiCall('/announcements',{method:'POST',body:JSON.stringify(payload)});
    S.actionBusy=false;
    if(!res.ok){el.disabled=false;el.textContent=label;toast((typeof res.error==='string'?res.error:'The announcement was not published.')+' Your text is still in the form.');return}
    S.modal=null;S.announcements=[{...res.data,c:res.data.category||'Notice',t:res.data.title,b:res.data.body,d:new Date(res.data.created_at).toLocaleDateString(),tone:'blue',big:res.data.is_important,imp:res.data.is_important},...(S.announcements||[])];
    R();toast('Announcement published.');
  }
  else if(a=='mc'){S.modal.out=1;R();setTimeout(()=>{if(S.pdf?.url)URL.revokeObjectURL(S.pdf.url);S.pdf=null;S.modal=null;R()},160)}
  else if(a=='ms'){
    if(S.actionBusy)return;
    const m=S.modal,msg=S.chat[m.i-1],assistantMessage=S.chat[m.i],departmentId=$('#md')?.value||null;
    if(!msg?.mid){toast('The question is missing its server reference. Ask it again, then forward it.');return}
    const label=el.textContent;S.actionBusy=true;el.disabled=true;el.textContent='Submitting…';
    const res=await apiCall(`/chat/messages/${msg.mid}/forward`,{method:'POST',body:JSON.stringify({department_id:departmentId,priority:$('#mp').value,description:$('#mx').value||null})});
    S.actionBusy=false;
    if(!res.ok){el.disabled=false;el.textContent=label;toast(typeof res.error==='string'?res.error:'Could not forward this question. Your text is still in the form.');return}
    if(assistantMessage)assistantMessage.fw=res.data.ticket_number;S.modal={done:res.data.ticket_number};await reloadTicketList();R();
  }
  else if(a=='vt'){S.modal=null;S.view='queries';S.fx='view';R();loadViewData('queries')}
  else if(a=='take-ticket'){
    if(S.actionBusy)return;
    const t=S.detail?.ticket;if(!t)return;
    const label=el.textContent;S.actionBusy=true;el.disabled=true;el.textContent='Taking…';
    const res=await apiCall(`/tickets/${t.uuid}`,{method:'PATCH',body:JSON.stringify({take_ticket:true})});
    S.actionBusy=false;
    if(!res.ok){el.disabled=false;el.textContent=label;toast(typeof res.error==='string'?res.error:'Could not take this ticket.');return}
    applyTicketUpdate(res.data);R();toast('Ticket taken. You can now reply or change its status.');watchOpenTicket();
  }
  else if(a=='respond'||a=='resolve'){
    if(S.actionBusy)return;
    const t=S.detail?.ticket,r=$('#rp')?.value.trim();
    if(!t){toast('Open a ticket first.');return}
    if(a=='respond'&&!r){toast('Write a response first.');return}
    const label=el.textContent;
    S.actionBusy=true;el.disabled=true;el.textContent=a==='resolve'?'Resolving…':'Sending…';
    toast(a==='resolve'?'Resolving ticket…':'Sending response…');
    const res=await apiCall(`/tickets/${t.uuid}`,{method:'PATCH',body:JSON.stringify(a==='resolve'?{status:'resolved'}:{reply:r})});
    S.actionBusy=false;
    if(!res.ok){el.disabled=false;el.textContent=label;toast((typeof res.error==='string'?res.error:'The update failed.')+' Your text is still in the box.');return}
    applyTicketUpdate(res.data);R();
    toast(a=='resolve'?'Ticket resolved. The student can now see the status.':'Response sent. The student can now see it.');
    watchOpenTicket();
  }
});

document.addEventListener('keydown',e=>{
  if(e.key=='Enter'&&e.target.id=='ci'){e.preventDefault();sendChat()}
  if(e.key=='Enter'&&e.target.id=='dq'){e.preventDefault();sendDash()}
  if(e.key=='Enter'&&(e.target.id=='em'||e.target.id=='pw')){e.preventDefault();doLogin()}
  if(e.key=='Enter'&&['on','oa','oc'].includes(e.target.id)){e.preventDefault();document.querySelector('[data-a=onsave]')?.click()}
});
document.addEventListener('input',e=>{if(e.target.id=='gs'){S.fq=e.target.value;R()}});
// Coming back to the tab refreshes My Queries and the staff ticket list at once, not after the next 15 s tick.
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.user&&['tix','queries'].includes(S.view))refreshOpenTicket()});
document.addEventListener('change',e=>{if(e.target.id=='fs'){S.fs=e.target.value;R()}});

// Restore the signed-in session from the backend (the server checks the token)
async function restoreSession(){
  const r=await apiCall('/auth/me');
  if(r.ok&&r.data){
    const me=r.data;
    S.user={id:me.id,email:me.email,name:me.full_name||me.email.split('@')[0],full_name:me.full_name,role:me.role,campus_id:me.campus_id,department_id:me.department_id};
    S.role=me.role;S.scr='app';
    S.view=me.role=='student'?'chat':me.role=='faculty'?'tix':'x';
    R();await loadViewData(S.view);return;
  }else if(r.status===401||r.status===403){
    try{localStorage.removeItem('ub-token')}catch(e){}
  }
  R();
}
// Starts the free server before the user clicks, so a cold start overlaps with the Google sign-in step.
if(UB_API_BASE)fetch(UB_API_BASE+'/health',{cache:'no-store'}).catch(()=>{});
if(localStorage.getItem('ub-token'))restoreSession();

R();
</script></body></html>
