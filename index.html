<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniBuddy — Campus AI Assistant & Query Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./runtime-config.js"></script>
<style>
:root{--bg:#FFFFFF;--ice:#EAF1FC;--lav:#F0EDFF;--bg2:#F4F6FA;--ind:#7187C9;--indd:#5a70b4;--navy:#263653;--deep:#263653;--ink:#263653;--slate:#687386;--bd:#E3E8F0;--sh:0 1px 2px rgba(38,54,83,.05),0 8px 22px -10px rgba(38,54,83,.14);--sh2:0 2px 4px rgba(38,54,83,.05),0 18px 38px -14px rgba(38,54,83,.24);--grad:linear-gradient(180deg,#6b81c3,#4f66a8);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14.5px/1.55 Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}h2{font-size:22px}h3{font-size:15.5px}
.ed{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.02em;line-height:1.15}h1.ed{font-size:clamp(32px,4.5vw,50px)}h2.ed{font-size:clamp(24px,3.2vw,32px)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{height:40px;padding:0 18px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);box-shadow:0 1px 2px rgba(38,54,83,.06);cursor:pointer;font-weight:500;transition:transform .2s,box-shadow .2s,border-color .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:var(--ind)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--grad);color:#fff;border-color:#4a60a0;box-shadow:0 8px 16px -8px rgba(79,102,168,.8),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.sm{height:32px;padding:0 13px;font-size:13px;border-radius:10px}.btn.w{width:100%}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--slate);transition:background .2s,color .2s,transform .2s;position:relative}.ib:hover{background:var(--lav);color:var(--navy)}.ib:active{transform:scale(.93)}
:focus-visible{outline:2px solid var(--ind);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
input,select,textarea{width:100%;height:42px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:0 14px;transition:border-color .2s,box-shadow .2s}textarea{height:auto;padding:11px 14px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ind);box-shadow:0 0 0 4px rgba(113,135,201,.18)}
label{display:block;font-size:13px;font-weight:500;margin:14px 0 6px}
.mut{color:var(--slate)}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#8ea2db,#5f76bb);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;box-shadow:0 5px 10px -4px rgba(113,135,201,.8),inset 0 1px 0 rgba(255,255,255,.4)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;cursor:pointer;letter-spacing:-.02em;color:var(--navy)}
.ico{width:42px;height:42px;border-radius:13px;background:linear-gradient(180deg,#fff,var(--ice));border:1px solid var(--bd);display:grid;place-items:center;color:var(--indd);box-shadow:0 5px 10px -5px rgba(38,54,83,.25),inset 0 1px 0 #fff;flex:none}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:20px}
.tint{background:linear-gradient(180deg,var(--ice),#fff)}
.lift{transition:transform .22s,box-shadow .22s,border-color .22s;cursor:pointer}.lift:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:#cdd8ee}
.fx{animation:fx .25s ease both}@keyframes fx{from{opacity:0;transform:translateY(6px)}}.in{animation:fx .25s ease both}
.lnk{background:none;border:0;cursor:pointer;color:var(--slate);padding:6px 10px;font-weight:500;transition:color .2s}.lnk:hover{color:var(--navy)}
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:99px;background:var(--lav);border:1px solid #e1dbfa;color:var(--indd);font-size:12.5px;font-weight:500;padding:4px 12px}
/* landing */
.land{position:relative;overflow:hidden;min-height:100vh}.land:before,.land:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.land:before{width:560px;height:560px;right:-160px;top:-180px;background:radial-gradient(circle,var(--lav),transparent 68%)}.land:after{width:520px;height:520px;left:-200px;top:260px;background:radial-gradient(circle,var(--ice),transparent 68%)}
.land>*{position:relative;z-index:1}
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px max(20px,5vw);gap:10px}.wrap{max-width:1060px;margin:auto;padding:0 max(20px,4vw)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:56px 0 72px}.hero p{color:var(--slate);font-size:17px;max-width:470px;margin:18px 0 28px}
.stage{position:relative;padding:28px 0 28px 18px}.prev{transform:perspective(1100px) rotateY(-6deg) rotateX(2deg);box-shadow:var(--sh2),0 40px 60px -34px rgba(38,54,83,.3);padding:18px;max-width:430px;margin-left:auto}
.chipf{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:500;box-shadow:var(--sh2);display:flex;gap:6px;align-items:center;color:var(--navy)}.c1{left:-6px;bottom:6px}.c2{right:6px;top:0;background:var(--lav)}
.bento{display:grid;grid-template-columns:1.1fr 1fr 1fr;grid-template-rows:auto auto;gap:14px;padding-bottom:72px}.bt{border-radius:20px;padding:24px;border:1px solid var(--bd);transition:transform .22s,box-shadow .22s;cursor:default}.bt:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.bt p{margin:6px 0 0;color:var(--slate);font-size:14px}.bt .ico{margin-bottom:16px}.bt.tall{grid-row:span 2;background:linear-gradient(160deg,var(--lav),#fff 75%)}.bt.tall h3{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:26px;line-height:1.15;margin-top:6px}.bt.tall p{font-size:15px}
.bt.b{background:var(--ice);grid-column:span 2}.bt.m{background:var(--bg2)}.bt.w{background:#fff}
.how{padding:0 0 72px}.hsteps{display:grid;grid-template-columns:repeat(3,1fr);margin-top:26px;position:relative}.hsteps:before{content:"";position:absolute;left:18px;right:18px;top:18px;height:2px;background:linear-gradient(90deg,var(--ind),#d5dcf1)}
.hs{position:relative;padding-right:24px}.num{width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--ind);color:var(--indd);display:grid;place-items:center;font-weight:600;margin-bottom:14px;position:relative}.hs p{margin:0;max-width:240px}
footer{padding:24px;text-align:center;color:var(--slate);font-size:13px;border-top:1px solid var(--bd)}

/* Redesigned Centered Login Page — matching screenshot visual aesthetic */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px 20px 48px;background:radial-gradient(1100px 520px at 50% -10%,var(--lav),transparent 72%),#ffffff}
.login-header{text-align:center;max-width:540px;margin-bottom:26px}
.login-card{width:100%;max-width:440px;background:#ffffff;border:1px solid var(--bd);border-radius:22px;padding:32px 28px;box-shadow:var(--sh);position:relative}
.g-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:44px;background:#ffffff;border:1px solid var(--bd);border-radius:12px;color:var(--navy);font-weight:500;font-size:14.5px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;box-shadow:0 1px 2px rgba(38,54,83,.05)}
.g-btn:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:#b4c5e7;background:#fafbff}
.g-btn:active{transform:scale(.98)}
.divider{display:flex;align-items:center;margin:18px 0 16px;color:var(--slate);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--bd)}
.divider:before{margin-right:12px}.divider:after{margin-left:12px}

/* Demo Accounts Section */
.demo-section{width:100%;max-width:960px;margin-top:44px}
.demo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}
.demo-card{background:#ffffff;border:1px solid var(--bd);border-radius:20px;padding:22px 18px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
.demo-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--ind)}
.demo-card.t-lav{background:var(--lav);border-color:#d5cef7}
.demo-card.t-ice{background:var(--ice);border-color:#cddaf5}
.demo-card h3{font-size:16px;font-weight:600;color:var(--navy);margin-top:6px}
.demo-card p{font-size:13px;color:var(--slate);line-height:1.45;margin:0;flex:1}
.demo-card .demo-badge{font-size:11.5px;color:var(--slate);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(38,54,83,.05);padding:3px 8px;border-radius:6px;width:fit-content;margin:4px 0}
.demo-card .btn{background:#ffffff;border:1px solid var(--bd);color:var(--navy);font-weight:500;margin-top:8px}
.demo-card:hover .btn{border-color:var(--ind);background:linear-gradient(180deg,#ffffff,var(--ice))}
.demo-card.t-lav .btn{background:#ffffff}
@media(max-width:860px){.demo-grid{grid-template-columns:repeat(2,1fr)}.login-wrap{padding:32px 16px}}
@media(max-width:520px){.demo-grid{grid-template-columns:1fr}}

/* App Shell */
.app{display:flex;height:100vh;height:100dvh}
.side{width:262px;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px;flex:none;transition:transform .22s}.side .logo{padding:2px 8px 18px}
.si{display:flex;align-items:center;gap:11px;width:100%;height:40px;padding:0 12px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--slate);text-align:left;transition:background .2s,color .2s,transform .2s;position:relative}
.si:hover{background:var(--bg2);color:var(--navy)}.si:active{transform:scale(.98)}.si.on{background:var(--lav);color:var(--indd);font-weight:600}.si.on:before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ind)}
.si.nc{background:var(--grad);color:#fff;font-weight:500;margin-bottom:14px;box-shadow:0 8px 16px -8px rgba(79,102,168,.9),inset 0 1px 0 rgba(255,255,255,.3);justify-content:center}.si.nc:hover{filter:brightness(1.06);color:#fff}
.sh{font-size:12px;color:var(--slate);padding:16px 12px 6px;font-weight:500}.hist{overflow:auto;flex:1;min-height:60px}.hist .si{height:34px;font-size:13.5px}.hist .si span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof{border-top:1px solid var(--bd);padding-top:12px;margin-top:10px}.prof .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#8ea2db,#5f76bb);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:radial-gradient(800px 280px at 75% -80px,var(--lav),transparent 70%),#fff}
.hd{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none;position:relative;border-bottom:1px solid var(--bd);background:rgba(255,255,255,.7);backdrop-filter:blur(8px)}
.menu{display:none}.on-ind{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--slate)}.pu{width:8px;height:8px;border-radius:50%;background:#58b394;animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(88,179,148,.45)}50%{box-shadow:0 0 0 5px rgba(88,179,148,0)}}
.page{flex:1;overflow:auto;padding:30px max(16px,3vw)}.pg{max-width:880px;margin:auto}.pg.wide{max-width:980px}

/* Chat */
.chatw{flex:1;display:flex;flex-direction:column;min-height:0}.msgs{flex:1;overflow:auto;padding:24px 16px}.col{max-width:740px;margin:auto}
.empty{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-bottom:30px}
.welcome{position:relative;padding:34px 30px 30px;border-radius:28px;background:radial-gradient(closest-side at 50% 30%,var(--lav),transparent),radial-gradient(closest-side at 80% 90%,var(--ice),transparent);width:100%}.welcome .mark{width:54px;height:54px;border-radius:17px;font-size:23px;margin:0 auto 16px}.welcome p{color:var(--slate);margin:8px 0 22px;font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px;margin:auto}.chip{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:99px;padding:9px 16px 9px 12px;font-weight:500;font-size:13.5px;cursor:pointer;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}.chip svg{color:var(--indd)}.chip:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--ind);background:var(--lav)}.chip:active{transform:scale(.97)}
.u{display:flex;justify-content:flex-end;margin:20px 0 4px}.ub{background:var(--lav);border:1px solid #e1dbfa;color:var(--navy);padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:80%}
.ts{font-size:11.5px;color:var(--slate);margin-top:4px;opacity:.85}.tsr{text-align:right}
.a{display:flex;gap:12px;margin:18px 0}.a .body{flex:1;min-width:0}.a .who{font-weight:600;font-size:13.5px;margin-bottom:2px}
.vb{display:inline-flex;align-items:center;gap:5px;background:var(--ice);color:var(--indd);border:1px solid #d3e0f6;border-radius:99px;padding:2px 10px 2px 8px;font-size:12px;font-weight:600}
.ans ul,.ans ol{margin:6px 0 6px 20px;padding:0}.ans li{margin:3px 0}.ans p{margin:0 0 8px}.ans p:last-child{margin-bottom:0}
.src{margin-top:10px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;background:var(--bg2);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--slate);border-left:3px solid var(--ind)}.src button{color:var(--indd);font-weight:600;background:none;border:0;cursor:pointer;padding:0;text-decoration:underline}
.nf{margin-top:12px;background:var(--lav);border:1px solid #e1dbfa;border-radius:14px;padding:14px}
.ld{display:inline-flex;gap:5px;padding:10px 0}.ld span{width:7px;height:7px;border-radius:50%;background:var(--ind);animation:bl 1.2s infinite}.ld span:nth-child(2){animation-delay:.18s}.ld span:nth-child(3){animation-delay:.36s}@keyframes bl{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.comp{padding:0 16px 14px}.cbox{max-width:740px;margin:auto;border:1px solid var(--bd);border-radius:20px;display:flex;align-items:center;gap:4px;padding:8px 8px 8px 6px;background:#fff;box-shadow:var(--sh2);transition:border-color .2s,box-shadow .2s}.cbox:focus-within{border-color:var(--ind);box-shadow:0 0 0 4px rgba(113,135,201,.16),var(--sh2)}
.cbox input{border:0;height:42px;flex:1;box-shadow:none!important;background:none}.send{width:40px;height:40px;border-radius:13px;border:0;background:var(--grad);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 12px -5px rgba(79,102,168,.8),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .2s}.send:hover{transform:translateY(-1px)}.send:active{transform:scale(.92)}
.note{text-align:center;font-size:12px;color:var(--slate);margin-top:8px;opacity:.85}

/* Dashboard Editorial */
.sub{color:var(--slate);margin:8px 0 0;font-size:15.5px}
.askp{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:center;margin:26px 0 8px;padding:22px 24px;border-radius:22px;background:linear-gradient(120deg,var(--lav),var(--ice));border:1px solid #e1e6f7;box-shadow:var(--sh)}.askp p{margin:4px 0 0;color:var(--slate);font-size:13.5px}
.strip{display:flex;margin:22px 0 10px;border-bottom:1px solid var(--bd);padding-bottom:20px}.sti{flex:1;display:flex;gap:12px;align-items:center;padding:0 20px;border-left:1px solid var(--bd);cursor:pointer;transition:transform .2s}.sti:first-child{border:0;padding-left:0}.sti:hover{transform:translateY(-2px)}.sti b{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:32px;line-height:1;display:block}.sti span{font-size:12.5px;color:var(--slate)}.sti .ic{width:34px;height:34px;border-radius:10px;background:var(--ice);display:grid;place-items:center;color:var(--indd)}
.dgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:36px;margin:22px 0}.sh2{font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.feat1{border-radius:16px;padding:18px;background:linear-gradient(150deg,var(--lav),#fff);border:1px solid #e1dbfa;margin-bottom:6px;transition:transform .2s,box-shadow .2s;cursor:pointer}.feat1:hover{transform:translateY(-2px);box-shadow:var(--sh)}.feat1 h3{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:19px;margin:8px 0 2px}
.cat{font-size:12px;font-weight:600;color:var(--indd)}.dt{font-size:12px;color:var(--slate)}
.hrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}.hrow:last-child{border:0}.hrow span:first-child{display:flex;flex-direction:column}
.dl{position:relative;padding-left:20px}.dl:before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--ind),#dfe5f5)}.dli{position:relative;padding:0 0 16px}.dli:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ind)}.dli b{font-weight:600;display:block}.dli small{color:var(--slate);font-size:12.5px}
.qp{background:var(--bg2);border-radius:18px;padding:6px 18px}.qr{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer;transition:padding .2s}.qr:last-child{border:0}.qr:hover{padding-left:6px}.qr small{color:var(--slate);font-weight:500}

/* Announcements Magazine */
.mag{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:24px}.am{border-radius:20px;padding:22px;border:1px solid var(--bd);grid-column:span 2;transition:transform .22s,box-shadow .22s;display:flex;flex-direction:column;gap:6px}.am:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.am.big{grid-column:span 4;grid-row:span 2;padding:30px;justify-content:flex-end;min-height:260px}.am.big h3{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:30px;line-height:1.12}.am:nth-child(4),.am:nth-child(5){grid-column:span 3}
.am.lav{background:linear-gradient(150deg,var(--lav),#fff 85%)}.am.blue{background:linear-gradient(150deg,var(--ice),#fff 85%)}.am.mist{background:var(--bg2)}.am p{margin:0;color:var(--slate);font-size:13.5px}
.imp{align-self:flex-start;background:var(--indd);color:#fff;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 10px}

/* Tables & Tickets */
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-weight:500;font-size:12.5px;color:var(--slate);padding:10px 12px;background:var(--bg2);white-space:nowrap}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}td{padding:12px;border-bottom:1px solid var(--bd)}
table{min-width:620px}.card .tw{padding-bottom:6px}tr.rw{cursor:pointer;transition:background .2s}tr.rw:hover,tr.rw.on{background:var(--lav)}.tw{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--bg2);color:var(--slate)}.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.s1{background:var(--ice);color:#4a68a8}.pill.s2{background:var(--lav);color:#6a58b8}.pill.s3{background:#e3f3ec;color:#2f7d62}
.pri{font-size:12.5px;font-weight:500}.pri.High{color:var(--indd);font-weight:700}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:18px}.two>div{display:grid;gap:16px;align-content:start}.lab{font-size:12.5px;color:var(--slate)}

.ub-landing {
  --bg: #f4f8ff;
  --card: rgba(255, 255, 255, 0.72);
  --solid: #ffffff;
  --tx: #0b1b3a;
  --mu: #586887;
  --bd: rgba(37, 99, 235, 0.16);
  --b1: #2563eb;
  --b2: #38bdf8;
  --sh: 0 10px 40px -12px rgba(37, 99, 235, 0.28);
  --g: linear-gradient(135deg, #2a4fd8, #3b9bf7);
  box-sizing: border-box;
  color-scheme: light;
  background: var(--bg);
  color: var(--tx);
  font: 16px/1.6 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
  position: relative;
  width: 100%;
  min-height: 100vh;
}
:root[data-theme="dark"] .ub-landing, [data-theme="dark"] .ub-landing {
  --bg: #060d1f;
  --card: rgba(20, 32, 64, 0.62);
  --solid: #101c3a;
  --tx: #e8efff;
  --mu: #9db0d3;
  --bd: rgba(96, 165, 250, 0.2);
  --sh: 0 10px 40px -12px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .ub-landing {
    --bg: #060d1f;
    --card: rgba(20, 32, 64, 0.62);
    --solid: #101c3a;
    --tx: #e8efff;
    --mu: #9db0d3;
    --bd: rgba(96, 165, 250, 0.2);
    --sh: 0 10px 40px -12px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
.ub-landing * {
  box-sizing: border-box;
  margin: 0;
}
.ub-landing a {
  color: inherit;
  text-decoration: none;
}
.ub-landing section {
  padding: 96px 24px;
  position: relative;
}
.ub-landing .w {
  max-width: 1180px;
  margin: auto;
}
.ub-landing h1, .ub-landing h2, .ub-landing h3 {
  line-height: 1.12;
  letter-spacing: -0.02em;
  margin: 0;
}
.ub-landing h1 {
  font-size: clamp(38px, 5.6vw, 68px);
  font-weight: 800;
}
.ub-landing h2 {
  font-size: clamp(30px, 4vw, 48px);
  font-weight: 800;
  text-align: center;
}
.ub-landing .grad {
  background: var(--g);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  background-size: 200%;
  animation: ub_gs 6s ease infinite;
}
@keyframes ub_gs {
  50% { background-position: 100% 0; }
}
.ub-landing .sub {
  color: var(--mu);
  text-align: center;
  max-width: 680px;
  margin: 14px auto 48px;
}
.ub-landing .tag {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--b1);
  background: var(--card);
  border: 1px solid var(--bd);
  padding: 5px 12px;
  border-radius: 99px;
  margin-bottom: 14px;
}
.ub-landing .c {
  text-align: center;
}
.ub-landing .lg {
  background: #fff;
  border-radius: 24%;
  overflow: hidden;
  isolation: isolate;
  display: inline-block;
  flex: none;
  box-shadow: var(--sh);
}
.ub-landing .lg img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.ub-landing .glass {
  background: var(--card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--bd);
  border-radius: 22px;
  box-shadow: var(--sh);
}
.ub-landing .btn {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  padding: 14px 26px;
  border-radius: 14px;
  font: 700 15px inherit;
  font-family: inherit;
  border: 1px solid var(--bd);
  cursor: pointer;
  transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
  color: var(--tx);
  background: var(--card);
  height: auto;
  box-shadow: none;
}
.ub-landing .btn.p {
  background: var(--g);
  color: #fff;
  border: 0;
  box-shadow: 0 10px 30px -8px rgba(37, 99, 235, 0.6);
}
.ub-landing .btn:hover {
  transform: translateY(-3px);
}
.ub-landing nav {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: 12px 24px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  background: var(--card);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--bd);
}
.ub-landing nav .w {
  display: flex;
  align-items: center;
  gap: 24px;
}
.ub-landing nav b {
  font-size: 20px;
  font-weight: 800;
  display: flex;
  gap: 10px;
  align-items: center;
}
.ub-landing nav .l {
  margin-left: auto;
  display: flex;
  gap: 26px;
  font-weight: 600;
  font-size: 14px;
  color: var(--mu);
}
.ub-landing nav .l a:hover {
  color: var(--b1);
}
.ub-landing nav .btn {
  padding: 9px 18px;
  font-size: 14px;
}
.ub-landing #th {
  padding: 9px 12px;
}
.ub-landing .blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  opacity: 0.45;
  background: var(--g);
  pointer-events: none;
  animation: ub_fl 9s ease-in-out infinite;
}
@keyframes ub_fl {
  50% { transform: translateY(-30px) scale(1.06); }
}
.ub-landing .hero {
  min-height: calc(100vh - 66px);
  display: flex;
  align-items: center;
  overflow: hidden;
}
.ub-landing .hero .w {
  display: grid;
  grid-template-columns: 1fr 1.05fr;
  gap: 48px;
  align-items: center;
  position: relative;
  z-index: 1;
}
.ub-landing .hero p {
  color: var(--mu);
  font-size: 18px;
  margin: 22px 0 32px;
  max-width: 520px;
}
.ub-landing .hero .bt {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.ub-landing .hl {
  animation: ub_pop 1s cubic-bezier(0.2, 1.4, 0.4, 1) both;
  margin-bottom: 22px;
}
@keyframes ub_pop {
  from { opacity: 0; transform: scale(0.3) rotate(-20deg); }
}
.ub-landing .stage {
  position: relative;
  padding: 30px 0;
}
.ub-landing .chat {
  padding: 0;
  overflow: hidden;
  position: relative;
}
.ub-landing .ch {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 14px 18px;
  border-bottom: 1px solid var(--bd);
  font-weight: 700;
  font-size: 14px;
}
.ub-landing .ch i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #22c55e;
  margin-left: auto;
  box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2);
}
.ub-landing .msgs {
  height: 300px;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scrollbar-width: none;
}
.ub-landing .m {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.5;
  animation: ub_mp 0.45s cubic-bezier(0.2, 1.3, 0.4, 1) both;
}
@keyframes ub_mp {
  from { opacity: 0; transform: translateY(14px) scale(0.9); }
}
.ub-landing .m.u {
  align-self: flex-end;
  background: var(--g);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.ub-landing .m.b {
  align-self: flex-start;
  background: var(--solid);
  border: 1px solid var(--bd);
  border-bottom-left-radius: 4px;
}
.ub-landing .ty {
  display: flex;
  gap: 4px;
  padding: 14px;
}
.ub-landing .ty s {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--b1);
  opacity: 0.4;
  animation: ub_ty 1s infinite;
}
.ub-landing .ty s:nth-child(2) { animation-delay: 0.15s; }
.ub-landing .ty s:nth-child(3) { animation-delay: 0.3s; }
@keyframes ub_ty {
  40% { transform: translateY(-5px); opacity: 1; }
}
.ub-landing .mc {
  display: flex;
  gap: 8px;
  align-self: flex-start;
  flex-wrap: wrap;
  animation: ub_mp 0.5s both;
}
.ub-landing .mc span {
  font-size: 12px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 10px;
  background: var(--solid);
  border: 1px solid var(--bd);
}
.ub-landing .inp {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid var(--bd);
}
.ub-landing .inp input {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--bd);
  background: var(--solid);
  color: var(--tx);
  border-radius: 12px;
  padding: 10px 14px;
  font: inherit;
  font-size: 14px;
}
.ub-landing .inp button {
  padding: 10px 16px;
}
.ub-landing .fc {
  position: absolute;
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  gap: 8px;
  align-items: center;
  animation: ub_fl 6s ease-in-out infinite;
  z-index: 2;
}
.ub-landing .fc em {
  font-style: normal;
  font-size: 18px;
}
.ub-landing .eco {
  position: relative;
  width: min(100%, 540px);
  aspect-ratio: 1;
  margin: auto;
  --cw: 23%;
}
.ub-landing .eco svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.ub-landing .ln {
  fill: none;
  stroke: var(--b1);
  stroke-width: 0.45;
  stroke-linecap: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  opacity: 0.5;
  transition: stroke-dashoffset 1.1s cubic-bezier(0.4, 0, 0.2, 1);
}
.ub-landing .eco.on .ln {
  stroke-dashoffset: 0;
}
.ub-landing .pl {
  fill: none;
  stroke: var(--b2);
  stroke-width: 0.8;
  stroke-linecap: round;
  stroke-dasharray: 0.14 0.86;
  stroke-dashoffset: 0.14;
  opacity: 0;
  filter: drop-shadow(0 0 1.5px var(--b2));
}
.ub-landing .eco.on .pl {
  opacity: 0.9;
  animation: ub_pls 3s linear infinite both;
}
@keyframes ub_pls {
  from { stroke-dashoffset: 0.14; }
  to { stroke-dashoffset: -0.86; }
}
.ub-landing .dots {
  opacity: 0;
  transition: opacity 0.6s 1.5s;
}
.ub-landing .eco.on .dots {
  opacity: 1;
}
.ub-landing .dt {
  fill: var(--b2);
  filter: drop-shadow(0 0 2px var(--b2));
}
.ub-landing .nd {
  position: absolute;
  width: var(--cw);
  aspect-ratio: 3 / 2;
  transform: translate(-50%, -50%);
  opacity: 0;
  scale: 0.55;
  transition: opacity 0.7s, scale 0.8s cubic-bezier(0.2, 1.4, 0.4, 1);
  z-index: 1;
}
.ub-landing .eco.on .nd {
  opacity: 1;
  scale: 1;
}
.ub-landing .ni {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 4px 6px;
  text-align: center;
  font-weight: 700;
  font-size: clamp(10px, 2.6vw, 13px);
  line-height: 1.25;
  background: var(--solid);
  border-radius: 18px;
  animation: ub_fl2 6s ease-in-out infinite;
  transition: transform 0.3s, scale 0.3s, box-shadow 0.3s;
}
.ub-landing .ni:hover {
  transform: translateY(-5px);
  scale: 1.07;
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.35), var(--sh);
}
.ub-landing .ni em {
  font-style: normal;
  font-size: clamp(17px, 4vw, 24px);
  line-height: 1;
}
@keyframes ub_fl2 {
  50% { translate: 0 -7px; }
}
.ub-landing .ctrw {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 21%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  z-index: 2;
  opacity: 0;
  scale: 0.5;
  transition: opacity 0.8s, scale 0.9s cubic-bezier(0.2, 1.4, 0.4, 1);
}
.ub-landing .eco.on .ctrw {
  opacity: 1;
  scale: 1;
}
.ub-landing .ctr {
  width: 100%;
  height: 100%;
  border-radius: 24%;
  animation: ub_cf 5s ease-in-out infinite, ub_cg 3s ease-in-out infinite;
}
@keyframes ub_cf {
  50% { translate: 0 -6px; scale: 1.04; }
}
@keyframes ub_cg {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.5), 0 0 30px rgba(37, 99, 235, 0.35);
  }
  50% {
    box-shadow: 0 0 0 22px rgba(56, 189, 248, 0), 0 0 46px rgba(56, 189, 248, 0.55);
  }
}
@media (max-width: 860px) {
  .ub-landing .eco {
    width: min(100%, 440px);
    --cw: 26%;
  }
  .ub-landing .ctrw {
    width: 23%;
  }
}
@media (max-width: 400px) {
  .ub-landing .eco {
    --cw: 28%;
  }
}
@media (prefers-reduced-motion: reduce) {
  .ub-landing .dots, .ub-landing .pl { display: none; }
  .ub-landing .nd, .ub-landing .ctrw { opacity: 1; scale: 1; }
  .ub-landing .ln { stroke-dashoffset: 0; }
}

.ub-landing .grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}
.ub-landing .fcard {
  padding: 22px;
  position: relative;
  overflow: hidden;
  transition: transform 0.3s, box-shadow 0.3s;
}
.ub-landing .fcard:hover {
  transform: translateY(-6px);
}
.ub-landing .fcard:before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0), rgba(56, 189, 248, 0.2), transparent 60%);
  opacity: 0;
  transition: 0.3s;
}
.ub-landing .fcard:hover:before {
  opacity: 1;
}
.ub-landing .fcard h3 {
  font-size: 18px;
  margin: 16px 0 6px;
}
.ub-landing .fcard p {
  color: var(--mu);
  font-size: 14px;
}
.ub-landing .vis {
  height: 150px;
  border-radius: 14px;
  background: linear-gradient(160deg, rgba(37, 99, 235, 0.09), rgba(56, 189, 248, 0.14));
  padding: 12px;
  position: relative;
  overflow: hidden;
  font-size: 11.5px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  gap: 7px;
  justify-content: center;
}
.ub-landing .vis .x {
  background: var(--solid);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 6px 10px;
  display: flex;
  gap: 6px;
  align-items: center;
}
.ub-landing .pm {
  animation: ub_pm 6s infinite both;
}
.ub-landing .pm:nth-child(2) { animation-delay: 1.2s; }
.ub-landing .pm:nth-child(3) { animation-delay: 2.4s; }
@keyframes ub_pm {
  0% { opacity: 0; transform: translateY(12px); }
  10%, 90% { opacity: 1; transform: none; }
  100% { opacity: 0; }
}
.ub-landing .dc {
  animation: ub_fl 4s ease-in-out infinite;
}
.ub-landing .dc:nth-child(2) { animation-delay: -1.3s; margin-left: 22px; }
.ub-landing .dc:nth-child(3) { animation-delay: -2.6s; margin-left: 44px; }
.ub-landing .sr {
  overflow: hidden;
  white-space: nowrap;
  width: 0;
  animation: ub_ty2 5s steps(18) infinite;
}
@keyframes ub_ty2 {
  0% { width: 0; }
  35%, 100% { width: 17ch; }
}
.ub-landing .rs {
  animation: ub_pm 5s infinite both;
  animation-delay: 1.8s;
}
.ub-landing .tk {
  display: flex;
  justify-content: space-between;
  position: relative;
  padding: 0 6px;
  margin: 6px 0;
}
.ub-landing .tk:before, .ub-landing .tk:after {
  content: "";
  position: absolute;
  left: 18px;
  right: 18px;
  top: 11px;
  height: 3px;
  background: var(--bd);
}
.ub-landing .tk:after {
  background: var(--g);
  right: auto;
  width: 0;
  animation: ub_pg 5s infinite;
}
@keyframes ub_pg {
  0% { width: 0; }
  50%, 100% { width: calc(100% - 36px); }
}
.ub-landing .tk span {
  z-index: 1;
  text-align: center;
  font-size: 10px;
}
.ub-landing .tk b {
  display: block;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--solid);
  border: 2px solid var(--b1);
  margin: 0 auto 3px;
}
.ub-landing select {
  font: inherit;
  font-size: 11px;
  background: var(--solid);
  color: var(--tx);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 4px;
  width: 100%;
}
.ub-landing .sel {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.ub-landing .rl {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.ub-landing .rl div {
  background: var(--solid);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 6px;
  text-align: center;
  transition: 0.3s;
  font-size: 10.5px;
  line-height: 1.5;
}
.ub-landing .rl div:hover {
  background: var(--b1);
  color: #fff;
  transform: scale(1.06);
}
.ub-landing .rl b {
  display: block;
  font-size: 11.5px;
}
.ub-landing .dm {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  align-items: center;
}
.ub-landing .chips {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 20px;
}
.ub-landing .chips button {
  font: 600 13px inherit;
  font-family: inherit;
  padding: 9px 14px;
  border-radius: 99px;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  cursor: pointer;
  transition: 0.2s;
}
.ub-landing .chips button:hover {
  background: var(--b1);
  color: #fff;
}
.ub-landing .steps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  position: relative;
}
.ub-landing .steps:before {
  content: "";
  position: absolute;
  top: 28px;
  left: 12%;
  right: 12%;
  height: 3px;
  background: repeating-linear-gradient(90deg, var(--b2) 0 8px, transparent 8px 16px);
  animation: ub_bg 1s linear infinite;
}
@keyframes ub_bg {
  to { background-position: 16px 0; }
}
.ub-landing .st {
  padding: 24px 20px;
  text-align: center;
  position: relative;
}
.ub-landing .st .n {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--g);
  color: #fff;
  font-weight: 800;
  font-size: 20px;
  display: grid;
  place-items: center;
  margin: -52px auto 14px;
  box-shadow: 0 0 0 6px var(--bg), 0 0 26px rgba(56, 189, 248, 0.7);
}
.ub-landing .st h3 {
  font-size: 17px;
}
.ub-landing .st p {
  color: var(--mu);
  font-size: 14px;
  margin-top: 8px;
}
.ub-landing .who {
  padding: 28px;
  transition: 0.3s;
}
.ub-landing .who:hover {
  transform: translateY(-8px) rotate(-0.4deg);
}
.ub-landing .who em {
  font-style: normal;
  font-size: 32px;
}
.ub-landing .who h3 {
  margin: 10px 0 14px;
}
.ub-landing .who li {
  list-style: none;
  padding: 6px 0 6px 26px;
  position: relative;
  color: var(--mu);
  font-size: 14.5px;
}
.ub-landing .who li:before {
  content: "✓";
  position: absolute;
  left: 0;
  color: var(--b1);
  font-weight: 800;
}
.ub-landing .cta {
  overflow: hidden;
  text-align: center;
}
.ub-landing .cta .box {
  padding: 72px 24px;
  position: relative;
  overflow: hidden;
  background: var(--g);
  color: #fff;
  border-radius: 36px;
}
.ub-landing .cta .box p {
  opacity: 0.9;
  max-width: 560px;
  margin: 16px auto 30px;
}
.ub-landing .cta h2 {
  color: #fff;
}
.ub-landing .cta .btn {
  border: 0;
}
.ub-landing .cta .btn.p {
  background: #fff;
  color: #1d3fbf;
}
.ub-landing .cta .btn:not(.p) {
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.4);
}
.ub-landing .fa {
  position: absolute;
  font-size: 34px;
  opacity: 0.35;
  animation: ub_fl 6s ease-in-out infinite;
}
.ub-landing footer {
  padding: 48px 24px;
  border-top: 1px solid var(--bd);
}
.ub-landing footer .w {
  display: flex;
  gap: 24px;
  justify-content: space-between;
  flex-wrap: wrap;
  align-items: flex-start;
}
.ub-landing footer p {
  color: var(--mu);
  font-size: 14px;
  max-width: 320px;
  margin-top: 10px;
}
.ub-landing footer .l {
  display: flex;
  gap: 22px;
  flex-wrap: wrap;
  font-size: 14px;
  font-weight: 600;
  color: var(--mu);
}
.ub-landing footer a:hover {
  color: var(--b1);
}
.ub-landing dialog {
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 28px;
  background: var(--solid);
  color: var(--tx);
  max-width: 420px;
  box-shadow: var(--sh);
}
.ub-landing dialog::backdrop {
  background: rgba(6, 13, 31, 0.5);
  backdrop-filter: blur(4px);
}
.ub-landing .rv {
  opacity: 0;
  transform: translateY(34px);
  transition: opacity 0.8s, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.ub-landing .rv.on {
  opacity: 1;
  transform: none;
}
@media (max-width: 860px) {
  .ub-landing .hero .w, .ub-landing .dm {
    grid-template-columns: 1fr;
  }
  .ub-landing .steps {
    grid-template-columns: 1fr 1fr;
    row-gap: 56px;
  }
  .ub-landing .steps:before {
    display: none;
  }
  .ub-landing nav .l {
    display: none;
  }
  .ub-landing nav .btn.p {
    margin-left: auto;
  }
  .ub-landing .fc {
    display: none;
  }
  .ub-landing section {
    padding: 72px 18px;
  }
}
@media (max-width: 520px) {
  .ub-landing .steps {
    grid-template-columns: 1fr;
  }
}
@media (prefers-reduced-motion: reduce) {
  .ub-landing *, .ub-landing *:before, .ub-landing *:after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .ub-landing .rv {
    opacity: 1;
    transform: none;
  }
}

/* ---------- UniBuddy New Login Design (Scoped) ---------- */
.ub-login{--blue:#2455E8;--sky:#45A5F5;--navy:#142D63;--light:#EEF5FF;--line:#d5e3fb;--muted:#5b6b8c;--err:#d93f4c;color-scheme:light;box-sizing:border-box;margin:0;min-height:100vh;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--navy);background:#2455E8;overflow-x:hidden;position:relative}
.ub-login *, .ub-login *::before, .ub-login *::after{box-sizing:border-box}
.ub-login svg, .ub-login img{display:block}

/* ---------- Background ---------- */
.ub-login .bg{position:fixed;inset:0;overflow:hidden;z-index:0;background:linear-gradient(135deg,#1b44cf,#2455E8 38%,#45A5F5 78%,#86c8ff);background-size:200% 200%;animation:bgm 24s ease-in-out infinite}
@keyframes bgm{0%,100%{background-position:0 0}50%{background-position:100% 100%}}
.ub-login .navy{position:absolute;will-change:transform}
.ub-login .n1{left:-12%;bottom:-14%;width:85vw;animation:d1 26s ease-in-out infinite}
.ub-login .n2{right:-10%;top:-8%;width:75vw;animation:d2 30s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(4vw,-3vh) rotate(-2deg)}}
@keyframes d2{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-4vw,4vh) rotate(2deg)}}
.ub-login .glow{position:absolute;border-radius:50%;filter:blur(50px);background:radial-gradient(circle,rgba(255,255,255,.75),transparent 70%);will-change:transform}
.ub-login .g1{width:520px;height:520px;left:8%;top:-18%;animation:d1 20s ease-in-out infinite}
.ub-login .g2{width:440px;height:440px;right:2%;bottom:-14%;opacity:.7;animation:d2 24s ease-in-out infinite}
.ub-login .lines{position:absolute;inset:0;width:100%;height:100%}
.ub-login .lines path{fill:none;stroke:rgba(255,255,255,.45);stroke-width:1.5;stroke-dasharray:4 10;animation:dash 14s linear infinite}
@keyframes dash{to{stroke-dashoffset:-140}}
.ub-login .sq,.ub-login .decor>*{background:rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.6);box-shadow:0 18px 44px rgba(20,45,99,.28),inset 0 1px 0 rgba(255,255,255,.6)}
.ub-login .sq{position:absolute;border-radius:20px;will-change:transform;animation:sqf 14s ease-in-out infinite}
@keyframes sqf{0%,100%{transform:translate(0,0) rotate(var(--r,0deg))}35%{transform:translate(14px,-22px) rotate(calc(var(--r,0deg) + 5deg))}70%{transform:translate(-10px,12px) rotate(calc(var(--r,0deg) - 4deg))}}

/* ---------- Layout ---------- */
.ub-login .wrap{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:4vh 0}
.ub-login .stage{position:relative;width:82vw;max-width:1280px}
.ub-login .panel{position:relative;z-index:2;display:grid;grid-template-columns:55fr 45fr;min-height:min(82vh,700px);background:#fff;border-radius:28px;box-shadow:0 50px 100px -24px rgba(10,30,90,.6),0 0 0 6px rgba(255,255,255,.28);opacity:0;animation:panelin 1s .1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes panelin{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- Showcase (left) ---------- */
.ub-login .showcase{position:relative;padding:14px}
.ub-login .showcase::before{content:"";position:absolute;inset:14px;border-radius:22px;background:linear-gradient(160deg,#EEF5FF,#fafcff 60%,#e3eeff)}
.ub-login .sc{position:relative;height:100%;display:flex;flex-direction:column;padding:14px 22px 22px}
.ub-login .brandbar{display:flex;align-items:center;gap:12px;height:62px}
.ub-login .slot{position:relative;z-index:6;width:46px;height:46px;opacity:0}
.ub-login .slot::before{content:"";position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle,rgba(69,165,245,.55),transparent 68%);animation:glow 5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.5;transform:scale(.95)}50%{opacity:1;transform:scale(1.1)}}
.ub-login .lg{position:relative;width:100%;height:100%;object-fit:contain;animation:float 6s ease-in-out infinite}
.ub-login .hero{position:relative;z-index:5;width:112px;height:112px;margin:0 auto 6px;opacity:0}
.ub-login .hero::before{content:"";position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(69,165,245,.5),transparent 68%);animation:glow 5s ease-in-out infinite}
.ub-login .hero .lg{animation-duration:7s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ub-login .word{font-weight:800;font-size:19px;letter-spacing:-.01em;opacity:0;transform:translateX(-8px);transition:opacity .8s,transform .8s;color:var(--navy)}
.ub-login .word span{color:var(--blue)}.ub-login .word.on{opacity:1;transform:none}
.ub-login .chat{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:470px;margin:0 auto}
.ub-login .chip{align-self:center;display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:6px 14px 6px 8px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);box-shadow:0 6px 16px rgba(36,85,232,.08)}
.ub-login .chip img{width:22px;height:22px;object-fit:contain}.ub-login .chip i{width:7px;height:7px;border-radius:50%;background:#26c281;box-shadow:0 0 0 3px rgba(38,194,129,.2)}
.ub-login .thread{height:340px;display:flex;flex-direction:column;gap:12px;transition:opacity .6s ease,transform .6s ease}
.ub-login .thread.out{opacity:0;transform:translateY(-12px) scale(.98)}
.ub-login .msg{display:flex;gap:9px;align-items:flex-end;max-width:94%}
.ub-login .msg.me{align-self:flex-end;transform-origin:right bottom;animation:fromR .65s cubic-bezier(.2,.8,.2,1) both}
.ub-login .msg.ai{align-self:flex-start;transform-origin:left bottom;animation:fromL .65s cubic-bezier(.2,.8,.2,1) both}
@keyframes fromR{from{opacity:0;transform:translateX(28px) scale(.95)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-28px) scale(.95)}to{opacity:1;transform:none}}
.ub-login .bub{padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.5}
.ub-login .me .bub{background:linear-gradient(135deg,#2455E8,#45A5F5);color:#fff;border-bottom-right-radius:5px;box-shadow:0 10px 22px rgba(36,85,232,.28)}
.ub-login .ai .bub{background:#fff;border:1px solid #d9e7fb;border-bottom-left-radius:5px;box-shadow:0 8px 20px rgba(20,45,99,.08);color:var(--navy)}
.ub-login .ai .bub .tx{animation:fin .5s both}
@keyframes fin{from{opacity:0}to{opacity:1}}
.ub-login .av{width:30px;height:30px;flex:none;object-fit:contain;border-radius:50%;background:#fff;padding:4px;border:1px solid #d9e7fb;box-shadow:0 4px 10px rgba(36,85,232,.15)}
.ub-login .dots{display:flex;gap:5px;padding:5px 2px}
.ub-login .dots b{width:7px;height:7px;border-radius:50%;background:var(--sky);animation:dot 1.2s infinite}
.ub-login .dots b:nth-child(2){animation-delay:.15s}.ub-login .dots b:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.ub-login .info{align-self:flex-start;margin-left:39px;width:calc(100% - 39px);padding:6px 14px;background:#fff;border:1px solid #d9e7fb;border-radius:16px;box-shadow:0 14px 30px rgba(36,85,232,.14);transform-origin:left top;animation:popup .7s cubic-bezier(.2,1.1,.3,1) both}
@keyframes popup{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
.ub-login .it{display:flex;align-items:center;gap:11px;padding:9px 0;font-size:13px;font-weight:600;color:var(--navy);animation:fin .6s var(--d,0s) both}
.ub-login .it+.it{border-top:1px solid #e6eefb}
.ub-login .it small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:1px}
.ub-login .ic{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--light);color:var(--blue);font-size:10px;font-weight:800}
.ub-login .ic svg{width:17px;height:17px}.ub-login .ic.pdf{background:#e8eefe}.ub-login .ic.ppt{background:#dff0ff;color:#1f8ae0}

/* ---------- Login (right) ---------- */
.ub-login .auth{display:flex;align-items:center;justify-content:center;padding:44px 48px}
.ub-login .card{width:100%;max-width:390px;opacity:0;animation:fin .9s .6s both;background:#fff;border-radius:20px;box-shadow:none;border:none;padding:0}
.ub-login .card h2{margin:0 0 8px;font-size:clamp(26px,2.6vw,34px);font-weight:800;letter-spacing:-.025em;line-height:1.15;color:var(--navy)}
.ub-login .card h2 span{background:linear-gradient(90deg,#2455E8,#45A5F5);-webkit-background-clip:text;background-clip:text;color:transparent}
.ub-login .sub{margin:0 0 24px;color:var(--muted);font-size:14.5px;line-height:1.5}
.ub-login .field{margin-bottom:16px}
.ub-login .field label{display:block;margin-bottom:7px;font-size:13px;font-weight:600;color:var(--navy);margin-top:0}
.ub-login .input{position:relative;display:flex;align-items:center}
.ub-login .input>svg{position:absolute;left:14px;width:18px;height:18px;color:var(--muted);transition:color .25s;pointer-events:none}
.ub-login .input input{width:100%;height:50px;padding:0 44px;border-radius:14px;border:1.5px solid var(--line);background:#f8fbff;color:var(--navy);font:inherit;font-size:15px;outline:none;transition:border-color .25s,box-shadow .25s,background .25s}
.ub-login .input input::placeholder{color:#8fa0c2}
.ub-login .input:focus-within input{border-color:var(--blue);box-shadow:0 0 0 4px rgba(36,85,232,.15);background:#fff}
.ub-login .input:focus-within>svg{color:var(--blue)}
.ub-login .field.bad input{border-color:var(--err);box-shadow:0 0 0 4px rgba(217,63,76,.12)}
.ub-login .eye{position:absolute;right:6px;width:38px;height:38px;border:0;background:none;border-radius:10px;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s}
.ub-login .eye:hover{background:rgba(36,85,232,.1);color:var(--blue)}.ub-login .eye svg{width:18px;height:18px}
.ub-login .msgerr{margin:6px 2px 0;font-size:12.5px;color:var(--err);max-height:0;overflow:hidden;opacity:0;transition:max-height .3s,opacity .3s}
.ub-login .bad .msgerr{max-height:40px;opacity:1}
.ub-login .row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 20px;font-size:13.5px}
.ub-login .check{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;color:var(--muted);font-weight:500;margin:0}
.ub-login .check input{position:absolute;opacity:0;pointer-events:none}
.ub-login .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:#f8fbff;display:grid;place-items:center;transition:all .25s}
.ub-login .box svg{width:13px;height:13px;stroke:#fff;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .05s}
.ub-login .check input:checked+.box{background:linear-gradient(135deg,#2455E8,#45A5F5);border-color:transparent;transform:scale(1.05)}
.ub-login .check input:checked+.box svg{stroke-dashoffset:0}
.ub-login .check input:focus-visible+.box{box-shadow:0 0 0 4px rgba(36,85,232,.2)}
.ub-login a{color:var(--blue);font-weight:600;text-decoration:none;position:relative}
.ub-login a::after{content:"";position:absolute;left:0;bottom:-2px;height:1.5px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .3s}
.ub-login a:hover::after{transform:scaleX(1)}
.ub-login .btn{position:relative;width:100%;height:52px;border:0;border-radius:14px;font:inherit;font-size:15.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .2s,box-shadow .3s,background-position .6s;box-shadow:none}
.ub-login .primary{color:#fff;background:linear-gradient(110deg,#2455E8,#45A5F5,#2455E8);background-size:200% 100%;box-shadow:0 10px 24px rgba(36,85,232,.35)}
.ub-login .primary:hover{transform:translateY(-2px);background-position:100% 0;box-shadow:0 14px 30px rgba(36,85,232,.45)}
.ub-login .primary:active{transform:scale(.99)}.ub-login .primary:disabled{cursor:progress;transform:none}
.ub-login .arrow{width:18px;height:18px;transition:transform .25s}.ub-login .primary:hover .arrow{transform:translateX(4px)}
.ub-login .spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite;display:none}
@keyframes sp{to{transform:rotate(360deg)}}
.ub-login .loading .spin{display:block}.ub-login .loading .arrow{display:none}
.ub-login .alert{display:none;align-items:center;gap:8px;margin-bottom:16px;padding:11px 14px;border-radius:12px;font-size:13.5px;font-weight:500}
.ub-login .alert.show{display:flex;animation:fin .4s both}
.ub-login .alert.err{background:rgba(217,63,76,.1);color:var(--err);border:1px solid rgba(217,63,76,.3)}
.ub-login .alert.ok{background:rgba(25,160,100,.1);color:#17935a;border:1px solid rgba(25,160,100,.3)}
.ub-login .alert svg{width:17px;height:17px;flex:none}
.ub-login .or{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:12.5px}
.ub-login .or::before,.ub-login .or::after{content:"";flex:1;height:1px;background:var(--line)}
.ub-login .google{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.ub-login .google:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 10px 24px rgba(36,85,232,.14)}
.ub-login .google svg{width:19px;height:19px}
.ub-login .foot{margin-top:24px;font-size:12.5px;color:var(--muted);text-align:center}
.ub-login .demo-pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.ub-login .demo-pill{padding:5px 12px;border-radius:8px;background:rgba(36,85,232,.08);border:1px solid rgba(36,85,232,.18);color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
.ub-login .demo-pill:hover{background:rgba(36,85,232,.16);border-color:var(--blue);transform:translateY(-1px)}
.ub-login .shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- Floating decor (behind panel, around edges) ---------- */

let toastTimer;
const toast=m=>{
  S.toast=m;
  let node=$('#app .toast');
  if(!node){node=document.createElement('div');node.className='toast';$('#app')?.append(node)}

  toastTimer=setTimeout(()=>{S.toast='';$('#app .toast')?.remove()},2800);
};

// Backend API client.
const sleepMs=ms=>new Promise(r=>setTimeout(r,ms));
window.__ubTimes=window.__ubTimes||[];
async function apiCall(endpoint,options={}){
  if(!UB_API_BASE)return {ok:false,status:0,error:'Backend URL is not configured for this website.'};
  const method=String(options.method||'GET').toUpperCase();
  const attempts=(method==='GET'||options.idempotent)?3:1;
  const started=performance.now();
  const label=endpoint.split('?')[0].replace(/[0-9a-f]{8}-[0-9a-f-]{27}/g,':id');
  const token=localStorage.getItem('ub-token');
  const headers={...((typeof FormData!=='undefined'&&options.body instanceof FormData)?{}:{'Content-Type':'application/json'}),...(options.headers||{})};
  if(token)headers['Authorization']=`Bearer ${token}`;
  for(let i=0;i<attempts;i++){
    const last=i===attempts-1;
    try{
      const res=await fetch(UB_API_BASE+endpoint,{...options,headers});
      window.__ubTimes.push({endpoint:label,status:res.status,ms:Math.round(performance.now()-started)});
      if(!res.ok){
        if(!last&&[502,503,504].includes(res.status)){await sleepMs(1500*(i+1));continue}
        let errData=null;
        try{errData=await res.json()}catch(e){}
        const errDetail=errData?.detail||errData?.message||`HTTP ${res.status}`;
        return {ok:false,status:res.status,error:errDetail,data:null};
      }
      if(res.status===204)return {ok:true,status:204,data:null};
      const data=await res.json();
      return {ok:true,status:res.status,data};
    }catch(err){
      if(!last){await sleepMs(1500*(i+1));continue}
      return {ok:false,status:0,error:err.message||'Network error',data:null};
    }
  }
  return {ok:false,status:0,error:'Request failed after attempts',data:null};
}

function docView(d){return {...d,id:d.id.slice(0,8),uuid:d.id,status:d.processing_status,publication:d.publication_status,date:new Date(d.created_at).toLocaleDateString()}}
function watchDocProcessing(){}
async function pollDocProcessing(){}
function applyTicketUpdate(data){
  if(!data)return;
  const t=data.ticket||data;
  const idx=S.tickets.findIndex(x=>x.uuid===t.id||x.id===t.id);
  const updated={...ticketView(t),dept:deptLabel(t)};
  if(idx>=0)S.tickets[idx]=updated;else S.tickets.unshift(updated);
  if(S.detail?.ticket?.uuid===t.id)S.detail={ticket:updated,events:data.events||S.detail.events||[]};
}
async function reloadTicketList(){
  const r=await apiCall('/tickets?limit=50');
  if(r.ok)S.tickets=pageItems(r).map(ticketView).map(x=>({...x,dept:deptLabel(x)}));
}
function ticketView(t){return {...t,id:t.ticket_number||t.id,uuid:t.id,subj:t.subject,q:t.question,desc:t.description||'',pri:t.priority||'medium',status:t.status||'submitted',date:new Date(t.created_at).toLocaleDateString(),dept:t.department_name||'Department',fac:t.assigned_faculty_id?'Assigned':'Unassigned',reply:'',events:t.events||[]}}
const pageItems=r=>Array.isArray(r.data)?r.data:(Array.isArray(r.data?.items)?r.data.items:[]);
const deptLabel=t=>t.department_name||(S.departments||[]).find(d=>d.id===t.department_id)?.name||'Department';

// Central data loader for views
async function loadViewData(view=S.view){
  if(!S.user)return;
  S.loading=true;
  const tasks=[];
  if(S.user.id!==S.chatOwner){S.chat=[];S.hist=[];S.conversationId=null;S.restoredChat=false;S.chatOwner=S.user.id}
  if(S.role==='student')tasks.push(loadConversations());
  if(['student','faculty','authority'].includes(S.role)&&['chat','queries','tix','fdash','x'].includes(view))tasks.push(apiCall('/tickets?limit=50').then(r=>{if(r.ok)S.tickets=pageItems(r).map(ticketView)}));
  if((view==='docs'||view==='x')&&S.role!=='management')tasks.push(apiCall(['faculty','authority'].includes(S.role)?'/documents?'+listQuery('doc'):'/documents?limit=50').then(r=>{
    const fetched = (r.ok && Array.isArray(r.data?.items || r.data)) ? pageItems(r).map(d=>({...d,id:d.id.slice(0,8),uuid:d.id,status:d.processing_status,publication:d.publication_status,date:new Date(d.created_at).toLocaleDateString()})) : [];
    const existingUuids = new Set(fetched.map(d => d.uuid));
    const merged = [...fetched, ...DEMO_DOCUMENTS.filter(d => !existingUuids.has(d.uuid))];
    S.docs = merged;
    if(r.ok) S.docTotal = merged.length;
  }));
  if((view==='ann'||view==='x')&&S.role!=='management')tasks.push(apiCall(['faculty','authority'].includes(S.role)?'/announcements?'+listQuery('ann'):'/announcements?limit=20').then(r=>{if(r.ok)S.annTotal=r.data?.total??null;if(r.ok)S.announcements=pageItems(r).map(a=>({...a,c:a.category||'Notice',t:a.title,b:a.body,d:new Date(a.created_at).toLocaleDateString(),tone:'blue',big:a.is_important,imp:a.is_important}))}));
  if(['student','faculty','authority'].includes(S.role)&&!S.departments.length)tasks.push(apiCall('/departments').then(r=>{if(r.ok)S.departments=Array.isArray(r.data)?r.data:[]}));
  if(['faculty','authority'].includes(S.role)&&['publish','courses','docs','ann','x'].includes(view)){tasks.push(apiCall(S.role==='authority'?'/courses?include_inactive=true':'/courses').then(r=>{if(r.ok)S.courses=Array.isArray(r.data)?r.data:[]}));tasks.push(apiCall(S.role==='authority'?'/filter-options?include_inactive=true':'/filter-options').then(r=>{if(r.ok)S.options=Array.isArray(r.data)?r.data:[]}))}
  if(view==='fdash'||(view==='x'&&S.role!=='management'))tasks.push(apiCall(S.role==='management'?'/management/stats':'/dashboard/staff').then(r=>{if(r.ok)S.dashboard=r.data}));
  if(view==='x'&&S.role==='management')tasks.push(apiCall('/management/analytics').then(r=>{if(r.ok)S.analytics=r.data}));
  if(S.bell&&S.role!=='management')tasks.push(apiCall('/notifications?limit=20').then(r=>{if(r.ok)S.notifs=pageItems(r).map(n=>({id:n.id,t:n.text||'Update',u:!n.is_read,tk:n.ticket_id}))}));
  await Promise.all(tasks);S.tickets.forEach(t=>{t.dept=deptLabel(t)});
  if(S.role==='student'&&!S.restoredChat){S.restoredChat=true;if(S.hist.length&&!S.chat.length&&!S.conversationId)await openConversation(S.hist[0].id,false)}
  S.loading=false;R();
  watchOpenTicket();
}

// Google Sign-In Credential Handler
async function handleGoogleCredential(id_token){
  if(!id_token)return;
  const er=$('#err');
  const began=Date.now();
  const progress=()=>{if(er)er.textContent=`Verifying with UniBuddy Google Auth... ${Math.round((Date.now()-began)/1000)}s`+(Date.now()-began>8000?' (connecting to backend)':'')};
  progress();
  const ticker=setInterval(progress,1000);
  let res;
  try{
    res=await apiCall('/auth/google',{method:'POST',body:JSON.stringify({id_token}),idempotent:true});
  }finally{clearInterval(ticker)}

  if(res.ok&&res.data?.access_token){
    localStorage.setItem('ub-token',res.data.access_token);
    const meRes=await apiCall('/auth/me');
    if(meRes.ok&&meRes.data){
      const me=meRes.data;
      S.user={id:me.id,email:me.email,name:me.full_name||me.email.split('@')[0],full_name:me.full_name,role:me.role,campus_id:me.campus_id,department_id:me.department_id};
      S.role=me.role;
      S.scr='app';S.view=me.role=='student'?'chat':me.role=='faculty'?'tix':'x';
      R();await loadViewData(S.view);
      toast('Signed in as '+(me.full_name||me.email));
      return;
    }
    localStorage.removeItem('ub-token');
  }

  if(res.status===403&&res.error?.code==='no_profile'){
    S.modal={type:'access-request',id_token,msg:'Your Google identity is verified, but no student or staff profile exists for this email yet.'};
    R();
    return;
  }

  const messages={0:'Cannot reach UniBuddy right now. Check backend connection.',401:'Google could not verify this sign-in. Try again.',409:'This Google account is linked differently. Contact campus administrator.',503:'UniBuddy sign-in service is currently not configured.'};
  const msg=(typeof res.error==='object'?(res.error.message||res.error.code):res.error)||messages[res.status]||'Sign-in failed. Please try again.';
  if(er)er.textContent=msg;
  toast(msg);
}

function applyLogos(root){
  const el = root || document;
  const imgs = el.querySelectorAll('img[data-logo]');
  for(let i=0; i<imgs.length; i++){
    imgs[i].src = 'logo.png';
    imgs[i].onerror = function(){ this.src = LOGO; };
  }
}

let loginThreadTimer = null;
let loginThreadActive = false;

function stopLoginThread(){
  loginThreadActive = false;
  if(loginThreadTimer){
    clearTimeout(loginThreadTimer);
    loginThreadTimer = null;
  }
}

function startLoginThread(){
  stopLoginThread();
  loginThreadActive = true;
  const thread = document.getElementById('thread');
  if(!thread) return;

  const ic = {
    code:'<path d="m8 8-4 4 4 4M16 8l4 4-4 4"/>',
    file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
    cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
  };
  function svg(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">'+ic[n]+'</svg>'}
  function item(icon,t,s,d,cls){return '<div class="it" style="--d:'+d+'s"><span class="ic '+(cls||'')+'">'+icon+'</span><span>'+t+'<small>'+s+'</small></span></div>'}
  const cards = {
    deadline: item(svg('clock'),'DSA Assignment','Due 20 Nov 2026 · 11:59 PM',.1),
    news: item(svg('code'),'Technical Workshop','Hands-on session this Friday',.1)+item(svg('file'),'DSA Assignment Notice','Submission guidelines updated',.35)+item(svg('cal'),'Upcoming University Event','Annual Tech Fest · 28 Nov',.6),
    files: item('PDF','CS &amp; AI – Unit 3 Notes.pdf','2.4 MB · Updated today',.1,'pdf')+item('PPT','Neural Networks Lecture.ppt','18 slides · Week 9',.35,'ppt')
  };
  const scenes = [
    {q:'Hey UniBuddy, when is my DSA assignment deadline?', a:'Your DSA assignment is due on 20 November 2026. Make sure to submit it before 11:59 PM.', c:'deadline'},
    {q:'Show me the latest university announcements.', a:'Here are the latest updates from your university.', c:'news'},
    {q:'Can you help me find my course materials?', a:'Of course! I found your CS &amp; AI course resources. Here are your available study materials.', c:'files'}
  ];

  function addEl(html){
    const d = document.createElement('div');
    d.innerHTML = html;
    const n = d.firstElementChild;
    applyLogos(n);
    thread.appendChild(n);
    return n;
  }

  const wait = ms => new Promise(r => {
    loginThreadTimer = setTimeout(r, ms);
  });

  async function loop(){
    await wait(1200);
    for(let i=0; loginThreadActive; i = (i+1) % scenes.length){
      const s = scenes[i];
      if(!loginThreadActive || !document.getElementById('thread')) break;
      thread.classList.remove('out');
      thread.innerHTML = '';
      addEl('<div class="msg me"><div class="bub">'+s.q+'</div></div>');
      await wait(1100);
      if(!loginThreadActive) break;
      const ai = addEl('<div class="msg ai"><img class="av" data-logo alt="UniBuddy"><div class="bub"><div class="dots"><b></b><b></b><b></b></div></div></div>');
      await wait(1900);
      if(!loginThreadActive) break;
      const bub = ai.querySelector('.bub');
      if(bub) bub.innerHTML = '<span class="tx">'+s.a+'</span>';
      await wait(1500);
      if(!loginThreadActive) break;
      addEl('<div class="info">'+cards[s.c]+'</div>');
      await wait(5200);
      if(!loginThreadActive) break;
      thread.classList.add('out');
      await wait(750);
    }
  }

  loop();
}

function initLoginEntrances(){
  const reduce = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || false;
  const slot = document.getElementById('slot');
  const hero = document.getElementById('hero');
  const word = document.getElementById('word');
  if(!slot || !hero) return;

  function fly(el, from, delay, done){
    if(reduce || !el.animate){
      if(el && el.style) el.style.opacity = '1';
      if(done) done();
      return;
    }
    const r = el.getBoundingClientRect();
    const W = window.innerWidth, H = window.innerHeight;
    let sx, sy, mx, my;
    if(from === 'tr'){
      sx = W - r.left + 90;
      sy = -r.top - 160;
      mx = sx * 0.4;
      my = H * 0.3;
    } else {
      sx = -r.left - 220;
      sy = H - r.top + 140;
      mx = sx * 0.4;
      my = sy * 0.28;
    }
    const t = (x, y, s) => 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    const an = el.animate([
      { transform: t(sx, sy, 1.7), opacity: 0, offset: 0 },
      { transform: t(sx, sy, 1.7), opacity: 1, offset: 0.06 },
      { transform: t(mx, my, 1.4), opacity: 1, offset: 0.52 },
      { transform: t(-6, 4, 1.08), opacity: 1, offset: 0.8 },
      { transform: t(2, -1, 0.98), opacity: 1, offset: 0.9 },
      { transform: t(0, 0, 1), opacity: 1, offset: 1 }
    ], { duration: 2800, delay: delay, easing: 'cubic-bezier(.3,.7,.25,1)', fill: 'both' });
    if(done) an.onfinish = done;
  }

  fly(hero, 'bl', 500);
  fly(slot, 'tr', 900, () => {
    if(word) word.classList.add('on');
  });
  if(reduce && word) word.classList.add('on');
}

function bannerLogin(type, text){
  const alertEl = document.getElementById('alert');
  if(!alertEl) return;
  if(!text){
    alertEl.className = 'alert';
    alertEl.innerHTML = '';
    return;

// Email-Based Role Authentication & Session Management
function doLogin(){
  const emInput = document.getElementById('email') || document.getElementById('em');
  const pwInput = document.getElementById('pass') || document.getElementById('pw');
  const card = document.getElementById('card');
  const btn = document.getElementById('submit');
  const lbl = document.getElementById('label');
  const e = (emInput?.value || '').trim().toLowerCase();
  const p = pwInput?.value || '';

  const fEmail = document.getElementById('f-email');
  const fPass = document.getElementById('f-pass');
  if(fEmail) fEmail.classList.remove('bad');
  if(fPass) fPass.classList.remove('bad');
  bannerLogin('', '');

  const okE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  const okP = p.length >= 6;

  if(!okE || !okP){
    if(fEmail) fEmail.classList.toggle('bad', !okE);
    if(fPass) fPass.classList.toggle('bad', !okP);
    if(card){
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
    return;
  }

  if(btn){
    btn.disabled = true;
    btn.classList.add('loading');
  }
  if(lbl) lbl.textContent = 'Signing in…';

  setTimeout(() => {
    const a = ACC[e];
    if(!a){
      if(btn){ btn.disabled = false; btn.classList.remove('loading'); }
      if(lbl) lbl.textContent = 'Sign in';
      bannerLogin('err', 'No registered account found for this email. Check your address or select a demo account.');
      if(card){ card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
      return;
    }

    if(!VALID_PWS.includes(p)){
      if(btn){ btn.disabled = false; btn.classList.remove('loading'); }
      if(lbl) lbl.textContent = 'Sign in';
      bannerLogin('err', 'Incorrect password. Universal demo password is ' + DPW + '.');
      if(card){ card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
      return;
    }

    bannerLogin('ok', 'Signed in successfully. Redirecting to your dashboard…');
    try{
      const rm = document.getElementById('remember') || document.getElementById('rm');
      if(rm?.checked) localStorage.setItem('ub-email', e);
      else localStorage.removeItem('ub-email');
      localStorage.setItem('ub-current-user', e);
    }catch(x){}

    S.user = { ...a, email: e };
    S.role = a.role;
    S.view = a.role == 'student' ? 'chat' : a.role == 'faculty' ? 'tix' : a.role == 'management' ? 'kb' : 'x';

    setTimeout(() => {
      stopLoginThread();
      go(PR[e] ? 'app' : 'onboard');
      toast('Signed in as ' + (a.name || e));
    }, 650);
  }, 350);
}

let landingHeroToken = { active: false };
let landingDemoBusy = false;
let landingParallaxAttached = false;
let landingObservers = [];

function stopLandingAnimation(){
  landingHeroToken.active = false;
  landingObservers.forEach(o => { try{ o.disconnect(); }catch(e){} });
  landingObservers = [];
}

async function sayLandingChat(el, m, token){
  if(!el || !token.active) return;
  const sc = () => el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
  const rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  if(m.r == 'u'){
    await sleep(rm ? 50 : 700);
    if(!token.active) return;
    const d = document.createElement('div');
    d.className = 'm u';
    d.textContent = m.t;
    el.append(d);
    sc();
    return;
  }
  const t = document.createElement('div');
  t.className = 'm b ty';
  t.innerHTML = '<s></s><s></s><s></s>';
  el.append(t);
  sc();
  await sleep(rm ? 50 : 1300);
  if(!token.active) return;
  t.className = 'm b';
  t.textContent = m.t;
  if(m.c){
    const c = document.createElement('div');
    c.className = 'mc';
    c.innerHTML = m.c.map(x => '<span>' + x + '</span>').join('');
    el.append(c);
  }
  sc();
}

async function runHeroChatLoop(el, token){
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const H = [
    [
      { r: 'u', t: 'When is my DSA assignment deadline?' },
      { r: 'b', t: 'Your DSA assignment is due on 20 November. Don’t forget to submit it before 11:59 PM!' }
    ],
    [
      { r: 'u', t: 'Show me the latest university announcements.' },
      { r: 'b', t: 'Here are the latest updates from your university.', c: ['📢 Exam schedule', '📄 DSA_Notes.pdf', '🎓 Seminar notice'] }
    ]
  ];
  while(token.active && S.scr === 'landing'){
    for(const cv of H){
      for(const m of cv){
        if(!token.active || S.scr !== 'landing') return;
        await sayLandingChat(el, m, token);
      }
      if(!token.active || S.scr !== 'landing') return;
      await sleep(rm ? 1500 : 2800);
    }
    if(!token.active || S.scr !== 'landing') return;
    el.innerHTML = '';
    await sleep(500);
  }
}

// Answers are plain text from the model. Escape first, then turn **bold**, '-' bullets, numbered lists and
// paragraphs into tags. Nothing from the answer is ever treated as HTML.
function fmtAnswer(t){
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  let html='',list=null,para=[];
  const flushPara=()=>{if(para.length){html+=`<p>${para.join(' ')}</p>`;para=[]}};
  const closeList=()=>{if(list){html+=`</${list}>`;list=null}};
  for(const raw of esc(String(t||'')).replace(/\r/g,'').split('\n')){
    const line=raw.trim();
    if(!line){flushPara();closeList();continue}
    const bullet=line.match(/^[-*\u2022]\s+(.*)$/),numbered=line.match(/^\d+[.)]\s+(.*)$/);
    if(bullet||numbered){
      flushPara();const kind=bullet?'ul':'ol';
      if(list!==kind){closeList();html+=`<${kind}>`;list=kind}
      html+=`<li>${inline((bullet||numbered)[1])}</li>`;continue;
    }
    closeList();para.push(inline(line));
  }
  flushPara();closeList();
  return html||'<p></p>';
}

// Ask AI Assistant — calls the real backend RAG endpoint.
async function ask(q){
  if(!q||!q.trim())return;
  const cleanQ=q.trim();
  S.chat.push({r:'u',t:cleanQ,time:now(),n:1});
  S.chat.push({r:'a',k:'ty',n:1});
  S.view='chat';
  R();
  
  // Ask the real backend RAG service; never fabricate a local answer.
  const backendRes=await apiCall('/chat/ask',{
    method:'POST',
    body:JSON.stringify({question:cleanQ,conversation_id:S.conversationId||null})
  });
  
  S.chat.pop(); // Remove typing indicator
  
  if(backendRes.ok&&backendRes.data){
    const d=backendRes.data;
    const userMessage=S.chat.at(-1);if(userMessage)userMessage.mid=d.user_message_id;
    if(d.conversation_id)S.conversationId=d.conversation_id;
    if(!d.abstained){
      S.chat.push({r:'a',k:'ok',t:d.answer,citations:d.citations||[],time:now(),n:1,mid:d.assistant_message_id});
    }else{
      S.chat.push({r:'a',k:'nf',t:d.answer,time:now(),n:1,mid:d.assistant_message_id});
    }
  }else{
    S.chat.push({r:'a',k:'err',t:'The UniBuddy assistant is unavailable right now. Please try again later.',time:now(),n:1});
  }
  R();
  loadConversations().then(R);
}

const fmtTime=iso=>{try{return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
// Chat history on screen covers the last 72 hours. Older messages stay stored on the server; only the display changes.
const CHAT_VISIBLE_MS=72*60*60*1000;

async function openConversation(id,render=true){

// Date choices use the browser's local calendar; the server receives instants.
function dateRange(f){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
  let from=null,before=null;
  if(f.date==='today'){from=new Date(y,m,d);before=new Date(y,m,d+1)}
  else if(f.date==='previous_month'){from=new Date(y,m-1,1);before=new Date(y,m,1)}
  else if(f.date==='previous_year'){from=new Date(y-1,0,1);before=new Date(y,0,1)}
  else if(f.date==='custom'){
    if(f.from){const x=new Date(f.from+'T00:00:00');from=x}
    if(f.to){const t=new Date(f.to+'T00:00:00');before=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1)}
  }
  return {from:from?from.toISOString():'',before:before?before.toISOString():''};
}
function listQuery(kind){
  const f=F(kind),p=new URLSearchParams({limit:'100'});
  if(f.academic_year)p.set('academic_year',f.academic_year);
  if(f.batch)p.set('batch_year',f.batch);
  if(f.section)p.set('section',f.section);
  if(f.course)p.set('course_id',f.course);
  if(f.audience)p.set(kind==='ann'?'audience':'visibility',f.audience);
  if(f.scope)p.set('scope',f.scope);
  const r=dateRange(f);if(r.from)p.set('created_from',r.from);if(r.before)p.set('created_before',r.before);
  return p.toString();
}

// Opens a PDF through the server. The request carries the session token; the response is shown from a
// temporary local address, which is released when the dialog closes.
async function openPdf(uuid){
  S.modal={type:'pdf',uuid};S.pdf={state:'loading'};R();
  const demoDoc = (S.docs || []).find(d => d.uuid === uuid && (d.isDemo || String(d.uuid).startsWith('demo-')));
  if (demoDoc) {
    const htmlContent = `<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>${esc(demoDoc.title)}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 40px; background: #f8fafc; color: #1e293b; line-height: 1.6; }
  .sheet { max-width: 680px; margin: 0 auto; background: #fff; padding: 48px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
  .header { border-bottom: 2px solid #2f6fe4; padding-bottom: 20px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 20px; font-weight: 700; color: #1e3a8a; }

  h1 { font-size: 22px; color: #0f172a; margin: 0 0 12px 0; }
  .meta { font-size: 13px; color: #64748b; margin-bottom: 24px; }
  .content { font-size: 15px; color: #334155; }
  .content p { margin-bottom: 16px; }
  .stamp { margin-top: 36px; padding: 16px; background: #f1f5f9; border-left: 4px solid #2f6fe4; border-radius: 4px; font-size: 13px; color: #475569; }
</style>
</head>
<body>
  <div class="sheet">
    <div class="header">
      <div class="brand">UniBuddy University Portal</div>
      <span class="tag">Official Document</span>
    </div>
    <h1>${esc(demoDoc.title)}</h1>
    <div class="meta">Category: ${esc(demoDoc.category || 'General')} · Date: ${esc(demoDoc.date || 'Current')} · File: ${esc(demoDoc.original_filename || 'document.pdf')}</div>
    <div class="content">
      <p><strong>Overview:</strong></p>
      <p>${esc(demoDoc.description || 'This document contains official guidelines, procedural notices, and administrative reference material for students and faculty of the university.')}</p>
      <p><strong>Key Highlights:</strong></p>
      <ul>
        <li>Official academic and campus regulations published under institutional governance.</li>
        <li>Applicable to all enrolled students for the current academic session.</li>
        <li>For any questions or clarification regarding this document, use the AI Assistant or raise a query in the portal.</li>
      </ul>
      <div class="stamp">
        <strong>Document Verification:</strong><br>
        Status: Verified Official Demonstration Copy<br>
        System Reference ID: ${esc(demoDoc.uuid)}
      </div>
    </div>
  </div>
</body>
</html>`;
    const blob = new Blob([htmlContent], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    if(S.pdf?.url) URL.revokeObjectURL(S.pdf.url);
    S.pdf = { state: 'ready', url, isDemo: true };
    R();
    return;
  }
  try{
    const res=await fetch(UB_API_BASE+`/documents/${uuid}/file`,{headers:{Authorization:`Bearer ${localStorage.getItem('ub-token')||''}`}});
    if(!res.ok){
      let message='This PDF cannot be opened right now.';
      try{const j=await res.json();if(typeof j.detail==='string')message=j.detail}catch(e){}
      if(res.status===401)message='Your session has ended. Sign in again to open this PDF.';
      S.pdf={state:'error',message};R();return;
    }
    const url=URL.createObjectURL(await res.blob());
    if(S.pdf?.url)URL.revokeObjectURL(S.pdf.url);
    S.pdf={state:'ready',url};R();
  }catch(e){S.pdf={state:'error',message:'Could not reach the server. Check your connection and try again.'};R()}
}
